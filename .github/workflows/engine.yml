name: Moteur de l'appli web

# Essais des scripts du moteur (.github/claw-web) avec une fausse API GitHub : quelques
# secondes, seulement quand ils changent.
on:
  push:
    branches: [main]
    paths:
      - ".github/claw-web/**"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - ".github/claw-web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .github/claw-web
    steps:
      - uses: actions/checkout@v6
      - name: Essais
        run: |
          python3 -m py_compile *.py
          python3 -m unittest discover -v -p "test_*.py"
