name: Diagnostic Linux

# Diagnostic d'un blocage des tests Linux de la CI : la commande exacte de la CI, sur une
# seule machine, sous des limites de mémoire et de processus ; toutes les 20 s, le nombre
# de processus et les plus gros sont notés, et publiés comme statut du commit (lisible même
# quand la machine fige et que son journal est perdu). À la demande seulement.
on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  tests:
    name: Tests comme la CI, avec relevé des processus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Configurer git (tests des commandes /branch et /worktree)
        run: |
          git config --global user.name "claw-ci"
          git config --global user.email "claw-ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Compilation
        run: cargo build --workspace --all-targets --locked
      - name: Tests avec relevé des processus
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          statut() {
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state="$1" -f context="diagnostic/processus" -f description="$2" > /dev/null 2>&1
          }
          (
            while true; do
              count=$(ps -e --no-headers | wc -l)
              free=$(free -m | awk '/Mem:/ {print $7}')
              top=$(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s %dM, ", $2, $1/1024}')
              names=$(ps -eo comm= | sort | uniq -c | sort -rn | head -3 | awk '{printf "%s x%s, ", $2, $1}')
              line="$(date +%H:%M:%S) $count proc, ${free}M libres ; $names; $top"
              echo "$line" >> /tmp/releve.txt
              statut pending "${line:0:139}"
              sleep 20
            done
          ) &
          monitor=$!
          ulimit -u 3000
          ulimit -v 8000000
          timeout -k 10 900 cargo test --workspace --locked --no-fail-fast -- --test-threads=1 > /tmp/tests.txt 2>&1
          code=$?
          kill $monitor
          echo "=== code des tests : $code"
          grep -E "^test result|Running " /tmp/tests.txt | tail -40
          echo "=== relevé"
          cat /tmp/releve.txt
          echo "=== fin de la sortie"
          tail -n 30 /tmp/tests.txt
          statut success "code $code"
