name: Essais réels

# Banc d'essais réels de Claw (rust/scripts/real-tests) avec de vrais modèles de NVIDIA, lancé
# à la main : chaque scénario est noté par sa vérification cachée. Claw est compilé une fois,
# puis chaque scénario a son job : son journal (résumé, note détaillée, remarques de Claw,
# trace de la session) se lit dès que ce scénario est fini, sans attendre les autres. La clé
# (secret NVIDIA_API_KEY) n'est jamais écrite : GitHub la masque dans le journal, et elle est
# retirée des fichiers des essais avant leur dépôt en artefact (une commande de l'agent
# pourrait l'avoir affichée).

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scénarios, séparés par des espaces (t1-inventaire … t8-materiel), ou « tous »"
        required: true
        default: "t1-inventaire"
        type: string
      model:
        description: Modèle de NVIDIA
        required: true
        default: nvidia:nvidia/nemotron-3-ultra-550b-a55b
        type: choice
        options:
          - nvidia:nvidia/nemotron-3-ultra-550b-a55b
          - nvidia:nvidia/nemotron-3-super-120b-a12b
          - nvidia:nvidia/nemotron-3.5-lightning-30b-a3b
      label:
        description: Étiquette des essais (dans leur nom)
        required: false
        default: ""
        type: string
      timeout:
        description: Durée maximale d'un essai, en secondes
        required: false
        default: "1500"
        type: string
      parallel:
        description: Scénarios lancés en même temps (NVIDIA limite à une quarantaine de requêtes par minute)
        required: false
        default: "3"
        type: string

permissions:
  contents: read

# Un banc à la fois, pour rester sous la limite de requêtes de NVIDIA.
concurrency:
  group: real-tests
  cancel-in-progress: false

jobs:
  claw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v6

      - name: Clé NVIDIA présente
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::Secret NVIDIA_API_KEY absent : Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Scénarios
        id: list
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          from pathlib import Path
          known = sorted(path.name for path in Path("rust/scripts/real-tests/scenarios").iterdir() if path.is_dir())
          asked = os.environ["SCENARIOS"].split()
          chosen = known if asked == ["tous"] else asked
          unknown = [name for name in chosen if name not in known]
          if unknown or not chosen:
              print(f"::error::Scénarios inconnus : {' '.join(unknown) or '(aucun)'}. Connus : {' '.join(known)}")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"scenarios={json.dumps(chosen)}\n")
          EOF

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Compiler Claw
        working-directory: rust
        run: cargo build --locked -p claw-cli

      - uses: actions/upload-artifact@v7
        with:
          name: claw-${{ github.run_id }}
          path: rust/target/debug/claw
          retention-days: 1

  essai:
    needs: claw
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        scenario: ${{ fromJSON(needs.claw.outputs.scenarios) }}
    name: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: claw-${{ github.run_id }}
          path: ${{ runner.temp }}/claw-bin

      # Les projets des scénarios se vérifient avec pytest. Installé pour tout le
      # système : les commandes de Claw ont leur propre dossier personnel (bac à
      # sable), où un pytest de ~/.local serait introuvable.
      - name: Outils des scénarios
        run: |
          chmod +x "$RUNNER_TEMP/claw-bin/claw"
          sudo python3 -m pip install --quiet --break-system-packages pytest

      - name: Essai
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SCENARIO: ${{ matrix.scenario }}
          MODEL: ${{ inputs.model }}
          LABEL: ${{ inputs.label }}
          TIMEOUT: ${{ inputs.timeout }}
          # Hors du dépôt : le modèle ne doit lire ni le dépôt ni ses fichiers d'instructions.
          CLAW_REAL_TESTS_DIR: ${{ runner.temp }}/claw-real-tests
          CLAW_LANGUAGE: français
          PYTHONIOENCODING: utf-8
        run: |
          git config --global user.name claw-bench
          git config --global user.email bench@localhost
          git config --global init.defaultBranch main
          python3 rust/scripts/real-tests/run.py "$SCENARIO" --model "$MODEL" --label "${LABEL:-nvidia}" \
            --timeout "$TIMEOUT" --claw "$RUNNER_TEMP/claw-bin/claw" || echo "::warning::$SCENARIO : le lanceur a échoué"

      - name: Résultat et trace
        if: always()
        env:
          RUNS: ${{ runner.temp }}/claw-real-tests
          PYTHONIOENCODING: utf-8
        run: python3 rust/scripts/real-tests/report.py "$RUNS"

      - name: Retirer la clé des fichiers de l'essai
        if: always()
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          RUNS: ${{ runner.temp }}/claw-real-tests
        run: |
          python3 - <<'EOF'
          import os
          from pathlib import Path
          key = os.environ["NVIDIA_API_KEY"].encode()
          runs = Path(os.environ["RUNS"])
          for path in runs.rglob("*") if runs.exists() and key else []:
              if path.is_file() and not path.is_symlink():
                  data = path.read_bytes()
                  if key in data:
                      path.write_bytes(data.replace(key, b"***"))
          EOF

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: essai-${{ matrix.scenario }}-${{ github.run_id }}
          path: ${{ runner.temp }}/claw-real-tests
          retention-days: 14
          if-no-files-found: ignore
