name: Rust

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**/*.md", "rust/docs/**", "assets/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Dépôt privé : minutes de CI comptées (Windows x2, macOS x10). Un nouveau push
# annule la vérification en cours du précédent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: rust

jobs:
  fmt:
    name: Formatage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Configurer git (tests des commandes /branch et /worktree)
        run: |
          git config --global user.name "claw-ci"
          git config --global user.email "claw-ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Compilation
        run: cargo build --workspace --all-targets --locked
      # Les tests changent le dossier courant du processus : un seul fil.
      # Un test bloqué arrête l'étape au bout de 15 minutes (les tests en prennent 2) :
      # le journal reste lisible, ce qui n'est pas le cas d'une exécution annulée.
      - name: Tests
        shell: bash
        timeout-minutes: 15
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1 2>&1 | tee test-output.log
      # Avec un seul fil, le test en cours est écrit avant son résultat : la fin de la
      # sortie nomme le test bloqué.
      - name: Fin de la sortie des tests
        if: failure()
        shell: bash
        run: '[ -f test-output.log ] && tail -n 12 test-output.log | sed "s/^/::warning title=Fin des tests::/" || true'
      # Chaque test en échec devient une annotation avec sa sortie : visible
      # sur la page du run sans ouvrir les journaux.
      - name: Annoter les tests en échec
        if: failure()
        shell: bash
        run: |
          [ -f test-output.log ] || exit 0
          tr -d '\r' < test-output.log | awk '
            /^---- .* stdout ----$/ {
              if (msg != "") print substr(msg, 1, 4000)
              title = $2; gsub(/%/, "%25", title); gsub(/:/, "%3A", title); gsub(/,/, "%2C", title)
              msg = "::error title=Test en échec " title "::"; next
            }
            /^failures:$/ { if (msg != "") print substr(msg, 1, 4000); msg = ""; next }
            msg != "" { gsub(/%/, "%25"); msg = msg $0 "%0A"; next }
            /^error: / { print "::error::" $0 }
            END { if (msg != "") print substr(msg, 1, 4000) }'

  release:
    name: Binaire ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Compilation release
        run: cargo build --release --locked -p claw-cli --target ${{ matrix.target }}
      - name: Archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "claw-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/claw.exe" $name
          Copy-Item README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=rust/$name.zip" >> $env:GITHUB_ENV
      - name: Archive (Linux)
        if: matrix.archive == 'tar.gz'
        run: |
          name="claw-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/claw" README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=rust/$name.tar.gz" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
