name: Rust

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: rust

jobs:
  fmt:
    name: Formatage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Configurer git (tests des commandes /branch et /worktree)
        run: |
          git config --global user.name "claw-ci"
          git config --global user.email "claw-ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Compilation
        run: cargo build --workspace --all-targets --locked
      # Les tests changent le dossier courant du processus : un seul fil.
      - name: Tests
        shell: bash
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1 2>&1 | tee test-output.log
      # Les journaux exigent d'être connecté à GitHub, les annotations sont
      # publiques : chaque test en échec y figure avec sa sortie.
      - name: Annoter les tests en échec
        if: failure()
        shell: bash
        run: |
          [ -f test-output.log ] || exit 0
          tr -d '\r' < test-output.log | awk '
            /^---- .* stdout ----$/ {
              if (msg != "") print substr(msg, 1, 4000)
              title = $2; gsub(/%/, "%25", title); gsub(/:/, "%3A", title); gsub(/,/, "%2C", title)
              msg = "::error title=Test en échec " title "::"; next
            }
            /^failures:$/ { if (msg != "") print substr(msg, 1, 4000); msg = ""; next }
            msg != "" { gsub(/%/, "%25"); msg = msg $0 "%0A"; next }
            /^error: / { print "::error::" $0 }
            END { if (msg != "") print substr(msg, 1, 4000) }'

  vscode:
    name: Extension VS Code (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            claw: ../../target/debug/claw
            # VS Code a besoin d'un écran : serveur X virtuel.
            display: xvfb-run -a
          - os: windows-latest
            claw: ../../target/debug/claw.exe
            display: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compilation de claw
        run: cargo build --locked -p claw-cli
      - name: Dépendances de l'extension
        working-directory: rust/editors/vscode
        run: npm ci
      - name: Client (sans VS Code)
        working-directory: rust/editors/vscode
        shell: bash
        run: node test/client.test.js ${{ matrix.claw }}
      - name: Extension dans un vrai VS Code
        working-directory: rust/editors/vscode
        shell: bash
        run: ${{ matrix.display }} node test/run-vscode.js ${{ matrix.claw }}

  sandbox:
    name: Bac à sable ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Image du bac à sable
        run: ${{ matrix.engine }} pull docker.io/library/debian:stable-slim
      - name: Commandes dans un conteneur ${{ matrix.engine }}
        env:
          CLAW_TEST_CONTAINER: ${{ matrix.engine }}
        run: cargo test --locked -p runtime --test container_sandbox -- --ignored --test-threads=1

  action:
    name: Action GitHub (faux modèle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Démarrer le faux modèle
        run: |
          nohup node scripts/mock-model.js --write "claw-action-test.txt=écrit par l'agent" > "$RUNNER_TEMP/mock.out" 2>&1 &
          for _ in $(seq 50); do grep -q PORT "$RUNNER_TEMP/mock.out" && break; sleep 0.2; done
          echo "OLLAMA_BASE_URL=http://127.0.0.1:$(awk '/PORT/{print $2}' "$RUNNER_TEMP/mock.out")/v1" >> "$GITHUB_ENV"
      - name: Lancer l'action
        id: claw
        uses: ./.github/actions/claw
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
        with:
          prompt: Crée le fichier de test
          model: ollama:mock
          permission-mode: workspace-write
      - name: Vérifier les sorties de l'action
        working-directory: .
        env:
          RESULT: ${{ steps.claw.outputs.result }}
          CHANGED: ${{ steps.claw.outputs.changed }}
        run: |
          set -x
          test "$CHANGED" = true
          grep -q "écrit par l'agent" claw-action-test.txt
          case "$RESULT" in *"Fichier écrit"*) ;; *) echo "résultat inattendu : $RESULT"; exit 1 ;; esac

  release:
    name: Binaire ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Compilation release
        run: cargo build --release --locked -p claw-cli --target ${{ matrix.target }}
      - name: Archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "claw-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/claw.exe" $name
          Copy-Item README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=rust/$name.zip" >> $env:GITHUB_ENV
      - name: Archive (Linux, macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          name="claw-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/claw" README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=rust/$name.tar.gz" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
