name: Appli web

# Publie l'appli web de Claw (dossier claw-web, page statique sans compilation) sur GitHub
# Pages : https://abasse-ali.github.io/claw_code/. Les sessions vivent dans un dépôt privé
# (abasse-ali/claw-sessions) ; l'appli n'en contient rien.
on:
  push:
    branches: [main]
    paths:
      - "claw-web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois ; la plus récente gagne.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: claw-web
      - id: deployment
        uses: actions/deploy-pages@v4
