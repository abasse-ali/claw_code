name: Diagnostic kill

# Quel programme `kill` la machine Linux de GitHub fournit, et ce que fait
# `kill -KILL -<pid>` (forme utilisée par Claw) quand le processus n'est pas chef de
# son groupe. À la demande seulement ; l'essai se fait dans une session à part.
on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  kill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Programme kill
        run: |
          which -a kill
          ls -l /usr/bin/kill /bin/kill "$(readlink -f /usr/bin/kill)" || true
          /usr/bin/kill --version 2>&1 | head -2 || true
          dpkg -S "$(readlink -f /usr/bin/kill)" || true
          cat /etc/os-release | head -3
      - name: Chef de groupe, avec et sans --
        run: |
          for forme in sans avec; do
            setsid bash -c "sleep 300 & wait" & leader=$!
            sleep 1
            child=$(pgrep -P "$leader" sleep)
            echo "forme $forme : chef $leader groupe $(ps -o pgid= -p "$leader"), enfant $child"
            if [ "$forme" = sans ]; then /usr/bin/kill -KILL -"$leader"; else /usr/bin/kill -KILL -- -"$leader"; fi
            echo "  code de kill : $?"
            sleep 1
            ps -o pid=,stat=,cmd= -p "$leader","$child" | sed 's/^/  encore là : /' || true
            /usr/bin/kill -KILL -- -"$leader" 2>/dev/null || true
          done
