name: Claw web

# Moteur de l'appli web de Claw (dépôt claw-web, GitHub Pages), appelé par le workflow
# claw-web.yml du dépôt des sessions (privé, par exemple abasse-ali/claw-sessions) : l'appli
# lance ce dernier pour une session (une issue de ce dépôt-là, étiquette claw-web) ; Claw
# travaille dans le dépôt choisi, sur la branche de la session, pousse, ouvre la pull request
# et répond dans la session. Tout se passe dans le dépôt appelant (issues, caches, journaux) :
# ses minutes, ses secrets (OPENROUTER_API_KEY, CLAW_REPO_TOKEN, jeton qui peut lire et
# pousser dans les dépôts des tâches ; NVIDIA_API_KEY et GEMINI_API_KEY, facultatifs, pour les
# modèles `nvidia:` et `gemini:` et le lecteur d'images de NVIDIA), son nom de passage (« Claw <dépôt> #<session> »).
# Suivi : rust/docs/suivi/w1-appli-web.md.

on:
  workflow_call:
    secrets:
      OPENROUTER_API_KEY:
        required: false
      CLAW_REPO_TOKEN:
        required: false
      NVIDIA_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      CLAW_PUSH_VAPID_PRIVATE:
        required: false
    inputs:
      claw_source:
        description: Dépôt du code de Claw (compilé, scripts du moteur)
        required: false
        type: string
        default: abasse-ali/claw_code
      claw_ref:
        description: Branche du code de Claw
        required: false
        type: string
        default: main
      repo:
        description: Dépôt où travailler (propriétaire/nom)
        required: true
        type: string
      base:
        description: Branche de départ
        required: true
        type: string
        default: main
      session:
        description: Numéro de l'issue de la session, dans ce dépôt
        required: true
        type: string
      model:
        description: "Modèle (vide : le meilleur modèle gratuit pour le code ; mock : faux modèle d'essai)"
        required: false
        type: string
        default: ""
      team:
        description: "Mode équipe (1 : chaque étape au modèle gratuit le plus fort pour son rôle)"
        required: false
        type: string
        default: ""
      ultracode:
        description: "Ultracode (1 : demande étudiée avant le travail, résultat vérifié après)"
        required: false
        type: string
        default: ""
      runner:
        description: "Machine des sessions (vide : claw-pc, votre serveur gratuit ou votre PC ; voir .github/claw-web/pc). Plus de machine de GitHub : sans minutes Actions pour le dépôt privé, le passage y échouait"
        required: false
        type: string
        default: ""
      project:
        description: "Mode projet (1 : cahier des charges, plan en jalons vérifiés ; vide : coupé)"
        required: false
        type: string
        default: ""

permissions:
  # actions: read : date du passage, pour ignorer un passage lancé en double.
  actions: read
  # contents: write : les captures d'écran de l'agent rangées sur la branche des fichiers du
  # dépôt des sessions (claw-web-fichiers), que l'appli montre en grand. L'agent ne reçoit
  # jamais ce jeton (run.agent_env).
  contents: write
  issues: write

jobs:
  # Bouton « Rechercher tous les modèles gratuits » du choix du modèle : l'appli lance la
  # session réservée `catalogue-modeles`, le champ `model` portant le fournisseur. Le catalogue
  # classé va sur la branche des fichiers (catalogue/<fournisseur>.json) ; aucune session.
  catalogue:
    if: inputs.session == 'catalogue-modeles'
    # Même machine que les sessions : celle de l'utilisateur quand il en a une (vu le
    # 21 octobre 2026 : les machines de GitHub refusées au dépôt privé, limite de dépense).
    runs-on: ${{ inputs.runner || 'claw-pc' }}
    timeout-minutes: 20
    steps:
      - name: Scripts du moteur
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.claw_source }}
          ref: ${{ inputs.claw_ref }}
          token: ${{ secrets.CLAW_REPO_TOKEN || github.token }}
          path: claw-src
          sparse-checkout: .github/claw-web
          persist-credentials: false
      - name: Catalogue des modèles gratuits
        env:
          PROVIDERS: ${{ inputs.model }}
          JOB_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 claw-src/.github/claw-web/models_catalog.py

  # JTest : le travail d'une session lancé sur le serveur d'Oracle (exécuteur claw-pc, ARM64) et
  # ouvert sur le téléphone par un lien https (tunnel Cloudflare). L'appli ou Claw lancent la
  # session réservée `jtest-<n>` (`jtest-stop-<n>` pour l'arrêter) : `base` porte la branche à
  # lancer, `model` les réglages (JSON facultatif : command, install, port, path, hours). Le site
  # reste en ligne après le job, quelques heures. Voir .github/claw-web/jtest.py.
  jtest:
    if: startsWith(inputs.session, 'jtest-')
    runs-on: [claw-pc, ARM64]
    timeout-minutes: 30
    steps:
      - name: Scripts du moteur
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.claw_source }}
          ref: ${{ inputs.claw_ref }}
          token: ${{ secrets.CLAW_REPO_TOKEN || github.token }}
          path: claw-src
          sparse-checkout: .github/claw-web
          persist-credentials: false
      - name: JTest
        env:
          SESSION_INPUT: ${{ inputs.session }}
          REPO: ${{ inputs.repo }}
          BRANCH: ${{ inputs.base }}
          OPTIONS: ${{ inputs.model }}
          JOB_TOKEN: ${{ github.token }}
          REPO_TOKEN: ${{ secrets.CLAW_REPO_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/claw-src/.github/claw-web
        run: python3 claw-src/.github/claw-web/jtest.py

  task:
    if: inputs.session != 'catalogue-modeles' && !startsWith(inputs.session, 'jtest-')
    # Sur votre PC (exécuteur auto-hébergé `claw-pc`), aucune minute de GitHub n'est comptée.
    runs-on: ${{ inputs.runner || 'claw-pc' }}
    timeout-minutes: 120
    steps:
      # Heure de départ du job : run.py en tire l'heure à laquelle Claw doit conclure, avant que
      # les 120 minutes ne coupent le passage en plein travail (vu le 25 octobre 2026).
      - name: Heure de départ
        run: echo "CLAW_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # L'exécuteur du PC garde ses fichiers d'un passage à l'autre, quand une machine de GitHub
      # repart de zéro : le dossier de travail repart vide (sinon `git clone … work` échoue).
      - name: Dossier de travail vide
        if: runner.environment == 'self-hosted'
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Source de Claw
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.claw_source }}
          ref: ${{ inputs.claw_ref }}
          # Le jeton du dépôt des sessions ne lit que ce dépôt-là : tant que le code de Claw
          # est privé, celui de l'utilisateur (CLAW_REPO_TOKEN) le lit.
          token: ${{ secrets.CLAW_REPO_TOKEN || github.token }}
          path: claw-src
          persist-credentials: false

      # Recompilé seulement quand le code Rust change ; gardé dès la compilation finie (un
      # passage annulé ensuite ne la fait pas perdre). Un binaire par processeur : le serveur
      # ARM et le PC ou les machines de GitHub (Intel/AMD) ne s'échangent pas le leur.
      - name: Binaire de Claw en cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.claw-bin
          key: claw-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('claw-src/rust/Cargo.lock', 'claw-src/rust/crates/**/*.rs', 'claw-src/rust/crates/**/Cargo.toml', 'claw-src/rust/crates/**/*.html', 'claw-src/rust/crates/**/*.js') }}

      - name: Installer Rust
        if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      # Dossier de compilation gardé d'un passage à l'autre sur la machine des sessions (le
      # serveur garde son disque) : après une fusion, seuls les crates changés se recompilent.
      # Vu le 25 octobre 2026 : 5 minutes de compilation complète à chaque passage.
      - name: Compiler Claw
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --path claw-src/rust/crates/claw-cli --locked --root ~/.claw-bin --target-dir ~/.claw-target

      - name: Garder le binaire de Claw
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.claw-bin
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Claw dans le PATH
        run: echo "$HOME/.claw-bin/bin" >> "$GITHUB_PATH"

      # État du mode projet de la session (.claw/project.json) d'un passage à l'autre : le
      # clone est neuf à chaque passage et .claw n'est jamais poussé.
      - name: État de la session
        uses: actions/cache/restore@v5
        with:
          path: claw-state
          key: claw-web-state-${{ inputs.session }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: claw-web-state-${{ inputs.session }}-

      # Modèles mis de côté (refus 403, quota du jour) et codeurs de l'équipe écartés pour
      # avoir abîmé le code : gardés d'un passage à l'autre, sinon chaque passage les
      # réessaie. Vu le 27 octobre 2026 (session #32, passages 6 à 8) : inkling refusé (403)
      # au début de chaque passage. Ces fichiers ne disent que la disponibilité des modèles.
      - name: Modèles écartés (cache)
        uses: actions/cache/restore@v5
        with:
          path: claw-models
          key: claw-web-models-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: claw-web-models-

      - name: Modèles écartés dans les réglages de Claw
        env:
          CLAW_CONFIG_HOME: ${{ runner.temp }}/claw-home
        run: |
          mkdir -p "$CLAW_CONFIG_HOME"
          for file in model-cooldowns.json team-benched.json; do
            if [ -f "claw-models/$file" ]; then cp "claw-models/$file" "$CLAW_CONFIG_HOME/$file"; fi
          done

      # Les entrées passent par l'environnement, jamais dans le script : un nom de branche
      # comme `"; curl … | sh; "` serait sinon exécuté.
      - name: Session et dépôt de la tâche
        id: setup
        env:
          REPO: ${{ inputs.repo }}
          BASE: ${{ inputs.base }}
          SESSION: ${{ inputs.session }}
          JOB_TOKEN: ${{ github.token }}
          REPO_TOKEN: ${{ secrets.CLAW_REPO_TOKEN }}
        run: python3 claw-src/.github/claw-web/setup.py

      # Le jeton du dépôt n'est pas dans cette étape : setup.py le laisse dans un fichier que
      # run.py lit puis efface avant l'agent, pour les outils MCP du moteur (mcp_server.py).
      - name: Claw au travail
        id: claw
        if: steps.setup.outputs.skip != 'true'
        env:
          REPO: ${{ inputs.repo }}
          BASE: ${{ inputs.base }}
          BRANCH: ${{ steps.setup.outputs.branch }}
          RUNNER: ${{ inputs.runner }}
          MODEL: ${{ inputs.model }}
          TEAM: ${{ inputs.team }}
          ULTRACODE: ${{ inputs.ultracode }}
          PROJECT: ${{ inputs.project }}
          SESSION: ${{ inputs.session }}
          JOB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAW_SRC: ${{ github.workspace }}/claw-src
          PYTHONPATH: ${{ github.workspace }}/claw-src/.github/claw-web
          # Réglages, mémoire et caches de Claw dans le dossier temporaire du job, vidé à chaque
          # passage : sur l'exécuteur du PC, rien d'une session (d'un autre dépôt) ne passe à la
          # suivante, comme sur une machine neuve de GitHub.
          CLAW_CONFIG_HOME: ${{ runner.temp }}/claw-home
        # `exec` : à l'annulation, le signal arrive au script, qui arrête Claw proprement.
        run: exec python3 claw-src/.github/claw-web/run.py

      # Journal complet de Claw (événements, erreurs), gardé 7 jours pour comprendre un passage.
      - name: Journal de Claw
        if: always() && steps.setup.outcome == 'success' && steps.setup.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: claw-session-${{ inputs.session }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/claw-web/claw.jsonl
            ${{ runner.temp }}/claw-web/claw.stderr
          retention-days: 7
          if-no-files-found: ignore

      - name: Garder les modèles écartés
        id: models
        if: always()
        env:
          CLAW_CONFIG_HOME: ${{ runner.temp }}/claw-home
        run: |
          mkdir -p claw-models
          saved=false
          for file in model-cooldowns.json team-benched.json; do
            if [ -f "$CLAW_CONFIG_HOME/$file" ]; then cp "$CLAW_CONFIG_HOME/$file" "claw-models/$file"; saved=true; fi
          done
          echo "saved=$saved" >> "$GITHUB_OUTPUT"

      - name: Modèles écartés en cache
        if: always() && steps.models.outputs.saved == 'true'
        uses: actions/cache/save@v5
        with:
          path: claw-models
          key: claw-web-models-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Garder l'état de la session
        id: state
        if: always() && steps.setup.outcome == 'success' && steps.setup.outputs.skip != 'true'
        run: |
          if [ -f work/.claw/project.json ]; then
            mkdir -p claw-state
            cp work/.claw/project.json claw-state/project.json
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: État de la session en cache
        if: always() && steps.state.outputs.saved == 'true'
        uses: actions/cache/save@v5
        with:
          path: claw-state
          key: claw-web-state-${{ inputs.session }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publier
        if: always() && steps.setup.outcome == 'success' && steps.setup.outputs.skip != 'true'
        env:
          REPO: ${{ inputs.repo }}
          BASE: ${{ inputs.base }}
          SESSION: ${{ inputs.session }}
          BRANCH: ${{ steps.setup.outputs.branch }}
          TITLE: ${{ steps.setup.outputs.title }}
          PUBLISH: ${{ steps.setup.outputs.publish }}
          CLAW_OUTCOME: ${{ steps.claw.outcome }}
          JOB_TOKEN: ${{ github.token }}
          REPO_TOKEN: ${{ secrets.CLAW_REPO_TOKEN }}
        run: python3 claw-src/.github/claw-web/publish.py

      # Notification sur le téléphone (Web Push) : question de Claw, travail fini ou arrêt. Les
      # clés et les appareils abonnés sont posés par l'appli (Réglages, Notifications).
      - name: Prévenir le téléphone
        if: always() && steps.setup.outcome == 'success' && steps.setup.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          CLAW_PUSH_VAPID_PRIVATE: ${{ secrets.CLAW_PUSH_VAPID_PRIVATE }}
          CLAW_PUSH_VAPID_PUBLIC: ${{ vars.CLAW_PUSH_VAPID_PUBLIC }}
          CLAW_PUSH_SUBSCRIPTIONS: ${{ vars.CLAW_PUSH_SUBSCRIPTIONS }}
          REPO_TOKEN: ${{ secrets.CLAW_REPO_TOKEN }}
        run: python3 claw-src/.github/claw-web/push.py
