<div class="hours" data-hours>

      <tr data-hours-day="6"><th scope="row">Samedi</th><td>9 h - 18 h</td></tr>
      <tr data-hours-day="0"><th scope="row">Dimanche</th><td>9 h - 12 h 30</td></tr>
    </tbody>
  </table>
