<section class="entries" data-entries="budget" data-currency="EUR" aria-labelledby="entries-title">
  <div class="entries__head">
    <h2 id="entries-title">Opérations du mois</h2>
    <p class="entries__balance">Solde <strong data-entries-sum="balance">0,00 €</strong></p>
  </div>
  <dl class="entries__sums">
    <div><dt>Rentrées</dt><dd data-entries-sum="income">0,00 €</dd></div>
    <div><dt>Dépenses</dt><dd data-entries-sum="spending">0,00 €</dd></div>
  </dl>
  <ul class="entries__list" data-entries-list data-period="month"></ul>
  <p class="entries__empty" data-entries-empty hidden>Aucune opération ce mois-ci.</p>
  <div class="entries__tools">
    <button class="entries__tool" type="button" data-entries-export>{{icon:download}}<span>Enregistrer une copie</span></button>
    <button class="entries__tool" type="button" data-entries-import>{{icon:upload}}<span>Reprendre une copie</span></button>
    <input type="file" accept=".csv,text/csv" data-entries-file aria-label="Fichier de copie à reprendre" hidden>
  </div>
  <!-- Ce que l'utilisateur a donné, montré dès la première ouverture (jamais recopié sur les mois d'avant). -->
  <script type="application/json" data-entries-seed>
    [
      { "label": "Salaire", "amount": 1235.15, "category": "Revenus" },
      { "label": "Loyer", "amount": -450, "category": "Logement" }
    ]
  </script>
</section>
