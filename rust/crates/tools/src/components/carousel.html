<section class="carousel" data-carousel aria-roledescription="carrousel" aria-label="Bouquets de saison">
  <div class="carousel__track" data-carousel-track tabindex="0">
    <figure class="carousel__slide" aria-roledescription="diapositive" aria-label="1 sur 3">
      <img src="images/bouquet-1.jpg" alt="Bouquet de pivoines et d'eucalyptus" width="800" height="1000" loading="lazy">
      <figcaption>Pivoines et eucalyptus, 45 €</figcaption>
    </figure>
    <figure class="carousel__slide" aria-roledescription="diapositive" aria-label="2 sur 3">
      <img src="images/bouquet-2.jpg" alt="Bouquet champêtre de saison" width="800" height="1000" loading="lazy">
      <figcaption>Champêtre, 38 €</figcaption>
    </figure>
    <figure class="carousel__slide" aria-roledescription="diapositive" aria-label="3 sur 3">
      <img src="images/bouquet-3.jpg" alt="Bouquet de roses anciennes" width="800" height="1000" loading="lazy">
      <figcaption>Roses anciennes, 52 €</figcaption>
    </figure>
  </div>
  <div class="carousel__controls">
    <button class="carousel__arrow" type="button" data-carousel-prev aria-label="Précédent">{{icon:arrow-left}}</button>
    <div class="carousel__dots" data-carousel-dots></div>
    <button class="carousel__arrow" type="button" data-carousel-next aria-label="Suivant">{{icon:arrow-right}}</button>
  </div>
</section>
