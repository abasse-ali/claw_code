<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claw Code</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f0601a'/%3E%3Cg transform='translate(4 4)' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M6 19c.3-5 2.3-9.6 6-13'/%3E%3Cpath d='M10.6 20c.3-5 2.3-9.6 6-13'/%3E%3Cpath d='M15.2 20.5c.3-4 1.8-7.6 4.3-10.3'/%3E%3C/g%3E%3C/svg%3E">
<style>
  /* ------------------------------------------------------------------ thèmes */
  :root {
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --mono: "Cascadia Code", "JetBrains Mono", ui-monospace, Consolas, monospace;
    --r-sm: 8px; --r: 12px; --r-lg: 18px;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e0f11; --surface: #16171a; --surface-2: #1d1e22; --surface-3: #25262b;
    --border: #2a2b30; --border-strong: #3a3b42;
    --text: #ececee; --text-2: #a3a3ad; --text-3: #6f707a;
    --accent: #ff7a3d; --accent-2: #ff9a66; --accent-soft: rgba(255, 122, 61, .13); --on-accent: #1a0d05;
    --ok: #3ccf7a; --ok-soft: rgba(60, 207, 122, .12);
    --err: #ff5d5d; --err-soft: rgba(255, 93, 93, .12);
    --warn: #f5b13d; --warn-soft: rgba(245, 177, 61, .12);
    --info: #6ea8ff; --info-soft: rgba(110, 168, 255, .12);
    --code-bg: #121316; --add-bg: rgba(60, 207, 122, .14); --del-bg: rgba(255, 93, 93, .14);
    --shadow: 0 10px 40px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .3);
    --tk-kw: #ff9a66; --tk-str: #9ad37f; --tk-num: #f5c46b; --tk-com: #6f707a; --tk-fn: #8cb4ff;
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f6f6f4; --surface: #ffffff; --surface-2: #f1f1ef; --surface-3: #e8e8e5;
    --border: #e3e3df; --border-strong: #cfcfca;
    --text: #18181b; --text-2: #55555e; --text-3: #8d8d96;
    --accent: #e8590c; --accent-2: #f07b3a; --accent-soft: rgba(232, 89, 12, .09); --on-accent: #ffffff;
    --ok: #16a34a; --ok-soft: rgba(22, 163, 74, .10);
    --err: #dc2626; --err-soft: rgba(220, 38, 38, .08);
    --warn: #b45309; --warn-soft: rgba(217, 119, 6, .10);
    --info: #2563eb; --info-soft: rgba(37, 99, 235, .08);
    --code-bg: #f6f6f3; --add-bg: rgba(22, 163, 74, .11); --del-bg: rgba(220, 38, 38, .09);
    --shadow: 0 12px 40px rgba(20, 20, 30, .14), 0 2px 6px rgba(20, 20, 30, .06);
    --tk-kw: #c2410c; --tk-str: #15803d; --tk-num: #a16207; --tk-com: #8d8d96; --tk-fn: #1d4ed8;
  }

  /* ------------------------------------------------------------------ base */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14.5px/1.6 var(--font); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
    /* L'habillage (barres, boutons, menus) ne se sélectionne pas à la souris ;
       seuls les contenus utiles à copier restent sélectionnables. */
    -webkit-user-select: none; user-select: none;
  }
  .user, .md, .step-body, .card pre, .card .hint, .perm pre, .diff, .dialog .big, .dialog .rows, .dialog .link, .dialog .name, .dialog .ident, .dialog .desc, input, textarea {
    -webkit-user-select: text; user-select: text;
  }
  button, .codehead, .copy { -webkit-user-select: none; user-select: none; }
  img, svg { -webkit-user-drag: none; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled { cursor: not-allowed; opacity: .45; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  code, pre, kbd { font-family: var(--mono); }
  kbd { font-size: 11px; padding: 1px 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 5px; color: var(--text-2); background: var(--surface-2); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--border-strong); }

  .btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface); font-size: 13.5px; font-weight: 500; transition: background .15s, border-color .15s; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-strong); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
  .btn.danger { color: var(--err); }
  .btn.danger:hover:not(:disabled) { background: var(--err-soft); border-color: var(--err); }
  .icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: var(--r-sm); color: var(--text-2); transition: background .15s, color .15s; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }

  /* ------------------------------------------------------------------ barre du haut */
  header.top {
    flex: none; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px;
    border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); position: relative; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 16px; flex: none;
    background: linear-gradient(135deg, #ff8a4c, #e8490c); box-shadow: 0 2px 10px rgba(255, 106, 40, .35); }
  .logo svg { width: 62%; height: 62%; }
  .project { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .project b { font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .project span { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 500; white-space: nowrap; max-width: 260px; transition: background .15s, border-color .15s; }
  .pill:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .pill .label { overflow: hidden; text-overflow: ellipsis; }
  .pill .sub { color: var(--text-3); font-weight: 400; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
  .tag { font-size: 10.5px; font-weight: 600; letter-spacing: .02em; padding: 1px 6px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
  #credits { cursor: pointer; }
  #credits b { font-weight: 650; font-variant-numeric: tabular-nums; }
  #credits .sep { width: 1px; height: 14px; background: var(--border-strong); }
  #credits.low b { color: var(--err); }
  #credits.warn { border-color: var(--warn); }
  #credits.warn .free b { color: var(--warn); }
  #credits.flash { animation: flash .7s var(--ease); }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 var(--accent-soft); border-color: var(--accent); } 100% { box-shadow: 0 0 0 8px transparent; } }

  /* menus déroulants */
  .menu { position: absolute; top: 48px; z-index: 30; min-width: 280px; max-width: min(460px, calc(100vw - 24px)); max-height: min(70vh, 560px);
    display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r); box-shadow: var(--shadow);
    padding: 6px; animation: pop .14s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
  .menu input.search { height: 34px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); padding: 0 10px; margin: 2px 2px 6px; outline: none; }
  .menu input.search:focus { border-color: var(--accent); }
  .menu .list { overflow-y: auto; }
  .menu .group { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); padding: 8px 10px 4px; }
  .item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); text-align: left; }
  .item:hover, .item.active { background: var(--surface-2); }
  .item .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .item .grow b { font-weight: 550; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .grow span { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .check { color: var(--accent); }
  .item .measured { font-size: 11.5px; color: var(--ok); white-space: nowrap; flex: none; }
  .item .measured.bad { color: var(--text-3); }
  .item .grow span.mono { font-family: var(--mono); font-size: 11.5px; }
  .item .lead { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
  .menu .custom { display: flex; gap: 6px; padding: 6px 2px 2px; border-top: 1px solid var(--border); margin-top: 6px; }
  .menu .custom input { flex: 1; height: 32px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); padding: 0 10px; outline: none; font-family: var(--mono); font-size: 12.5px; }
  /* rangée de menu avec un petit bouton à droite (informations, effacer) */
  .menu .row { display: flex; align-items: center; gap: 2px; }
  .menu .row > .item { flex: 1; min-width: 0; }
  .mini { flex: none; width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--text-3); transition: background .15s, color .15s; }
  .mini:hover { background: var(--surface-3); color: var(--text); }
  .mini.danger:hover { background: var(--err-soft); color: var(--err); }
  .mini.on { color: var(--warn); }
  .mini.on svg.i { fill: currentColor; }
  .menu .rename { display: flex; align-items: center; gap: 6px; padding: 5px 6px; }
  .menu .rename input { flex: 1; min-width: 0; height: 30px; border-radius: var(--r-sm); border: 1px solid var(--accent); background: var(--surface-2); padding: 0 9px; outline: none; font-size: 13px; }
  .menu .rename .btn { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .menu .confirm { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px; border-radius: var(--r-sm); background: var(--err-soft); font-size: 13px; }
  .menu .confirm > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .confirm .btn { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .menu .wide { width: calc(100% - 4px); margin: 0 2px 6px; justify-content: center; flex: none; }
  .menu .wide > svg.i { color: var(--accent); }
  .menu .foot { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; }
  .menu .foot .wide { margin-bottom: 0; }
  .menu .hint-line { font-size: 11.5px; color: var(--text-3); padding: 0 10px 4px; }
  /* catégories de modèles : une pastille par spécialité */
  .menu .cats { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 2px 7px; flex: none; }
  .cat { display: inline-flex; align-items: center; gap: 5px; height: 23px; padding: 0 9px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); font-size: 11.5px; font-weight: 550; color: var(--text-2); white-space: nowrap; transition: border-color .15s, color .15s, background .15s; }
  .cat:hover { border-color: var(--border-strong); color: var(--text); }
  .cat.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .cat.nofree { opacity: .62; }
  .cat.more { border-style: dashed; }
  .cat i { font-style: normal; font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .cat.on i { color: inherit; }
  .item .grow span.spec { font-size: 11px; margin-top: 1px; }
  .item .likeness { font-size: 11.5px; font-weight: 650; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .menu .refs { display: flex; gap: 4px; padding: 0 10px 6px; flex-wrap: wrap; }
  .menu .refs .cat { height: 22px; }
  .dialog .like-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 10px 0 6px; font-size: 13.5px; font-weight: 600; }
  .dialog .like-head b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .dialog .meter { height: 5px; border-radius: 5px; background: var(--surface-3); overflow: hidden; margin-bottom: 6px; }
  .dialog .meter i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
  .menu .confirm.pay { background: var(--warn-soft); }
  .menu .confirm.pay > span { white-space: normal; }
  .item .fresh { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); flex: none; }
  .item .aside { display: inline-flex; align-items: center; gap: 8px; flex: none; }

  /* ------------------------------------------------------------------ conversation */
  main#log { flex: 1; overflow-y: auto; scroll-behavior: auto; position: relative; }
  .col { max-width: 800px; margin: 0 auto; padding: 26px 22px 30px; display: flex; flex-direction: column; gap: 14px; }
  .col > * { content-visibility: auto; contain-intrinsic-size: auto 60px; }

  .empty { text-align: center; padding: 9vh 0 2vh; content-visibility: visible; }
  .empty .logo { width: 52px; height: 52px; font-size: 28px; border-radius: 15px; margin: 0 auto 18px; }
  .empty h1 { font-size: 24px; font-weight: 650; letter-spacing: -.01em; margin: 0 0 6px; }
  .empty h1 em { font-style: normal; color: var(--accent); }
  .empty p { color: var(--text-2); margin: 0 auto; max-width: 480px; }
  .starters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 28px auto 0; max-width: 560px; text-align: left; }
  .starter { text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--r); border: 1px solid var(--border); background: var(--surface); transition: border-color .15s, transform .15s var(--ease), background .15s; }
  .starter:hover { border-color: var(--accent); background: var(--surface-2); transform: translateY(-1px); }
  .starter .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
  .starter b { display: block; font-size: 13.5px; font-weight: 600; }
  .starter span { font-size: 12.5px; color: var(--text-2); }
  .shortcuts { margin-top: 22px; font-size: 12px; color: var(--text-3); display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  .user { align-self: flex-end; max-width: 82%; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-lg) var(--r-lg) 6px var(--r-lg);
    padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user.collapsed { max-height: 9.5em; overflow: hidden; cursor: pointer; mask-image: linear-gradient(#000 60%, transparent); }
  .user-image { align-self: flex-end; max-width: min(340px, 75%); border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); }
  .user-image img { display: block; width: 100%; }

  .md { overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { margin: 8px 0; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 20px 0 8px; font-weight: 650; letter-spacing: -.005em; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 17.5px; } .md h3 { font-size: 15.5px; } .md h4 { font-size: 14.5px; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; } .md li { margin: 3px 0; } .md li::marker { color: var(--text-3); }
  .md strong { font-weight: 650; }
  .md a { color: var(--accent); text-decoration: none; } .md a:hover { text-decoration: underline; }
  .md :not(pre) > code { font-size: 12.8px; background: var(--surface-2); border: 1px solid var(--border); padding: 1px 5px; border-radius: 5px; }
  .md blockquote { margin: 10px 0; padding: 2px 14px; border-left: 3px solid var(--accent); color: var(--text-2); }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
  .md table { border-collapse: separate; border-spacing: 0; margin: 10px 0; display: block; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 13.5px; }
  .md th, .md td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  .md th { background: var(--surface-2); font-weight: 600; }
  .md tr:last-child td { border-bottom: 0; }

  .codeblock { margin: 10px 0; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; background: var(--code-bg); }
  .codehead { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--border); font-size: 11.5px; color: var(--text-3); font-family: var(--mono); }
  .copy { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px; font-family: var(--font); font-size: 12px; color: var(--text-2); }
  .copy:hover { background: var(--surface-3); color: var(--text); }
  .codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; font-size: 12.8px; line-height: 1.55; tab-size: 4; }
  .tk-kw { color: var(--tk-kw); } .tk-str { color: var(--tk-str); } .tk-num { color: var(--tk-num); } .tk-com { color: var(--tk-com); font-style: italic; } .tk-fn { color: var(--tk-fn); }
  .mermaid-block .diagram { padding: 14px; overflow-x: auto; background: var(--surface); }
  .mermaid-block .actions { display: flex; gap: 8px; align-items: center; padding: 8px 12px; font-size: 12.5px; color: var(--text-3); border-top: 1px solid var(--border); }

  /* étapes de l'agent (outils), en frise */
  .steps { display: flex; flex-direction: column; position: relative; padding-left: 4px; }
  .steps::before { content: ""; position: absolute; left: 17px; top: 14px; bottom: 14px; width: 1px; background: var(--border); }
  .step { position: relative; }
  .step-row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 5px 8px 5px 2px; border-radius: var(--r-sm); text-align: left; min-height: 34px; }
  .step-row:hover { background: var(--surface); }
  .step-ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); position: relative; z-index: 1; }
  .step.ok .step-ic { color: var(--ok); }
  .step.error .step-ic { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, var(--border)); background: var(--err-soft); }
  .step.running .step-ic { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .step-verb { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .step-target { font-family: var(--mono); font-size: 12.3px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .step-meta { font-size: 12px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .step-meta .add { color: var(--ok); } .step-meta .del { color: var(--err); }
  .step-row .chev { color: var(--text-3); transition: transform .15s; }
  .step.open .chev { transform: rotate(90deg); }
  .step-body { margin: 2px 0 8px 40px; display: flex; flex-direction: column; gap: 8px; animation: pop .14s var(--ease); }
  .step-body .label { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
  .step-body pre { margin: 0; padding: 10px 12px; background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 12.3px; line-height: 1.5; overflow: auto; max-height: 380px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .step-body pre.stderr { color: var(--err); }
  .step-body .note { font-size: 12.5px; color: var(--text-2); }
  .diff { border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--code-bg); overflow: auto; max-height: 420px; font-family: var(--mono); font-size: 12.3px; line-height: 1.5; padding: 6px 0; }
  .diff div { padding: 0 12px 0 28px; white-space: pre-wrap; overflow-wrap: anywhere; position: relative; }
  .diff div::before { position: absolute; left: 10px; color: var(--text-3); }
  .diff .add { background: var(--add-bg); } .diff .add::before { content: "+"; color: var(--ok); }
  .diff .del { background: var(--del-bg); } .diff .del::before { content: "−"; color: var(--err); }

    const body = el("div", "step-body");
    body.hidden = true;
    row.onclick = () => toggleStep(step);
    step.append(row, body);

  function toggleStep(step, open) {
    const body = step.querySelector(".step-body");

  }
  function appendThinking(text) {
    if (!thinkingStep) {
      if (currentAssistant) finishAssistant();
      const parts = makeStep("thinking running", "spark", "Réflexion", "");
      parts.row.querySelector(".step-verb").classList.add("shimmer");
      const pre = el("pre");
      parts.body.appendChild(pre);
      stepsGroup().appendChild(parts.step);
      thinkingStep = { ...parts, pre, started: Date.now() };

    }
    thinkingStep.pre.textContent += text;

  function finishThinking() {
    if (!thinkingStep) return;

  function parseJson(text) { try { return JSON.parse(text); } catch (_) { return null; } }
  function describeTool(name, value, raw) {
    const v = value || {};
    switch (name) {
      case "bash": case "PowerShell": return ["terminal", "Commande", v.command || ""];
      case "read_file": return ["file", "Lecture", displayPath(v.path)];
      case "write_file": return ["filePlus", "Écriture", displayPath(v.path)];
      case "edit_file": return ["edit", "Modification", displayPath(v.path)];
      case "NotebookEdit": return ["edit", "Notebook", displayPath(v.notebook_path)];
      case "glob_search": return ["search", "Fichiers", v.pattern || ""];
      case "grep_search": return ["search", "Recherche", (v.pattern || "") + (v.path ? "  · " + displayPath(v.path) : "")];
      case "WebFetch": return ["globe", "Page web", v.url || ""];
      case "WebSearch": return ["globe", "Recherche web", v.query || ""];
      case "Agent": return ["bot", "Sous-agent", (v.subagent_type || "général") + " · " + (v.description || "")];
      case "TodoWrite": return ["list", "Tâches", (v.todos || []).filter((t) => t.status === "completed").length + "/" + (v.todos || []).length + " terminées"];
      case "BashOutput": case "KillShell": return ["terminal", name === "KillShell" ? "Arrêt de tâche" : "Sortie de tâche", v.bash_id || ""];
      default:
        if (name.startsWith("mcp__")) return ["plug", "MCP · " + name.split("__")[1], name.split("__").slice(2).join("__")];
        return ["tool", name, String(raw || "").replace(/\s+/g, " ").slice(0, 140)];
    }
  }
  function lineDiff(oldText, newText) {
    const a = String(oldText || "").split("\n"), b = String(newText || "").split("\n");
    if (a.length * b.length > 250000) return a.map((t) => ["-", t]).concat(b.map((t) => ["+", t]));
    const n = a.length, m = b.length, dp = [];
    for (let i = 0; i <= n; i++) dp.push(new Uint32Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const out = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { out.push([" ", a[i]]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) out.push(["-", a[i++]]);
      else out.push(["+", b[j++]]);
    }
    while (i < n) out.push(["-", a[i++]]);
    while (j < m) out.push(["+", b[j++]]);
    return out;
  }
  function diffView(oldText, newText) {
    const box = el("div", "diff");
    let added = 0, removed = 0;
    for (const [kind, text] of lineDiff(oldText, newText)) {
      box.appendChild(el("div", kind === "+" ? "add" : kind === "-" ? "del" : "same", text || " "));
      if (kind === "+") added++; else if (kind === "-") removed++;
    }
    return { box, added, removed };
  }
  function todoList(todos) {
    const box = el("div", "todos");
    for (const todo of todos || []) {
      const row = el("div", "todo " + (todo.status === "completed" ? "done" : todo.status === "in_progress" ? "doing" : ""));
      const check = el("span", "box");
      if (todo.status === "completed") check.innerHTML = svg("check");
      row.append(check, el("span", null, todo.status === "in_progress" && todo.activeForm ? todo.activeForm : todo.content));
      box.appendChild(row);
    }
    return box;
  }
  function addToolCall(name, rawInput) {
    if (currentAssistant) finishAssistant();
    finishThinking();
    const value = parseJson(rawInput);
    const [icon, verb, target] = describeTool(name, value, rawInput);
    const parts = makeStep("running", icon, verb, target);
    parts.meta.innerHTML = '<span class="spin" style="display:inline-block;vertical-align:-2px"></span>';
    if (name === "edit_file" && value) {
      const { box, added, removed } = diffView(value.old_string, value.new_string);
      parts.body.append(box);
      parts.summary = '<span class="add">+' + added + '</span> <span class="del">−' + removed + "</span>";
    } else if (name === "write_file" && value) {
      const lines = String(value.content || "").split("\n");
      const pre = el("pre");
      pre.innerHTML = highlight(lines.slice(0, 120).join("\n") + (lines.length > 120 ? "\n…" : ""), String(value.path || "").split(".").pop());
      parts.body.append(pre);
      parts.summary = lines.length + " ligne" + (lines.length > 1 ? "s" : "");
    } else if (name === "TodoWrite" && value) {
      parts.body.append(todoList(value.todos));
    } else if (name !== "read_file") {
      parts.body.append(el("div", "label", "Entrée"), el("pre", null, value ? JSON.stringify(value, null, 2) : rawInput));
    }
    stepsGroup().appendChild(parts.step);
    pendingTools.push({ name, ...parts, started: Date.now() });
    setActivity(verb + (target ? " · " + target : ""));
    scrollToBottom(false);
  }
  // L'essentiel du résultat (sortie de commande, contenu lu…) plutôt que le JSON brut.
  function resultView(output, isError) {
    const box = document.createDocumentFragment();
    const value = parseJson(output);
    let summary = "";
    if (value && typeof value === "object" && !Array.isArray(value)) {
      if ("stdout" in value || "stderr" in value) {
        if (value.stdout) box.append(el("div", "label", "Sortie"), el("pre", null, value.stdout));
        if (value.stderr) box.append(el("div", "label", "Erreurs"), el("pre", "stderr", value.stderr));
        if (!value.stdout && !value.stderr) box.append(el("div", "note", "Aucune sortie"));
        if (value.returnCodeInterpretation) summary = value.returnCodeInterpretation.replace("exit_code:", "code ");
        if (value.backgroundTaskId) box.append(el("div", "note", "Lancé en arrière-plan (" + value.backgroundTaskId + ")"));
        return { box, summary };
      }
      if (value.file && typeof value.file.content === "string") {
        const file = value.file;
        const last = file.startLine + Math.max(file.numLines, 1) - 1;
        const pre = el("pre");
        pre.innerHTML = highlight(file.content, String(file.filePath || "").split(".").pop());
        box.append(el("div", "note", "Lignes " + file.startLine + "–" + last + " sur " + file.totalLines), pre);
        return { box, summary: file.totalLines + " lignes" };
      }
      if (value.filePath && (value.structuredPatch || value.content !== undefined)) {
        box.append(el("div", "note", (value.type === "create" ? "Fichier créé : " : "Fichier modifié : ") + displayPath(value.filePath)));
        return { box, summary: "" };
      }
      if (Array.isArray(value.filenames)) {
        box.append(el("pre", null, value.content || value.filenames.map(displayPath).join("\n") || "(aucun)"));
        return { box, summary: value.filenames.length + " fichier" + (value.filenames.length > 1 ? "s" : "") };
      }
    }
    box.append(el("div", "label", isError ? "Erreur" : "Résultat"),
      el("pre", isError ? "stderr" : null, value ? JSON.stringify(value, null, 2) : (output || "(vide)")));

  }
  function attachToolResult(name, output, isError) {
    let index = pendingTools.findIndex((tool) => tool.name === name);
    if (index < 0 && pendingTools.length) index = 0;
    if (index < 0) { addToolCall(name, "{}"); index = pendingTools.length - 1; }
    const entry = pendingTools.splice(index, 1)[0];
    const { box, summary } = resultView(output, isError);
    entry.body.append(box);
    entry.step.classList.remove("running");
    entry.step.classList.add(isError ? "error" : "ok");
    if (isError) entry.ic.innerHTML = svg("x");
    const parts = [entry.summary || summary, seconds(Date.now() - entry.started)].filter(Boolean);
    entry.meta.innerHTML = parts.join(" · ");
    if (isError) toggleStep(entry.step, true);
    if (!pendingTools.length) setActivity("Réflexion…");
  }

  // ---------------------------------------------------------------- autorisations
  let activePermission = null;
  function addPermission(event) {
    if (currentAssistant) finishAssistant();
    const card = el("div", "perm");
    card.id = "perm-" + event.id;
    const title = el("div", "card-title");
    title.innerHTML = svg("shield");
    title.append("Claw demande l'autorisation · " + event.tool);
    const feedback = el("textarea");
    feedback.placeholder = "Consigne pour l'agent si vous refusez (facultatif)";
    feedback.hidden = true;
    const actions = el("div", "actions");
    const send = async (decision) => {
      for (const button of actions.querySelectorAll("button")) button.disabled = true;
      try {
        await api("/api/permission", { id: event.id, decision, feedback: feedback.value });
      } catch (error) {
        toast("Réponse non transmise : " + error.message);
        for (const button of actions.querySelectorAll("button")) button.disabled = false;
      }
    };
    const button = (label, className, key, decision) => {
      const node = el("button", "btn " + className, label);
      node.type = "button";
      if (key) { const k = el("kbd", null, key); node.append(k); }
      node.onclick = () => send(decision);
      return node;
    };
    const once = button("Autoriser", "primary", "Entrée", "once");
    actions.appendChild(once);
    let always = null;
    if (event.suggested_rule) {
      always = button("Toujours : " + event.suggested_rule, "", "A", "always");
      always.title = event.session_only ? "Valable jusqu'à la fin de la session" : "Ajouté à .claw/settings.local.json";
      actions.appendChild(always);
    }
    actions.appendChild(button("Refuser", "danger", "Échap", "deny"));
    const note = el("button", "btn", "Ajouter une consigne");
    note.type = "button";
    note.onclick = () => { feedback.hidden = false; note.remove(); feedback.focus(); };
    actions.appendChild(note);
    card.append(title, el("pre", null, event.target), el("div", "meta", "Mode actuel : " + modeLabel(event.mode)), actions, feedback);
    append(card);
    pendingPermissions++;
    activePermission = { id: event.id, send, hasAlways: !!always };
    updateTitle();
    scrollToBottom(true);
    once.focus({ preventScroll: true });
  }
  function resolvePermission(id, decision) {
    const card = $("perm-" + id);
    if (!card) return;
    card.classList.add("resolved");
    for (const node of card.querySelectorAll(".actions, textarea")) node.remove();
    const label = { once: "Autorisé une fois", always: "Toujours autorisé", deny: "Refusé" }[decision] || decision;
    card.querySelector(".meta").textContent = "→ " + label;
    pendingPermissions = Math.max(0, pendingPermissions - 1);
    if (activePermission && activePermission.id === id) activePermission = null;
    updateTitle();
  }

  function resetLog() {

  function render(event) {

      case "assistant_text": finishThinking(); appendAssistant(event.text); break;
      case "thinking": appendThinking(event.text); break;
      case "tool_call": addToolCall(event.name, event.input); break;
      case "tool_result": attachToolResult(event.name, event.output, event.is_error); break;
      case "permission": addPermission(event); break;
      case "permission_resolved": resolvePermission(event.id, event.decision); break;
      case "info": finishAssistant(); addInfo(event.text); break;
      case "error": finishAssistant(); addError(event.message, event.hint); break;
      case "turn_done": finishAssistant(); if (benchPending) { benchPending = false; loadModels(); } break;

  // ---------------------------------------------------------------- en-tête : modèle, mode, crédits

  function renderModelButton() {

  let lastCreditsText = "";

  function renderCredits(data) {

    lastCredits = data;
    if (creditsDialog) creditsDialog(data);
    const html = svg("coins") + (data.balance_text ? "<b>" + escapeHtml(data.balance_text) + "</b>" : "") +
      (data.free ? '<span class="sep"></span><span class="free"><b>' + data.free.remaining + '</b> <span class="sub">/ ' + data.free.limit + " gratuites</span></span>" : "");
    if (html !== lastCreditsText) {

      lastCreditsText = html;
    }

    node.title = "OpenRouter : " + data.text + session + pending + "\nCliquer pour le détail";

  // « À ce rythme (≈ 42 requêtes/h), quota épuisé vers 18:05 », d'après les
  // requêtes de la dernière heure ; vide sans recul suffisant.
  function paceText(data) {
    if (!data.pace || !data.free || data.free.remaining <= 0) return "";
    const rate = "à ce rythme (≈ " + data.pace.per_hour + " requêtes/h)";
    if (!data.pace.exhausted_at) return rate + ", le quota tient jusqu'à sa remise à zéro";
    return rate + ", quota épuisé vers " + new Date(data.pace.exhausted_at * 1000).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }
  // Alerte quand le quota gratuit passe sous 100, 20 puis 0 requêtes : une
  // fois par seuil et par jour (UTC).
  function quotaAlert(data) {
    if (!data.free) return;
    const left = data.free.remaining;
    const threshold = left <= 0 ? 0 : left <= 20 ? 20 : left < 100 ? 100 : null;
    if (threshold === null) return;
    const key = "claw-quota-" + Math.floor(Date.now() / 86400000) + "-" + threshold;
    if (quotaAlerts.has(key)) return;
    quotaAlerts.add(key);
    try {
      if (sessionStorage.getItem(key)) return;
      sessionStorage.setItem(key, "1");
    } catch (_) { /* stockage indisponible : l'alerte reste unique pour cette page */ }
    const pace = paceText(data);
    toast(left <= 0 ? "Quota gratuit du jour épuisé (remise à zéro à minuit UTC)"
      : "Il reste " + left + " requêtes gratuites aujourd'hui" + (pace ? " · " + pace : ""));
  }
  async function loadCredits() {
    try { renderCredits(await api("/api/credits")); } catch (_) { /* affichage précédent conservé */ }
  }
  setInterval(loadCredits, 60000);

  // Fenêtre de détail des crédits, au centre de la page (clic sur la pastille).
  const money = (amount) => typeof amount !== "number" ? "—"
    : (Math.abs(amount) > 0 && Math.abs(amount) < 0.01 ? amount.toFixed(4) : amount.toFixed(2)).replace(".", ",") + " $";
  function untilUtcMidnight() {
    const now = new Date();
    const next = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1);
    const minutes = Math.max(0, Math.round((next - now.getTime()) / 60000));
    return Math.floor(minutes / 60) + " h " + String(minutes % 60).padStart(2, "0");
  }
  // Fenêtre au centre de la page : fermée par Échap, la croix ou un clic à côté.
  function openDialog(label) {
    closeMenu();
    const previous = $("dialog-backdrop");
    if (previous && previous.closeDialog) previous.closeDialog();
    const backdrop = el("div");
    backdrop.id = "dialog-backdrop";
    const panel = el("div", "dialog");
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-modal", "true");
    panel.setAttribute("aria-label", label);
    backdrop.append(panel);
    const dialog = { panel, onClose: null };
    const onKey = (event) => {
      if (event.key !== "Escape") return;
      event.preventDefault();
      event.stopPropagation();
      dialog.close();
    };
    dialog.close = () => {
      if (dialog.onClose) dialog.onClose();
      document.removeEventListener("keydown", onKey, true);
      backdrop.remove();
      input.focus();
    };
    // En-tête commun : icône, titre, croix.
    dialog.head = (icon) => {
      const head = el("div", "dialog-head");
      head.innerHTML = svg(icon);
      head.append(el("span", null, label));
      const x = el("button", "icon-btn");
      x.type = "button";
      x.title = "Fermer (Échap)";
      x.setAttribute("aria-label", "Fermer");
      x.innerHTML = svg("x");
      x.onclick = dialog.close;
      head.append(el("span", "spacer"), x);
      return head;
    };
    backdrop.closeDialog = dialog.close;
    document.addEventListener("keydown", onKey, true);
    backdrop.onmousedown = (event) => { if (event.target === backdrop) dialog.close(); };
    document.body.appendChild(backdrop);
    return dialog;
  }

          ? "Palier à " + data.free.limit + " par jour (au moins 10 $ de crédits achetés)."
          : "Palier à " + data.free.limit + " par jour : avec 10 $ de crédits achetés, il passe à 1000.";
        quota.append(line, bar, el("div", "note", data.free.used + " utilisée(s) · remise à zéro à minuit UTC, dans " + untilUtcMidnight() + ". " + tier));

        if (pace) {
          const soon = data.pace.exhausted_at || data.low;
          quota.append(el("div", "note pace" + (soon ? " warn" : ""), pace.charAt(0).toUpperCase() + pace.slice(1) + "."));
        }
        panel.append(quota);
      }

      // Ce que chaque modèle a consommé aujourd'hui, d'après le journal de Claw.

        const usage = el("div", "usage");
        usage.append(el("div", "usage-title", "Requêtes de Claw aujourd'hui, par modèle"));
        const most = data.by_model[0].requests || 1;
        for (const entry of data.by_model.slice(0, 6)) {
          const row = el("div", "usage-row");
          const name = el("span", "usage-name", modelName(entry.model));
          name.title = entry.model + (entry.free ? " (gratuit)" : " (payant)");

          const fill = el("i");
          fill.style.width = Math.max(3, (entry.requests / most) * 100) + "%";

          row.append(name, bar, el("b", null, String(entry.requests)));

        usage.append(el("div", "note", (more > 0 ? "Et " + more + " autre(s) modèle(s). " : "")

          + (data.free ? " ; OpenRouter en compte " + data.free.used + " gratuite(s) pour cette clé." : ".")));
        panel.append(usage);

      // D'où viennent les chiffres, et quand ils ont été lus pour la dernière fois.
      panel.append(el("div", "note source", "Chiffres fournis par OpenRouter et mis à jour sans intervention : à chaque requête de Claw, puis relus toutes les 20 s."));

      const actions = el("div", "actions");

      actions.append(el("span", "note", readAt ? "Relu à " + readAt : "Lecture en cours…"));
      const again = el("button", "btn", "Actualiser");
      again.type = "button";
      again.onclick = () => refresh(again);
      const buy = el("a", "btn primary", "Acheter des crédits");
      buy.href = "https://openrouter.ai/settings/credits";
      buy.target = "_blank";
      buy.rel = "noopener noreferrer";
      actions.append(again, buy);
      panel.append(actions, el("div", "link", "openrouter.ai/settings/credits"));
    };
    creditsDialog(lastCredits || { available: true });
    refresh(null);
  }

  // Fiche d'un modèle (petit bouton d'information du menu des modèles).
  const tokenCount = (count) => typeof count !== "number" ? "—"

  // `back` (facultatif) rouvre la liste d'où la fiche a été demandée.

      block.append(el("div", "usage-title", "Spécialités"));
      const list = el("dl", "rows");

    const rows = el("dl", "rows");

    if (info.local) row("Prix", "Aucun", "modèle servi par cette machine");
    else if (info.free === true) row("Prix", "Gratuit", "compté dans les requêtes gratuites du jour");
    else if (typeof info.prompt_price === "number" && typeof info.completion_price === "number") {
      row("Prix", money(info.prompt_price) + " en entrée", money(info.completion_price) + " en sortie, par million de jetons");
    }
    if (info.in_catalog) row("Classement programmation", info.programming_rank ? "n° " + info.programming_rank + " chez OpenRouter" : "hors classement");
    if (typeof info.score === "number") row("Puissance estimée pour le code", String(info.score), (info.reasons || []).join(" · "));
    if (info.measured) row("Mesuré par Claw", info.measured, info.measured_at ? relativeTime(info.measured_at) : "");
    else row("Mesuré par Claw", "pas encore", "/models bench le mesure sur de vraies tâches");
    if (info.hard) row("Raisonnement (tests cachés)", info.hard.text, info.hard_unassisted ? "sans les aides de Claw : " + info.hard_unassisted.text : "");
    row("Disponibilité", info.available === false ? "Mis de côté" : "Disponible", info.available === false ? "quota atteint ou panne récente, réessayé plus tard" : "");

    if (!info.in_catalog && !info.local) {

    if ((info.free === true || info.local) && info.tools !== false) {
      const measure = el("div", "measure");
      const idle = () => {
        measure.textContent = "";
        measure.append(el("div", "note", "Mesurer ce modèle sur de vraies tâches : le résultat sert à le classer."));
        const line = el("div", "line");
        const offer = (label, flag, requests, minutes) => {
          const button = el("button", "btn", label);
          button.type = "button";
          button.onclick = () => {
            measure.textContent = "";
            measure.append(el("div", "note", "Lancer la mesure ? Elle occupe l'agent " + minutes + " et consomme jusqu'à " + requests
              + " requêtes" + (info.local ? " locales." : " gratuites.")));
            const confirmLine = el("div", "line");
            const go = el("button", "btn primary", "Lancer");
            go.type = "button";
            go.onclick = async () => {
              go.disabled = true;
              try {
                await api("/api/message", { text: "/models bench " + flag + (info.local ? "--local " : "") + id, images: [] });
                benchPending = true;
                dialog.close();
                scrollToBottom(true);
              } catch (error) {
                toast(error.message);
                go.disabled = false;
              }
            };
            const back = el("button", "btn", "Annuler");
            back.type = "button";
            back.onclick = idle;
            confirmLine.append(go, back);
            measure.append(confirmLine);
          };
          return button;
        };
        line.append(offer("Trois tâches de code", "", 40, "quelques minutes"),
          offer("Raisonnement (tests cachés)", "--difficile ", 85, "jusqu'à une heure"));
        measure.append(line);
      };
      idle();
      body.append(measure);
    }
    body.append(actions);
  }

  // ---------------------------------------------------------------- menus
  let openMenu = null;
  function closeMenu() {
    if (openMenu) { openMenu.remove(); openMenu = null; }
  }
  function showMenu(anchor, build) {
    const wasOpen = openMenu && openMenu.dataset.anchor === anchor.id;
    closeMenu();
    if (wasOpen) return;
    const menu = el("div", "menu");
    menu.dataset.anchor = anchor.id;
    build(menu);
    document.body.appendChild(menu);
    // Vers le bas sous la barre du haut, vers le haut depuis la zone de saisie ;
    // aligné sur le bord du bouton le plus proche du centre.
    const rect = anchor.getBoundingClientRect();
    if (rect.top > window.innerHeight / 2) {
      menu.style.top = "auto";
      menu.style.bottom = Math.max(12, window.innerHeight - rect.top + 6) + "px";
      menu.style.maxHeight = "min(70vh, " + Math.max(200, rect.top - 24) + "px)";
    } else {
      menu.style.top = rect.bottom + 6 + "px";
    }
    if (rect.left + rect.width / 2 < window.innerWidth / 2) menu.style.left = Math.max(12, rect.left) + "px";
    else menu.style.right = Math.max(12, window.innerWidth - rect.right) + "px";
    // Jamais hors de la fenêtre (écran étroit, panneau de VS Code).
    const box = menu.getBoundingClientRect();
    if (box.left < 12 || box.right > window.innerWidth - 12) {
      menu.style.right = "auto";
      menu.style.left = Math.max(12, Math.min(box.left, window.innerWidth - 12 - box.width)) + "px";
    }
    openMenu = menu;
    const search = menu.querySelector("input.search");
    if (search) search.focus();
  }
  function menuItem(title, subtitle, onPick, extra, subtitleClass) {
    const item = el("button", "item");
    item.type = "button";
    const grow = el("span", "grow");
    grow.append(el("b", null, title));
    if (subtitle) grow.append(el("span", subtitleClass || null, subtitle));
    item.append(grow);
    if (extra) item.append(extra);
    item.onclick = () => { closeMenu(); onPick(); };
    return item;
  }
  // Résumé court d'une mesure de /models bench pour le menu (détail en info-bulle).
  function shortMeasure(text) {
    if (text.startsWith("‖")) return "‖ indisponible";
    if (text.startsWith("✗")) return "✗ incompatible";
    const tasks = text.match(/^(\d+\/\d+) tâches(?: · (\d+ s))?/);
    if (tasks) return tasks[1] + (tasks[2] ? " · " + tasks[2] : "");
    if (text.startsWith("✓")) return "✓ compatible";
    return text;
  }
  async function setModel(value) {
    try { await api("/api/model", { value }); } catch (error) { toast(error.message); }
  }
  // Petit bouton à droite d'une rangée de menu.
  function miniButton(icon, title, onClick, kind) {
    const button = el("button", "mini" + (kind ? " " + kind : ""));
    button.type = "button";
    button.title = title;
    button.setAttribute("aria-label", title);
    button.innerHTML = svg(icon);
    button.onclick = (event) => { event.stopPropagation(); onClick(); };
    return button;
  }
  const checkMark = () => { const check = el("span", "check"); check.innerHTML = svg("check"); return check; };
  // Relit le catalogue et le classement programmation d'OpenRouter, puis
  // reclasse les modèles gratuits pour le code, du plus puissant au moins puissant.
  async function searchBestModels() {
    try {
      const warning = await loadModels(true);
      if (warning) { toast(warning); return; }
      const best = freeModels[0];
      toast(freeModels.length + " modèle(s) gratuit(s)"
        + (newModelIds.size ? " · " + newModelIds.size + " nouveau(x)" : "")
        + (best ? " · le plus puissant : " + modelName(best.id) : "")
        + " · aucune requête gratuite consommée");
    } catch (error) {
      toast("Recherche impossible : " + error.message);
    }
  }
  // Épingle un modèle en haut du menu, ou le retire des favoris.
  async function toggleFavorite(id) {
    try {
      const result = await api("/api/models/favorite", { value: id, on: !favoriteModels.includes(id) });
      favoriteModels = result.favorites || [];
    } catch (error) {
      toast(error.message);
    }
  }
  // `restore` (facultatif) : recherche et position à retrouver au retour d'une fiche.
  function openModelMenu(restore) {
    showMenu($("model-btn"), (menu) => {
      const search = el("input", "search");

      const find = el("button", "btn wide");

      const findLabel = (busy) => {
        find.innerHTML = svg(busy ? "search" : "spark");
        find.append(el("span", null, busy ? "Recherche sur OpenRouter…" : "Rechercher les modèles gratuits les plus puissants"));

      const known = (id) => freeModels.find((entry) => entry.id === id);
      // Fiche d'un modèle, avec de quoi revenir à cette liste telle qu'elle était.
      const openInfo = (id) => {
        const here = { query: search.value, scrollTop: list.scrollTop };

      // Spécialités du modèle, sous son identifiant.
      const specialtyLine = (item, text) => {

      const modelRow = (id, onPick, extra) => {
        const favorite = favoriteModels.includes(id);
        const row = el("div", "row");
        const item = menuItem(modelName(id), id, onPick, extra, "mono");
        const model = known(id);
        specialtyLine(item, model ? (model.specialties || []).map((specialty) => specialty.label).join(" · ") : "");
        const star = miniButton("star", favorite ? "Retirer des favoris" : "Épingler en haut du menu",
          async () => { await toggleFavorite(id); fill(); }, favorite ? "on" : "");
        row.append(item, star, miniButton("info", "Informations sur ce modèle", () => openInfo(id)));
        return row;
      };
      // Modèle payant d'un classement OpenRouter : prix affiché, confirmation avant usage.
      const paidRow = (entry) => {
        const row = el("div", "row");
        const price = money(entry.prompt_price) + " en entrée, " + money(entry.completion_price) + " en sortie par million de jetons";
        const extra = el("span", "aside");
        extra.append(el("span", "measured bad", "payant"));
        const item = menuItem((entry.name || entry.id).replace(/\s*\(free\)\s*$/i, ""), entry.id, () => {}, extra, "mono");
        specialtyLine(item, "n°" + entry.rank + " de la catégorie · " + money(entry.prompt_price) + " / " + money(entry.completion_price) + " par million");
        item.title = price;
        item.onclick = () => {
          const bar = el("div", "confirm pay");

          const no = el("button", "btn", "Annuler");
          no.type = "button";

          yes.onclick = () => { closeMenu(); setModel(entry.id); };
          no.onclick = () => bar.replaceWith(row);
          row.replaceWith(bar);
          yes.focus();
        };
        row.append(item, miniButton("info", "Informations sur ce modèle", () => openInfo(entry.id)));
        return row;
      };
      // Ce qui s'affiche à droite d'un modèle : nouveauté, mesure, coche.
      // Ressemblance du modèle avec la référence choisie (Opus ou Fable).
      const likenessOf = (id) => {
        const model = known(id);
        return ((model && model.likeness) || []).find((entry) => entry.reference === likenessReference);
      };
      const badges = (id, withLikeness) => {
        const model = known(id);
        const extra = el("span", "aside");
        if (newModelIds.has(id)) extra.append(el("span", "fresh", "nouveau"));
        const like = withLikeness ? likenessOf(id) : null;
        if (like) {
          const badge = el("span", "likeness", like.percent + " %");
          badge.title = "Ressemblance avec " + like.reference_name + " (profil, pas intelligence)";
          extra.append(badge);
        }
        if (model && model.measured) {
          const bad = model.measured.startsWith("✗") || model.measured.startsWith("‖");
          const badge = el("span", "measured" + (bad ? " bad" : ""), shortMeasure(model.measured));
          badge.title = "Mesuré par /models bench : " + model.measured;
          extra.append(badge);
        } else if (model && model.available === false) {
          const badge = el("span", "measured bad", "mis de côté");
          badge.title = "Quota atteint ou panne récente : réessayé plus tard";
          extra.append(badge);
        }
        if (id === status.model) extra.append(checkMark());
        return extra;
      };
      const matches = (id, query) => {
        const model = known(id);
        return !query || id.toLowerCase().includes(query) || ((model && model.name) || "").toLowerCase().includes(query)
          || ((model && model.specialties) || []).some((specialty) => specialty.label.toLowerCase().includes(query));
      };
      const paintCategories = () => {
        cats.textContent = "";
        let hidden = 0;
        for (const category of modelCategories) {
          const free = category.models.length;
          if (!free && !showPaidOnlyCategories && category.key !== modelCategory) { hidden += 1; continue; }
          const chip = el("button", "cat" + (category.key === modelCategory ? " on" : "") + (free ? "" : " nofree"), category.label);
          chip.type = "button";
          chip.append(el("i", null, String(free)));
          chip.title = free + " modèle(s) gratuit(s)" + (category.paid.length ? " · " + category.paid.length + " payant(s) parmi les plus utilisés chez OpenRouter" : "");
          chip.onclick = () => { modelCategory = category.key; paintCategories(); fill(); list.scrollTop = 0; };
          cats.append(chip);
        }
        if (hidden || showPaidOnlyCategories) {
          const more = el("button", "cat more", showPaidOnlyCategories ? "Moins de catégories" : "Autres catégories");
          more.type = "button";
          if (hidden) more.append(el("i", null, String(hidden)));

        const query = search.value.trim().toLowerCase();

        const favorites = favoriteModels.filter((id) => matches(id, query));
        if (favorites.length) {
          list.append(el("div", "group", "Favoris"));
          for (const id of favorites) list.append(modelRow(id, pick(id), badges(id)));
        }
        if (status.model && !known(status.model) && !favoriteModels.includes(status.model) && matches(status.model, query)) {
          list.append(el("div", "group", "Actuel"));
          list.append(modelRow(status.model, () => {}, checkMark()));
        }
        // Une recherche porte sur tous les modèles gratuits, quelle que soit la catégorie.
        const category = modelCategories.find((entry) => entry.key === modelCategory) || modelCategories[0];
        const claude = !query && category && category.key === "claude";
        const ids = query || !category ? freeModels.map((model) => model.id)
          : claude && category.by_reference && category.by_reference[likenessReference] ? category.by_reference[likenessReference]
          : category.models;
        const models = ids.map(known).filter(Boolean).filter((model) => matches(model.id, query));
        const reference = modelReferences.find((entry) => entry.id === likenessReference);
        const title = query ? "Modèles gratuits trouvés"
          : claude ? "Gratuits, du plus proche au moins proche" + (reference ? " de " + reference.name : "")
          : !category || category.key === "programming" ? "Gratuits, du plus puissant au moins puissant"
          : category.key === "all" ? "Tous les modèles gratuits"
          : "Gratuits · " + category.label;
        if (models.length || (category && !query)) {
          list.append(el("div", "group", title));
          if (claude && modelReferences.length > 1) {
            const refs = el("div", "refs");
            for (const entry of modelReferences) {
              const chip = el("button", "cat" + (entry.id === likenessReference ? " on" : ""), entry.name);
              chip.type = "button";
              chip.title = "Comparer à " + entry.name + " (" + entry.id + ")";
              chip.onclick = () => { likenessReference = entry.id; fill(); list.scrollTop = 0; };
              refs.append(chip);
            }
            list.append(refs);
          }
          if (claude) list.append(el("div", "hint-line", "Ressemblance de profil (outils, raisonnement, images, contexte, code, mesures de Claw), pas une égalité d'intelligence."));
          if (modelsCatalogAt) list.append(el("div", "hint-line", "Catalogue OpenRouter lu " + relativeTime(modelsCatalogAt)));
        }
        if (!models.length && category && !query) list.append(el("div", "hint-line", "Aucun modèle gratuit dans cette catégorie."));
        for (const model of models) {
          // Nom du modèle, et dessous son identifiant réel ; sa puissance en info-bulle.
          const power = (model.reasons || []).concat(model.context ? ["contexte " + model.context] : []).join(" · ");
          const row = modelRow(model.id, pick(model.id), badges(model.id, claude));
          row.firstChild.title = power || model.id;
          const like = claude ? likenessOf(model.id) : null;
          if (like) {
            // Ce qui rapproche le modèle de Claude, puis ce qui l'en éloigne.
            const spec = row.querySelector(".spec") || el("span", "spec");
            spec.textContent = (like.matches.length ? "✓ " + like.matches.join(", ").toLowerCase() : "")
              + (like.gaps.length ? (like.matches.length ? " · " : "") + "✗ " + like.gaps.join(", ").toLowerCase() : "");
            spec.title = spec.textContent;
            if (!spec.parentNode) row.querySelector(".grow").append(spec);
          }
          list.append(row);
        }
        if (!query && category && category.paid.length) {
          list.append(el("div", "group", "Payants les plus utilisés chez OpenRouter"));
          for (const entry of category.paid) list.append(paidRow(entry));
        }
        if (!list.children.length) list.append(el("div", "group", "Aucun modèle trouvé"));
      };
      find.onclick = async () => {
        find.disabled = true;
        findLabel(true);
        await searchBestModels();
        find.disabled = false;
        findLabel(false);
        paintCategories();
        fill();
      };
      search.oninput = fill;
      search.onkeydown = (event) => {
        if (event.key === "Enter") { const first = list.querySelector(".item"); if (first) first.click(); }
      };
      const custom = el("div", "custom");
      const field = el("input");
      field.placeholder = "Autre : ollama:qwen3.5:4b, groq:…";
      const go = el("button", "btn primary", "Utiliser");
      go.type = "button";
      const useCustom = () => { const value = field.value.trim(); if (value) { closeMenu(); setModel(value); } };
      go.onclick = useCustom;
      field.onkeydown = (event) => { if (event.key === "Enter") useCustom(); };
      custom.append(field, go);
      menu.append(search, find, cats, list, custom);
      paintCategories();
      if (restore && typeof restore.query === "string") search.value = restore.query;
      fill();
      // La position se rétablit une fois le menu affiché.
      if (restore && typeof restore.scrollTop === "number") setTimeout(() => { list.scrollTop = restore.scrollTop; }, 0);
    });
  }
  async function setMode(value) {

  // Bouton « Sessions » : nouvelle session ; recherche, reprise, titre et
  // effacement des sessions précédentes (celle en cours ne s'efface pas).
  async function openSessionsMenu() {
    showMenu($("sessions-btn"), (menu) => {
      const search = el("input", "search");
      search.placeholder = "Rechercher dans les sessions…";
      const list = el("div", "list");
      const fresh = menuItem("Nouvelle session", "Repartir d'une conversation vide · Ctrl+Maj+O", () => newConversation());
      const lead = el("span", "lead");
      lead.innerHTML = svg("plus");
      fresh.prepend(lead);
      const previous = el("div");
      list.append(fresh, previous);
      menu.append(search, list);
      let query = "", request = 0;
      // Demande de confirmation à la place de `target` : l'effacement est définitif.
      const confirmBar = (target, question, label, action) => {
        const bar = el("div", "confirm");
        const yes = el("button", "btn danger", label);
        yes.type = "button";
        const no = el("button", "btn", "Annuler");
        no.type = "button";
        bar.append(el("span", null, question), yes, no);
        bar.firstChild.title = question;
        no.onclick = () => bar.replaceWith(target);
        yes.onclick = async () => {
          yes.disabled = no.disabled = true;
          try { await action(); } catch (error) { toast(error.message); }
          load();
        };
        target.replaceWith(bar);
        yes.focus();
      };
      // Saisie du titre à la place de la rangée ; vide : titre automatique.
      const renameBar = (row, session) => {
        const bar = el("div", "rename");
        const field = el("input");
        field.value = session.title || "";
        field.maxLength = 80;
        field.placeholder = session.preview || "Titre de la session";
        const ok = el("button", "btn primary", "OK");
        ok.type = "button";
        const no = el("button", "btn", "Annuler");
        no.type = "button";
        const save = async () => {
          ok.disabled = no.disabled = true;
          try { await api("/api/sessions/rename", { id: session.id, title: field.value }); } catch (error) { toast(error.message); }
          load();
        };
        ok.onclick = save;
        no.onclick = () => bar.replaceWith(row);
        field.onkeydown = (event) => {
          if (event.key === "Enter") { event.preventDefault(); save(); }
          else if (event.key === "Escape") { event.preventDefault(); event.stopPropagation(); bar.replaceWith(row); }
        };
        bar.append(field, ok, no);
        row.replaceWith(bar);
        field.focus();
        field.select();
      };
      const render = (sessions) => {
        previous.textContent = "";
        previous.append(el("div", "group", query ? "Sessions contenant « " + query + " »" : "Sessions précédentes"));
        if (!sessions.length) previous.append(el("div", "group", query ? "Aucune session trouvée" : "Aucune session sauvegardée"));
        for (const session of sessions) {
          const current = session.id === status.session_id;
          const title = session.title || session.preview || (session.messages ? "Session sans texte" : "Session vide");
          const details = relativeTime(session.modified) + " · " + session.messages + " message(s)" + (current ? " · en cours" : "");
          // Recherche : l'extrait trouvé remplace les détails.
          const item = menuItem(title, session.snippet || details, async () => {
            if (current) return;
            try { await api("/api/resume", { value: session.id }); } catch (error) { toast(error.message); }
          }, current ? checkMark() : null);
          item.title = (session.title && session.preview ? session.preview + "\n" : "") + (session.snippet ? details + "\n" : "") + session.id;
          const row = el("div", "row");
          row.append(item, miniButton("edit", "Renommer cette session", () => renameBar(row, session)));
          if (!current) {
            row.append(miniButton("trash", "Effacer cette session", () => confirmBar(row, "Effacer « " + title + " » ?", "Effacer",
              () => api("/api/sessions/delete", { value: session.id })), "danger"));
          }
          previous.append(row);
        }
        const others = sessions.filter((session) => session.id !== status.session_id).length;
        if (others > 1 && !query) {
          const foot = el("div", "foot");
          const all = el("button", "btn wide danger");
          all.type = "button";
          all.innerHTML = svg("trash");
          all.append(el("span", null, "Effacer les " + others + " sessions précédentes"));
          all.onclick = () => confirmBar(all, "Effacer " + others + " sessions ? C'est définitif.", "Tout effacer", async () => {
            const result = await api("/api/sessions/clear", {});
            toast(result.deleted + " session(s) effacée(s)");
          });
          foot.append(all);
          previous.append(foot);
        }
      };
      const load = () => {
        if (!previous.children.length) previous.append(el("div", "group", "Chargement…"));
        const mine = ++request;
        api("/api/sessions" + (query ? "?q=" + encodeURIComponent(query) : ""))
          .then((data) => { if (mine === request) render(data.sessions || []); })
          .catch((error) => { previous.textContent = ""; previous.append(el("div", "group", "Erreur : " + error.message)); });
      };
      let typing = null;
      search.oninput = () => {
        clearTimeout(typing);
        typing = setTimeout(() => { query = search.value.trim(); load(); }, 250);
      };
      load();
    });
  }

  // ---------------------------------------------------------------- palette (Ctrl+K)
  function openPalette() {
    closeMenu();
    if ($("palette-backdrop")) return;
    const backdrop = el("div");
    backdrop.id = "palette-backdrop";
    const panel = el("div", "menu");
    panel.id = "palette";
    const search = el("input", "search");
    search.placeholder = "Rechercher une action, un modèle, une commande…";
    const list = el("div", "list");
    panel.append(search, list);
    backdrop.append(panel);
    document.body.appendChild(backdrop);
    const close = () => { backdrop.remove(); input.focus(); };
    const actions = [
      ["Actions", "Nouvelle session", "Ctrl+Maj+O", () => newConversation()],
      ["Actions", "Sessions précédentes", "", () => openSessionsMenu()],
      ["Actions", "Crédits OpenRouter", "Solde, requêtes gratuites", () => openCreditsDialog()],
      ["Actions", "Rechercher les modèles gratuits les plus puissants", "Relit le catalogue OpenRouter", () => searchBestModels()],
      ["Actions", "Informations sur le modèle actuel", status.model || "", () => { if (status.model) openModelInfo(status.model); }],
      ["Actions", "Arrêter le tour en cours", "Échap", () => interruptTurn()],
      ["Actions", "Joindre une image", "", () => $("file-input").click()],
      ["Actions", "Changer de thème", "", () => cycleTheme()],
      ...MODES.map(([id, label, hint]) => ["Mode", "Mode : " + label, hint, () => setMode(id)]),
      ...freeModels.map((model) => ["Modèle", modelName(model.id), model.id + (model.measured ? " · " + model.measured : ""), () => setModel(model.id)]),
      ...COMMANDS.concat(customCommands).map(([command, label]) => ["Commande", command, label, () => { input.value = command + " "; onInput(); }]),
    ];
    let active = 0, shown = [];
    const fill = () => {
      const query = search.value.trim().toLowerCase();
      shown = actions.filter(([, label, hint]) => !query || (label + " " + hint).toLowerCase().includes(query)).slice(0, 60);
      list.textContent = "";
      let group = "";
      shown.forEach(([g, label, hint, run], index) => {
        if (g !== group) { group = g; list.append(el("div", "group", g)); }
        const item = el("button", "item" + (index === active ? " active" : ""));
        item.type = "button";
        const grow = el("span", "grow");
        grow.append(el("b", null, label));
        if (hint) grow.append(el("span", null, hint));
        item.append(grow);
        item.onmousedown = (event) => { event.preventDefault(); close(); run(); };
        list.append(item);
      });
      const current = list.querySelector(".item.active");
      if (current) current.scrollIntoView({ block: "nearest" });
    };
    search.oninput = () => { active = 0; fill(); };
    search.onkeydown = (event) => {
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        active = (active + (event.key === "ArrowDown" ? 1 : shown.length - 1)) % Math.max(shown.length, 1);
        fill();
      } else if (event.key === "Enter") {
        event.preventDefault();
        const pick = shown[active];
        close();
        if (pick) pick[3]();
      } else if (event.key === "Escape") { event.preventDefault(); close(); }
    };
    backdrop.onmousedown = (event) => { if (event.target === backdrop) close(); };
    fill();
    search.focus();
  }

  // ---------------------------------------------------------------- état de l'agent
  function updateTitle() {
    const project = basename(status.cwd);
    document.title = (pendingPermissions > 0 ? "▲ Autorisation · " : status.busy ? "● " : "") + "Claw Code" + (project ? " · " + project : "");
  }
  function setActivity(text) {
    currentActivity = text;
    $("activity-what").textContent = text;
  }
  function tickBusy() {
    if (!busySince) return;
    $("activity-time").textContent = Math.round((Date.now() - busySince) / 1000) + " s";
  }
  setInterval(tickBusy, 1000);
  function applyStatus(next) {
    const wasBusy = !!status.busy;
    const modelChanged = next.model !== status.model;
    status = next;
    $("project-path").textContent = (next.cwd || "").replace(/^\\\\\?\\/, "");
    $("project-path").title = $("project-path").textContent;
    const emptyProject = $("empty-project");
    if (emptyProject) emptyProject.textContent = basename(next.cwd) || "ce projet";
    if (modelChanged) renderModelButton();
    renderModeButton();
    if (next.busy && !busySince) { busySince = Date.now(); setActivity("Claw réfléchit…"); }
    $("activity").hidden = !next.busy;
    sendBtn.classList.toggle("stop", !!next.busy);
    sendBtn.innerHTML = svg(next.busy ? "stop" : "arrowUp");
    sendBtn.title = next.busy ? "Arrêter (Échap) — un message tapé partira à la fin du tour" : "Envoyer (Entrée)";
    const tokens = (next.input_tokens || 0) + (next.output_tokens || 0);
    $("usage").textContent = tokens ? tokens.toLocaleString("fr-FR") + " jetons" + (next.cost ? " · " + next.cost : "") : "";
    if (wasBusy && !next.busy) {
      const took = busySince ? Date.now() - busySince : 0;
      busySince = null;
      if (took > 1500 && logInner.querySelector(".md, .steps")) {
        const end = el("div", "turn-end");
        end.innerHTML = svg("check") + "Terminé en " + seconds(took);
        append(end);
      }
      loadCredits();
    }
    tickBusy();
    updateTitle();
  }

  // `fresh` : relit le catalogue chez OpenRouter au lieu du cache de 24 h ;
  // renvoie l'avertissement du serveur s'il n'a pas pu le relire.
  async function loadModels(fresh) {
    const known = new Set(freeModels.map((model) => model.id));
    let warning = "";
    try {
      const data = await api("/api/models" + (fresh ? "?fresh=1" : ""));
      freeModels = data.models || [];
      modelsCatalogAt = data.catalog_at || 0;
      favoriteModels = data.favorites || [];
      modelCategories = data.categories || [];
      modelReferences = data.references || [];
      if (!modelReferences.some((reference) => reference.id === likenessReference)) {
        likenessReference = modelReferences.length ? modelReferences[0].id : "";
      }
      warning = data.warning || "";
      // Modèles apparus depuis la liste précédente.
      newModelIds = new Set(fresh && known.size ? freeModels.filter((model) => !known.has(model.id)).map((model) => model.id) : []);
    } catch (error) {
      if (fresh) throw error;
      freeModels = [];
    }
    renderModelButton();
    return warning;
  }
  async function loadCustomCommands() {
    try {
      const data = await api("/api/commands");
      customCommands = (data.commands || []).map((command) => [
        command.name,
        [command.hint, command.description].filter(Boolean).join(" — ") + " (" + command.scope + ")",
      ]);
    } catch (_) { customCommands = []; }
  }

  // ---------------------------------------------------------------- envoi
  let pendingImages = [];
  async function sendMessage() {
    const text = input.value.trim();
    if (!text && !pendingImages.length) return;
    if (status.busy) toast("Ajouté à la file : partira à la fin du tour en cours.");
    hideSuggestions();
    try {
      const images = pendingImages.map(({ media_type, data }) => ({ media_type, data }));
      await api("/api/message", { text, images });
      input.value = "";
      pendingImages = [];
      renderAttachments();
      autoGrow();
      scrollToBottom(true);
    } catch (error) {
      toast(error.message);
    }
  }
  async function interruptTurn() {
    if (!status.busy) return;
    try { await api("/api/interrupt", {}); setActivity("Interruption demandée…"); } catch (error) { toast(error.message); }
  }
  async function newConversation() {
    if (logInner.querySelector(".user, .md") && !confirm("Commencer une nouvelle session ? L'actuelle reste dans les sessions précédentes.")) return;
    try { await api("/api/new", {}); } catch (error) { toast(error.message); }

  function cycleTheme() {
    themePref = { auto: "light", light: "dark", dark: "auto" }[themePref];

    toast("Thème : " + ({ auto: "automatique", light: "clair", dark: "sombre" })[themePref]);
