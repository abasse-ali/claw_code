  // « À ce rythme (≈ 42 requêtes/h), quota épuisé vers 18:05 », d'après les
  // requêtes de la dernière heure ; vide sans recul suffisant.
  function paceText(data) {
    if (!data.pace || !data.free || data.free.remaining <= 0) return "";
    const rate = "à ce rythme (≈ " + data.pace.per_hour + " requêtes/h)";
    if (!data.pace.exhausted_at) return rate + ", le quota tient jusqu'à sa remise à zéro";
    return rate + ", quota épuisé vers " + new Date(data.pace.exhausted_at * 1000).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }
  // Alerte quand le quota gratuit passe sous 100, 20 puis 0 requêtes : une
  // fois par seuil et par jour (UTC).
  function quotaAlert(data) {
    if (!data.free) return;
    const left = data.free.remaining;
    const threshold = left <= 0 ? 0 : left <= 20 ? 20 : left < 100 ? 100 : null;
    if (threshold === null) return;
    const key = "claw-quota-" + Math.floor(Date.now() / 86400000) + "-" + threshold;
    if (quotaAlerts.has(key)) return;
    quotaAlerts.add(key);
    try {
      if (sessionStorage.getItem(key)) return;
      sessionStorage.setItem(key, "1");
    } catch (_) { /* stockage indisponible : l'alerte reste unique pour cette page */ }
    const pace = paceText(data);
    toast(left <= 0 ? "Quota gratuit du jour épuisé (remise à zéro à minuit UTC)"
      : "Il reste " + left + " requêtes gratuites aujourd'hui" + (pace ? " · " + pace : ""));
  }
  async function loadCredits() {
    try { renderCredits(await api("/api/credits")); } catch (_) { /* affichage précédent conservé */ }
  }
  setInterval(loadCredits, 60000);

  // Fenêtre de détail des crédits, au centre de la page (clic sur la pastille).
  const money = (amount) => typeof amount !== "number" ? "-"
    : (Math.abs(amount) > 0 && Math.abs(amount) < 0.01 ? amount.toFixed(4) : amount.toFixed(2)).replace(".", ",") + " $";
  function untilUtcMidnight() {
    const now = new Date();
    const next = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1);
    const minutes = Math.max(0, Math.round((next - now.getTime()) / 60000));
    return Math.floor(minutes / 60) + " h " + String(minutes % 60).padStart(2, "0");
  }
  // Fenêtre au centre de la page : fermée par Échap, la croix ou un clic à côté.
  function openDialog(label) {
    closeMenu();
    const previous = $("dialog-backdrop");
    if (previous && previous.closeDialog) previous.closeDialog();
    const backdrop = el("div");
    backdrop.id = "dialog-backdrop";
    const panel = el("div", "dialog");
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-modal", "true");
    panel.setAttribute("aria-label", label);
    backdrop.append(panel);
    const dialog = { panel, onClose: null };
    const onKey = (event) => {
      if (event.key !== "Escape") return;
      event.preventDefault();
      event.stopPropagation();
      dialog.close();
    };
    dialog.close = () => {
      if (dialog.onClose) dialog.onClose();
      document.removeEventListener("keydown", onKey, true);
      backdrop.remove();
      input.focus();
    };
    // En-tête commun : icône, titre, croix.
    dialog.head = (icon) => {
      const head = el("div", "dialog-head");
      head.innerHTML = svg(icon);
      head.append(el("span", null, label));
      const x = el("button", "icon-btn");
      x.type = "button";
      x.title = "Fermer (Échap)";
      x.setAttribute("aria-label", "Fermer");
      x.innerHTML = svg("x");
      x.onclick = dialog.close;
      head.append(el("span", "spacer"), x);
      return head;
    };
    backdrop.closeDialog = dialog.close;
    document.addEventListener("keydown", onKey, true);
    backdrop.onmousedown = (event) => { if (event.target === backdrop) dialog.close(); };
    document.body.appendChild(backdrop);
    return dialog;
  }

  // Confirmation dans la page. Le `confirm()` du navigateur est bloqué dans

      yes.onclick = () => { accepted = true; dialog.close(); };
      const no = el("button", "btn", "Annuler");

      no.onclick = () => dialog.close();
      const actions = el("div", "actions");

  // Fiche d'un modèle (petit bouton d'information du menu des modèles).

  // `back` (facultatif) rouvre la liste d'où la fiche a été demandée.

    else if (info.tools === false) chip("Sans appel d'outils natif", "warn");
    if (info.images) chip("Lit les images");

        const meter = el("div", "meter");
        const fill = el("i");
        fill.style.width = Math.max(2, Math.min(100, like.percent)) + "%";
        meter.append(fill);

        list.style.margin = "0 0 4px";
        for (const criterion of like.criteria || []) {

          dd.append(el("small", null, criterion.detail));
          list.append(el("dt", null, criterion.label), dd);
        }
        block.append(head, meter, list);
      }
      block.append(el("div", "note", "Ressemblance de profil sur des critères vérifiables, pas une égalité d'intelligence : « Mesurer ce modèle » vérifie ses capacités réelles."));

    // Ses spécialités, chacune avec le fait qui la justifie.
    if (info.specialties && info.specialties.length) {
      const block = el("div", "usage");
      block.append(el("div", "usage-title", "Spécialités"));
      const list = el("dl", "rows");
      list.style.margin = "0";
      for (const specialty of info.specialties) list.append(el("dt", null, specialty.label), el("dd", null, specialty.detail));
      block.append(list);
      body.append(block);
    }

    const rows = el("dl", "rows");
    const row = (label, value, detail) => {
      const dd = el("dd", null, value);
      if (detail) dd.append(el("small", null, detail));
      rows.append(el("dt", null, label), dd);
    };
    row("Fournisseur", info.provider || "-");
    if (typeof info.context_length === "number") row("Contexte", tokenCount(info.context_length));
    if (typeof info.max_output === "number") row("Réponse maximale", tokenCount(info.max_output));
    if (info.local) row("Prix", "Aucun", "modèle servi par cette machine");
    else if (info.free === true) row("Prix", "Gratuit", "compté dans les requêtes gratuites du jour");
    else if (typeof info.prompt_price === "number" && typeof info.completion_price === "number") {
      row("Prix", money(info.prompt_price) + " en entrée", money(info.completion_price) + " en sortie, par million de jetons");
    }
    if (info.in_catalog) row("Classement programmation", info.programming_rank ? "n° " + info.programming_rank + " chez OpenRouter" : "hors classement");
    if (typeof info.score === "number") row("Puissance estimée pour le code", String(info.score), (info.reasons || []).join(" · "));
    if (info.measured) row("Mesuré par Claw", info.measured, info.measured_at ? relativeTime(info.measured_at) : "");
    else row("Mesuré par Claw", "pas encore", "/models bench le mesure sur de vraies tâches");
    if (info.hard) row("Raisonnement (tests cachés)", info.hard.text, info.hard_unassisted ? "sans les aides de Claw : " + info.hard_unassisted.text : "");
    row("Disponibilité", info.available === false ? "Mis de côté" : "Disponible", info.available === false ? "quota atteint ou panne récente, réessayé plus tard" : "");
    body.append(rows);

    if (!info.in_catalog && !info.local) {
      body.append(el("div", "note source", "Ce modèle n'est pas dans le catalogue OpenRouter gardé en cache : la recherche des modèles gratuits l'actualise."));

    if (info.catalog_at && info.in_catalog) {
      body.append(el("div", "note source", "Données du catalogue OpenRouter, lu " + relativeTime(info.catalog_at) + "."));

    if (info.url) {
      const link = el("a", "btn", "Voir sur OpenRouter");

      link.target = "_blank";
      link.rel = "noopener noreferrer";
      actions.append(link);
    }
    if (!current) {

      use.type = "button";
      use.onclick = () => { dialog.close(); setModel(id); };
      actions.append(use);
    }

    // Mesure sur de vraies tâches (/models bench), pour un modèle gratuit ou local.
    if ((info.free === true || info.local) && info.tools !== false) {
      const measure = el("div", "measure");
      const idle = () => {
        measure.textContent = "";
        measure.append(el("div", "note", "Mesurer ce modèle sur de vraies tâches : le résultat sert à le classer."));
        const line = el("div", "line");
        const offer = (label, flag, requests, minutes) => {
          const button = el("button", "btn", label);
          button.type = "button";
          button.onclick = () => {
            measure.textContent = "";
            measure.append(el("div", "note", "Lancer la mesure ? Elle occupe l'agent " + minutes + " et consomme jusqu'à " + requests
              + " requêtes" + (info.local ? " locales." : " gratuites.")));
            const confirmLine = el("div", "line");
            const go = el("button", "btn primary", "Lancer");
            go.type = "button";
            go.onclick = async () => {
              go.disabled = true;
              try {
                await api("/api/message", { text: "/models bench " + flag + (info.local ? "--local " : "") + id, images: [] });
                benchPending = true;
                dialog.close();
                scrollToBottom(true);
              } catch (error) {
                toast(error.message);
                go.disabled = false;
              }
            };
            const back = el("button", "btn", "Annuler");
            back.type = "button";
            back.onclick = idle;
            confirmLine.append(go, back);
            measure.append(confirmLine);
          };
          return button;
        };
        line.append(offer("Trois tâches de code", "", 40, "quelques minutes"),
          offer("Raisonnement (tests cachés)", "--difficile ", 85, "jusqu'à une heure"));
        measure.append(line);
      };
      idle();
      body.append(measure);
    }
    body.append(actions);
  }

  // ---------------------------------------------------------------- menus
  let openMenu = null;
  function closeMenu() {
    if (openMenu) { openMenu.remove(); openMenu = null; }
  }
  function showMenu(anchor, build) {
    const wasOpen = openMenu && openMenu.dataset.anchor === anchor.id;
    closeMenu();
    if (wasOpen) return;
    const menu = el("div", "menu");
    menu.dataset.anchor = anchor.id;
    build(menu);
    document.body.appendChild(menu);
    // Vers le bas sous la barre du haut, vers le haut depuis la zone de saisie ;
    // aligné sur le bord du bouton le plus proche du centre.
    const rect = anchor.getBoundingClientRect();
    if (rect.top > window.innerHeight / 2) {
      menu.style.top = "auto";
      menu.style.bottom = Math.max(12, window.innerHeight - rect.top + 6) + "px";
      menu.style.maxHeight = "min(70vh, " + Math.max(200, rect.top - 24) + "px)";
    } else {
      menu.style.top = rect.bottom + 6 + "px";
    }
    if (rect.left + rect.width / 2 < window.innerWidth / 2) menu.style.left = Math.max(12, rect.left) + "px";
    else menu.style.right = Math.max(12, window.innerWidth - rect.right) + "px";
    // Jamais hors de la fenêtre (écran étroit, panneau de VS Code).
    const box = menu.getBoundingClientRect();
    if (box.left < 12 || box.right > window.innerWidth - 12) {
      menu.style.right = "auto";
      menu.style.left = Math.max(12, Math.min(box.left, window.innerWidth - 12 - box.width)) + "px";
    }
    openMenu = menu;
    const search = menu.querySelector("input.search");
    if (search) search.focus();
  }
  function menuItem(title, subtitle, onPick, extra, subtitleClass) {
    const item = el("button", "item");
    item.type = "button";
    const grow = el("span", "grow");
    grow.append(el("b", null, title));
    if (subtitle) grow.append(el("span", subtitleClass || null, subtitle));
    item.append(grow);
    if (extra) item.append(extra);
    item.onclick = () => { closeMenu(); onPick(); };
    return item;
  }
  // Résumé court d'une mesure de /models bench pour le menu (détail en info-bulle).
  function shortMeasure(text) {
    if (text.startsWith("‖")) return "‖ indisponible";
    if (text.startsWith("✗")) return "✗ incompatible";
    const tasks = text.match(/^(\d+\/\d+) tâches(?: · (\d+ s))?/);
    if (tasks) return tasks[1] + (tasks[2] ? " · " + tasks[2] : "");
    if (text.startsWith("✓")) return "✓ compatible";
    return text;
  }
  async function setModel(value) {
    try { await api("/api/model", { value }); } catch (error) { toast(error.message); }
  }
  // Petit bouton à droite d'une rangée de menu.

    const button = el("button", "mini" + (kind ? " " + kind : ""));
    button.type = "button";
    button.title = title;
    button.setAttribute("aria-label", title);
    button.innerHTML = svg(icon);
    button.onclick = (event) => { event.stopPropagation(); onClick(); };
    return button;
  }
  const checkMark = () => { const check = el("span", "check"); check.innerHTML = svg("check"); return check; };
  // Relit le catalogue et le classement programmation d'OpenRouter, puis
  // reclasse les modèles gratuits pour le code, du plus puissant au moins puissant.
  async function searchBestModels() {
    try {
      const warning = await loadModels(true);
      if (warning) { toast(warning); return; }
      const best = freeModels[0];
      toast(freeModels.length + " modèle(s) gratuit(s)"
        + (newModelIds.size ? " · " + newModelIds.size + " nouveau(x)" : "")
        + (best ? " · le plus puissant : " + modelName(best.id) : "")
        + " · aucune requête gratuite consommée");
    } catch (error) {
      toast("Recherche impossible : " + error.message);
    }
  }
  // Épingle un modèle en haut du menu, ou le retire des favoris.
  async function toggleFavorite(id) {

          async () => { await toggleFavorite(id); fill(); }, favorite ? "on" : "");

      };

      const paidRow = (entry) => {

        const extra = el("span", "aside");

          : entry.better_ranked ? "mieux classé que Claude en programmation (n°" + entry.rank + " contre n°" + entry.reference_rank + ")"
          : entry.gaps && entry.gaps.length ? "✗ " + entry.gaps.join(", ").toLowerCase()

      const likenessOf = (id) => {
        const model = known(id);

      };
      const badges = (id, withLikeness) => {
        const model = known(id);
        const extra = el("span", "aside");
        if (newModelIds.has(id)) extra.append(el("span", "fresh", "nouveau"));
        const like = withLikeness ? likenessOf(id) : null;
        if (like) {
          const badge = el("span", "likeness", like.percent + " %");
          badge.title = "Ressemblance avec " + like.reference_name + " (profil, pas intelligence)";
          extra.append(badge);
        }
        if (model && model.measured) {
          const bad = model.measured.startsWith("✗") || model.measured.startsWith("‖");
          const badge = el("span", "measured" + (bad ? " bad" : ""), shortMeasure(model.measured));
          badge.title = "Mesuré par /models bench : " + model.measured;
          extra.append(badge);
        } else if (model && model.available === false) {
          const badge = el("span", "measured bad", "mis de côté");
          badge.title = "Quota atteint ou panne récente : réessayé plus tard";
          extra.append(badge);
        }
        if (id === status.model) extra.append(checkMark());
        return extra;
      };
      const matches = (id, query) => {
        const model = known(id);
        return !query || id.toLowerCase().includes(query) || ((model && model.name) || "").toLowerCase().includes(query)
          || ((model && model.specialties) || []).some((specialty) => specialty.label.toLowerCase().includes(query));
      };
      const paintCategories = () => {
        cats.textContent = "";
        let hidden = 0;
        for (const category of modelCategories) {
          const free = category.models.length;
          if (!free && !showPaidOnlyCategories && category.key !== modelCategory) { hidden += 1; continue; }
          const chip = el("button", "cat" + (category.key === modelCategory ? " on" : "") + (free ? "" : " nofree"), category.label);
          chip.type = "button";
          chip.append(el("i", null, String(free)));

        // Une recherche porte sur tous les modèles gratuits, quelle que soit la catégorie.

        const claude = !query && category && category.key === "claude";
        const ids = query || !category ? freeModels.map((model) => model.id)

          : !category || category.key === "programming" ? "Gratuits, du plus puissant au moins puissant"
          : category.key === "all" ? "Tous les modèles gratuits"
          : "Gratuits · " + category.label;

            spec.title = spec.textContent;

  async function setMode(value) {
    if (value === "danger-full-access" && value !== status.permission_mode) {

  // Bouton « Sessions » : nouvelle session ; recherche, reprise, titre et
  // effacement des sessions précédentes (celle en cours ne s'efface pas).
  async function openSessionsMenu() {
    showMenu($("sessions-btn"), (menu) => {
      const search = el("input", "search");
      search.placeholder = "Rechercher dans les sessions…";
      const list = el("div", "list");
      const fresh = menuItem("Nouvelle session", "Repartir d'une conversation vide · Ctrl+Maj+O", () => newConversation());
      const lead = el("span", "lead");
      lead.innerHTML = svg("plus");
      fresh.prepend(lead);
      const previous = el("div");
      list.append(fresh, previous);
      menu.append(search, list);
      let query = "", request = 0;
      // Demande de confirmation à la place de `target` : l'effacement est définitif.
      const confirmBar = (target, question, label, action) => {
        const bar = el("div", "confirm");
        const yes = el("button", "btn danger", label);
        yes.type = "button";
        const no = el("button", "btn", "Annuler");
        no.type = "button";
        bar.append(el("span", null, question), yes, no);
        bar.firstChild.title = question;
        no.onclick = () => bar.replaceWith(target);
        yes.onclick = async () => {
          yes.disabled = no.disabled = true;
          try { await action(); } catch (error) { toast(error.message); }
          load();
        };
        target.replaceWith(bar);
        yes.focus();
      };
      // Saisie du titre à la place de la rangée ; vide : titre automatique.
      const renameBar = (row, session) => {
        const bar = el("div", "rename");
        const field = el("input");
        field.value = session.title || "";
        field.maxLength = 80;
        field.placeholder = session.preview || "Titre de la session";
        const ok = el("button", "btn primary", "OK");
        ok.type = "button";
        const no = el("button", "btn", "Annuler");
        no.type = "button";
        const save = async () => {
          ok.disabled = no.disabled = true;
          try { await api("/api/sessions/rename", { id: session.id, title: field.value }); } catch (error) { toast(error.message); }
          load();
        };
        ok.onclick = save;
        no.onclick = () => bar.replaceWith(row);
        field.onkeydown = (event) => {
          if (event.key === "Enter") { event.preventDefault(); save(); }
          else if (event.key === "Escape") { event.preventDefault(); event.stopPropagation(); bar.replaceWith(row); }
        };
        bar.append(field, ok, no);
        row.replaceWith(bar);
        field.focus();
        field.select();
      };
      const render = (sessions) => {
        previous.textContent = "";
        previous.append(el("div", "group", query ? "Sessions contenant « " + query + " »" : "Sessions précédentes"));
        if (!sessions.length) previous.append(el("div", "group", query ? "Aucune session trouvée" : "Aucune session sauvegardée"));
        for (const session of sessions) {
          const current = session.id === status.session_id;
          const title = session.title || session.preview || (session.messages ? "Session sans texte" : "Session vide");
          const details = relativeTime(session.modified) + " · " + session.messages + " message(s)" + (current ? " · en cours" : "");
          // Recherche : l'extrait trouvé remplace les détails.
          const item = menuItem(title, session.snippet || details, async () => {
            if (current) return;
            try { await api("/api/resume", { value: session.id }); } catch (error) { toast(error.message); }
          }, current ? checkMark() : null);
          item.title = (session.title && session.preview ? session.preview + "\n" : "") + (session.snippet ? details + "\n" : "") + session.id;
          const row = el("div", "row");
          row.append(item, miniButton("edit", "Renommer cette session", () => renameBar(row, session)));
          if (!current) {
            row.append(miniButton("trash", "Effacer cette session", () => confirmBar(row, "Effacer « " + title + " » ?", "Effacer",
              () => api("/api/sessions/delete", { value: session.id })), "danger"));
          }
          previous.append(row);
        }
        const others = sessions.filter((session) => session.id !== status.session_id).length;
        if (others > 1 && !query) {
          const foot = el("div", "foot");
          const all = el("button", "btn wide danger");
          all.type = "button";
          all.innerHTML = svg("trash");
          all.append(el("span", null, "Effacer les " + others + " sessions précédentes"));
          all.onclick = () => confirmBar(all, "Effacer " + others + " sessions ? C'est définitif.", "Tout effacer", async () => {
            const result = await api("/api/sessions/clear", {});
            toast(result.deleted + " session(s) effacée(s)");
          });
          foot.append(all);
          previous.append(foot);
        }
      };
      const load = () => {
        if (!previous.children.length) previous.append(el("div", "group", "Chargement…"));
        const mine = ++request;
        api("/api/sessions" + (query ? "?q=" + encodeURIComponent(query) : ""))
          .then((data) => { if (mine === request) render(data.sessions || []); })
          .catch((error) => { previous.textContent = ""; previous.append(el("div", "group", "Erreur : " + error.message)); });
      };
      let typing = null;
      search.oninput = () => {
        clearTimeout(typing);
        typing = setTimeout(() => { query = search.value.trim(); load(); }, 250);
      };
      load();
    });
  }

  // ---------------------------------------------------------------- agents : sessions en arrière-plan
  const JOB_STATES = {
    working: ["au travail", "var(--accent)"],
    blocked: ["attend une réponse", "var(--warn)"],
    done: ["terminée", "var(--ok)"],
    failed: ["en échec", "var(--err)"],
    stopped: ["arrêtée", "var(--text-3)"],
  };
  let background = null;
  function renderAgentsButton() {
    const data = background || { jobs: [], tasks: [], blocked: 0, held: 0 };

    const active = data.jobs.filter((job) => job.state === "working").length + data.tasks.length;
    $("agents-btn").innerHTML = svg("bot") + '<span class="label">Agents</span>' +
      (waiting ? '<span class="badge warn">' + waiting + "</span>" : active ? '<span class="badge">' + active + "</span>" : "") + svg("chevronDown");
    $("agents-btn").title = waiting
      ? waiting + " élément(s) attendent une réponse (session en arrière-plan ou message retenu)"
      : "Agents : sessions en arrière-plan, tâches planifiées, Monitors";
  }
  async function loadBackground() {
    try { background = await api("/api/background"); } catch (_) { return background; }
    renderAgentsButton();
    return background;
  }
  // Rangée de menu sans action (tâche, Monitor, sous-tâche).
  function staticItem(title, subtitle) {
    const item = el("div", "item static");

    grow.append(el("b", null, title));
    if (subtitle) grow.append(el("span", null, subtitle));
    item.append(grow);
    item.title = title + (subtitle ? "\n" + subtitle : "");

  }
  // Bouton « Agents » : lancer une session en arrière-plan ; suivre, répondre,
  // arrêter ; tâches planifiées, Monitors et sous-tâches de cette session.
  function openAgentsMenu() {
    showMenu($("agents-btn"), (menu) => {
      menu.classList.add("agents");
      const field = el("input", "search");
      field.placeholder = "Nouvelle session en arrière-plan : la tâche…";
      field.title = "Entrée : la session part dans son propre worktree, avec le modèle et le mode de cette page · !commande : une commande shell";
      const list = el("div", "list");
      menu.append(field, list);
      const refresh = () => loadBackground().then((data) => { if (data && openMenu === menu) render(data); });
      const action = async (path, body) => {
        try {
          const answer = await api(path, body);
          if (answer && answer.message) toast(answer.message.split("\n")[0]);
        } catch (error) { toast(error.message); }
        refresh();
      };
      field.onkeydown = async (event) => {
        if (event.key !== "Enter" || !field.value.trim()) return;
        event.preventDefault();
        field.disabled = true;

          toast((await api("/api/jobs/dispatch", { value: field.value.trim() })).message);

        } catch (error) { toast(error.message); }

        field.focus();
        refresh();
      };
      const render = (data) => {
        list.textContent = "";

        if (!data.jobs.length) list.append(el("div", "hint-line", "Aucune session. Tapez une tâche ci-dessus, ou /bg pour y envoyer cette conversation."));
        for (const job of data.jobs) {
          const [label, color] = JOB_STATES[job.state] || [job.state, "var(--text-3)"];
          const details = [label, job.age, job.branch ? "branche " + job.branch : null, job.detail].filter(Boolean).join(" · ");
          const item = menuItem(job.name, details, () => openJobDialog(job.id));
          const dot = el("span", "dot");
          dot.style.background = color;
          item.prepend(dot);

          const row = el("div", "row");
          row.append(item);
          if (job.state === "working" || job.state === "blocked") {
            row.append(miniButton("stop", "Arrêter cette session", () => action("/api/jobs/stop", { value: job.id })));
          } else {
            row.append(miniButton("trash", "Retirer de la liste (le worktree reste s'il contient du travail ; la conversation reste dans les sessions)",
              () => action("/api/jobs/remove", { value: job.id }), "danger"));
          }
          list.append(row);
        }
        if (data.tasks.length) {
          list.append(el("div", "group", "Tâches planifiées de cette session"));
          for (const task of data.tasks) {
            const row = el("div", "row");
            row.append(staticItem(task.prompt || task.id, task.kind + " · prochain passage " + task.next),
              miniButton("trash", "Supprimer cette tâche", () => action("/api/tasks/delete", { value: task.id }), "danger"));
            list.append(row);
          }
        }
        if (data.monitors.length) {
          list.append(el("div", "group", "Monitors"));
          for (const line of data.monitors) {
            const id = (line.match(/monitor-\d+/) || [""])[0];
            const row = el("div", "row");
            row.append(staticItem(line.trim()));
            if (id && !/\bfinie\b/.test(line)) row.append(miniButton("stop", "Arrêter ce Monitor", () => action("/api/monitors/stop", { value: id })));
            list.append(row);
          }
        }
        if (data.subtasks.length) {
          list.append(el("div", "group", "Sous-tâches"));
          for (const line of data.subtasks) list.append(staticItem(line.trim()));
        }
        list.append(el("div", "group", "Messages entre sessions"));
        list.append(el("div", "hint-line", (data.me ? "Cette page : @" + data.me : "Messagerie coupée (CLAW_DISABLE_PEERS)") +
          (data.peers.length ? " · joignables : " + data.peers.map((peer) => "@" + peer.name + " (" + peer.status + ")").join(", ") : " · aucune autre session ouverte")));
        if (data.held) list.append(el("div", "hint-line warn", data.held + " message(s) retenu(s) : /peers pour les voir, /peers accept pour les délivrer"));
      };
      if (background) render(background);
      else list.append(el("div", "group", "Chargement…"));
      refresh();
      const timer = setInterval(() => { if (openMenu !== menu) { clearInterval(timer); return; } refresh(); }, 3000);
    });
  }
  // Fenêtre d'une session en arrière-plan : sa question, ses dernières
  // sorties, une réponse (permission, question ou nouvelle demande).
  function openJobDialog(id) {
    const known = (background && background.jobs.find((job) => job.id === id)) || { id, name: id };
    const dialog = openDialog(known.name);
    dialog.panel.classList.add("job");
    const chips = el("div", "chips");
    const question = el("div", "job-question");
    question.hidden = true;
    const output = el("pre", "job-log", "Chargement…");
    const form = el("div", "job-reply");
    const field = el("input");
    field.placeholder = "Répondre à la session, ou lui donner une nouvelle demande…";
    const send = el("button", "btn primary", "Envoyer");
    send.type = "button";
    form.append(field, send);
    const actions = el("div", "actions");
    const stop = el("button", "btn", "Arrêter");
    stop.type = "button";
    const remove = el("button", "btn danger", "Retirer de la liste");
    remove.type = "button";
    actions.append(stop, remove);
    dialog.panel.append(dialog.head("bot"), chips, question, output, form, actions);
    let lastQuestion = null;
    const reply = async (text) => {
      if (!text.trim()) return;
      try {
        toast((await api("/api/jobs/reply", { id, text })).message);
        field.value = "";
      } catch (error) { toast(error.message); }
      update();
    };
    send.onclick = () => reply(field.value);
    field.onkeydown = (event) => { if (event.key === "Enter") { event.preventDefault(); reply(field.value); } };
    stop.onclick = async () => {
      try { toast((await api("/api/jobs/stop", { value: id })).message); } catch (error) { toast(error.message); }
      update();
    };
    remove.onclick = async () => {
      try { toast((await api("/api/jobs/remove", { value: id })).message.split("\n")[0]); dialog.close(); loadBackground(); } catch (error) { toast(error.message); }
    };
    const choice = (label, text, kind) => {
      const button = el("button", "btn" + (kind ? " " + kind : ""), label);
      button.type = "button";
      button.onclick = () => reply(text);
      return button;
    };
    const update = async () => {
      const data = await loadBackground();
      const job = data && data.jobs.find((entry) => entry.id === id);
      if (job) {
        const [label] = JOB_STATES[job.state] || [job.state];
        chips.textContent = "";
        chips.append(el("span", "chip" + (job.state === "blocked" ? " warn" : job.state === "done" ? " ok" : ""), label), el("span", "chip", job.age));
        if (job.branch) chips.append(el("span", "chip", "branche " + job.branch));
        if (job.exec) chips.append(el("span", "chip", "commande shell"));
        if (job.attached) chips.append(el("span", "chip accent", "ouverte dans un terminal"));
        stop.hidden = !(job.state === "working" || job.state === "blocked");
        const key = job.waiting ? job.waiting + "|" + (job.question || "") : null;
        if (key !== lastQuestion) {
          lastQuestion = key;
          question.textContent = "";
          question.hidden = !key;
          if (key) {
            question.append(el("div", null, job.question || "La session attend une réponse."));
            const line = el("div", "line");
            if (job.waiting === "permission prompt") line.append(choice("Autoriser", "o", "primary"), choice("Toujours", "t"), choice("Refuser", "n", "danger"));
            else if (job.waiting === "message approval") line.append(choice("Délivrer le message", "o", "primary"), choice("L'écarter", "n", "danger"));
            if (line.children.length) question.append(line);
            field.focus();
          }
        }
      }
      try {
        const log = await api("/api/jobs/log?id=" + encodeURIComponent(id));
        const stick = output.scrollTop + output.clientHeight >= output.scrollHeight - 8;
        output.textContent = log.text.trim() || "(aucune sortie pour l'instant)";
        if (stick) output.scrollTop = output.scrollHeight;
      } catch (error) { output.textContent = error.message; }
    };
    update();
    const timer = setInterval(() => { if (!dialog.panel.isConnected) { clearInterval(timer); return; } update(); }, 2000);
    dialog.onClose = () => clearInterval(timer);
    field.focus();
  }

  // ---------------------------------------------------------------- palette (Ctrl+K)
  function openPalette() {
    closeMenu();
    if ($("palette-backdrop")) return;
    const backdrop = el("div");
    backdrop.id = "palette-backdrop";
    const panel = el("div", "menu");
    panel.id = "palette";
    const search = el("input", "search");
    search.placeholder = "Rechercher une action, un modèle, une commande…";
    const list = el("div", "list");
    panel.append(search, list);
    backdrop.append(panel);
    document.body.appendChild(backdrop);
    const close = () => { backdrop.remove(); input.focus(); };
    const actions = [
      ["Actions", "Nouvelle session", "Ctrl+Maj+O", () => newConversation()],
      ["Actions", "Sessions précédentes", "", () => openSessionsMenu()],
      ["Actions", "Crédits OpenRouter", "Solde, requêtes gratuites", () => openCreditsDialog()],
      ["Actions", "Rechercher les modèles gratuits les plus puissants", "Relit le catalogue OpenRouter", () => searchBestModels()],
      ["Actions", "Informations sur le modèle actuel", status.model || "", () => { if (status.model) openModelInfo(status.model); }],
      ["Actions", "Arrêter le tour en cours", "Échap", () => interruptTurn()],
      ["Actions", "Joindre une image", "", () => $("file-input").click()],
      ["Actions", "Changer de thème", "", () => cycleTheme()],
      ...MODES.map(([id, label, hint]) => ["Mode", "Mode : " + label, hint, () => setMode(id)]),
      ...freeModels.map((model) => ["Modèle", modelName(model.id), model.id + (model.measured ? " · " + model.measured : ""), () => setModel(model.id)]),
      ...COMMANDS.concat(customCommands).map(([command, label]) => ["Commande", command, label, () => { input.value = command + " "; onInput(); }]),
    ];
    let active = 0, shown = [];
    const fill = () => {
      const query = search.value.trim().toLowerCase();
      shown = actions.filter(([, label, hint]) => !query || (label + " " + hint).toLowerCase().includes(query)).slice(0, 60);
      list.textContent = "";
      let group = "";
      shown.forEach(([g, label, hint, run], index) => {
        if (g !== group) { group = g; list.append(el("div", "group", g)); }
        const item = el("button", "item" + (index === active ? " active" : ""));
        item.type = "button";
        const grow = el("span", "grow");
        grow.append(el("b", null, label));
        if (hint) grow.append(el("span", null, hint));
        item.append(grow);
        item.onmousedown = (event) => { event.preventDefault(); close(); run(); };
        list.append(item);
      });
      const current = list.querySelector(".item.active");
      if (current) current.scrollIntoView({ block: "nearest" });
    };
    search.oninput = () => { active = 0; fill(); };
    search.onkeydown = (event) => {
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        active = (active + (event.key === "ArrowDown" ? 1 : shown.length - 1)) % Math.max(shown.length, 1);
        fill();
      } else if (event.key === "Enter") {
        event.preventDefault();
        const pick = shown[active];
        close();
        if (pick) pick[3]();
      } else if (event.key === "Escape") { event.preventDefault(); close(); }
    };
    backdrop.onmousedown = (event) => { if (event.target === backdrop) close(); };
    fill();
    search.focus();
  }

  // ---------------------------------------------------------------- état de l'agent
  function updateTitle() {
    const project = basename(status.cwd);
    document.title = (pendingPermissions > 0 ? "▲ Réponse attendue · " : status.busy ? "● " : "") + "Claw Code" + (project ? " · " + project : "");
  }
  function setActivity(text) {
    currentActivity = text;
    $("activity-what").textContent = text;
  }
  function tickBusy() {
    if (!busySince) return;
    $("activity-time").textContent = Math.round((Date.now() - busySince) / 1000) + " s";
  }
  setInterval(tickBusy, 1000);
  function applyStatus(next) {
    const wasBusy = !!status.busy;
    const modelChanged = next.model !== status.model;
    status = next;
    $("project-path").textContent = (next.cwd || "").replace(/^\\\\\?\\/, "");
    $("project-path").title = $("project-path").textContent;
    const emptyProject = $("empty-project");
    if (emptyProject) emptyProject.textContent = basename(next.cwd) || "ce projet";
    if (modelChanged) renderModelButton();
    renderModeButton();
    renderUltracode();
    renderTeam();
    if (next.busy && !busySince) { busySince = Date.now(); setActivity("Claw réfléchit…"); }
    $("activity").hidden = !next.busy || !$("ask").hidden;
    sendBtn.classList.toggle("stop", !!next.busy);
    sendBtn.innerHTML = svg(next.busy ? "stop" : "arrowUp");
    sendBtn.title = next.busy ? "Arrêter (Échap) - un message tapé partira à la fin du tour" : "Envoyer (Entrée)";
    const tokens = (next.input_tokens || 0) + (next.output_tokens || 0);
    const context = next.context_tokens || 0;
    $("usage").textContent = tokens
      ? (context ? "contexte : " + context.toLocaleString("fr-FR") + " jetons" : tokens.toLocaleString("fr-FR") + " jetons") + (next.cost ? " · " + next.cost : "")
      : "";
    $("usage").title = tokens
      ? "Contexte : ce que le modèle relit à chaque requête (estimation). Depuis le début de la session : " + tokens.toLocaleString("fr-FR") + " jetons échangés, chaque requête renvoyant tout le contexte."
      : "";
    if (wasBusy && !next.busy) {
      const took = busySince ? Date.now() - busySince : 0;
      busySince = null;
      if (took > 1500 && logInner.querySelector(".md, .steps")) {
        const end = el("div", "turn-end");
        end.innerHTML = svg("check") + "Terminé en " + seconds(took);
        append(end);
      }
      loadCredits();
    }
    tickBusy();
    updateTitle();
  }

  // `fresh` : relit le catalogue chez OpenRouter au lieu du cache de 24 h ;
  // renvoie l'avertissement du serveur s'il n'a pas pu le relire.
  async function loadModels(fresh) {
    const known = new Set(freeModels.map((model) => model.id));
    let warning = "";
    try {
      const data = await api("/api/models" + (fresh ? "?fresh=1" : ""));
      freeModels = data.models || [];
      modelsCatalogAt = data.catalog_at || 0;
      favoriteModels = data.favorites || [];
      modelCategories = data.categories || [];
      modelReferences = data.references || [];
      if (!modelReferences.some((reference) => reference.id === likenessReference)) {
        likenessReference = modelReferences.length ? modelReferences[0].id : "";
      }
      warning = data.warning || "";
      // Modèles apparus depuis la liste précédente.
      newModelIds = new Set(fresh && known.size ? freeModels.filter((model) => !known.has(model.id)).map((model) => model.id) : []);
    } catch (error) {
      if (fresh) throw error;
      freeModels = [];
    }
    renderModelButton();
    return warning;
  }
  async function loadCustomCommands() {
    try {
      const data = await api("/api/commands");
      customCommands = (data.commands || []).map((command) => [
        command.name,
        [command.hint, command.description].filter(Boolean).join(" - ") + " (" + command.scope + ")",
      ]);
    } catch (_) { customCommands = []; }
  }

  // ---------------------------------------------------------------- envoi
  let pendingImages = [];
  async function sendMessage() {
    const text = input.value.trim();
    if (!text && !pendingImages.length) return;
    if (status.busy) toast("Ajouté à la file : partira à la fin du tour en cours.");
    hideSuggestions();
    try {
      const images = pendingImages.map(({ media_type, data }) => ({ media_type, data }));
      await api("/api/message", { text, images });
      rememberPrompt(text);
      historyAt = null;
      input.value = "";
      pendingImages = [];
      renderAttachments();
      autoGrow();
      scrollToBottom(true);
    } catch (error) {
      toast(error.message);
    }
  }
  async function interruptTurn() {
    if (!status.busy) return;
    try { await api("/api/interrupt", {}); setActivity("Interruption demandée…"); } catch (error) { toast(error.message); }
  }
  // Sans confirmation : la session en cours reste dans les sessions précédentes.
  async function newConversation() {
    if (status.busy) {
      toast("Un tour est en cours : arrêtez-le (Échap) ou attendez sa fin avant d'ouvrir une nouvelle session.");
      return;
    }
    try {
      await api("/api/new", {});
      if (logInner.querySelector(".user, .md")) toast("Nouvelle session. La précédente reste dans « Sessions ».");
    } catch (error) { toast(error.message); }
  }
  function cycleTheme() {
    themePref = { auto: "light", light: "dark", dark: "auto" }[themePref];
    store.set("claw-theme", themePref);
    applyTheme();
    toast("Thème : " + ({ auto: "automatique", light: "clair", dark: "sombre" })[themePref]);
  }

  // ---------------------------------------------------------------- images jointes
  const IMAGE_TYPES = ["image/png", "image/jpeg", "image/gif", "image/webp"];
  function renderAttachments() {
    const box = $("attachments");
    box.textContent = "";
    pendingImages.forEach((image, index) => {
      const thumb = el("div", "thumb");
      const preview = document.createElement("img");
      preview.src = image.url;
      preview.alt = "Image à envoyer";
      const remove = el("button", null, "×");
      remove.type = "button";
      remove.title = "Retirer cette image";
      remove.onclick = () => { pendingImages.splice(index, 1); renderAttachments(); };
      thumb.append(preview, remove);
      box.appendChild(thumb);
    });
  }
  function addImageFile(file) {
    if (!file || !IMAGE_TYPES.includes(file.type)) { toast("Format non pris en charge (png, jpg, gif, webp)."); return; }
    if (file.size > 5 * 1024 * 1024) { toast("Image trop lourde (5 Mo maximum)."); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const url = String(reader.result);
      pendingImages.push({ media_type: file.type, data: url.slice(url.indexOf(",") + 1), url });
      renderAttachments();
    };
    reader.readAsDataURL(file);
  }
  input.addEventListener("paste", (event) => {
    const files = [...(event.clipboardData?.items || [])]
      .filter((item) => item.kind === "file" && item.type.startsWith("image/"))
      .map((item) => item.getAsFile());
    if (files.length) { event.preventDefault(); files.forEach(addImageFile); }
  });
  const composer = $("composer");
  composer.addEventListener("dragover", (event) => {
    if ([...(event.dataTransfer?.types || [])].includes("Files")) { event.preventDefault(); composer.classList.add("dragging"); }
  });
  composer.addEventListener("dragleave", () => composer.classList.remove("dragging"));
  composer.addEventListener("drop", (event) => {
    composer.classList.remove("dragging");
    const files = [...(event.dataTransfer?.files || [])].filter((file) => file.type.startsWith("image/"));
    if (files.length) { event.preventDefault(); files.forEach(addImageFile); }
  });
  $("file-input").addEventListener("change", (event) => {
    [...event.target.files].forEach(addImageFile);
    event.target.value = "";
  });

  // ---------------------------------------------------------------- saisie et suggestions
  let suggestionIndex = -1;
  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + "px";
  }
  function hideSuggestions() { $("suggestions").hidden = true; suggestionIndex = -1; }
  function onInput() {
    autoGrow();
    const value = input.value;
    const box = $("suggestions");
    if (!value.startsWith("/") || value.includes("\n") || (value.includes(" ") && !value.startsWith("/models "))) { hideSuggestions(); return; }
    const query = value.toLowerCase();
    const matches = COMMANDS.concat(customCommands).filter(([command]) => command.toLowerCase().startsWith(query));
    if (!matches.length) { hideSuggestions(); return; }
    if (suggestionIndex >= matches.length) suggestionIndex = matches.length - 1;
    box.textContent = "";
    const menu = el("div", "menu");
    const list = el("div", "list");
    matches.forEach(([command, label], index) => {
      const item = el("button", "item" + (index === suggestionIndex ? " active" : ""));
      item.type = "button";
      const grow = el("span", "grow");
      grow.append(el("b", null, command), el("span", null, label));
      item.append(grow);
      item.onmousedown = (event) => { event.preventDefault(); completeCommand(command); };
      list.append(item);
    });
    menu.append(list);
    box.append(menu);
    box.hidden = false;
    const active = list.querySelector(".active");
    if (active) active.scrollIntoView({ block: "nearest" });
  }
  function completeCommand(command) {
    input.value = command + " ";
    hideSuggestions();
    input.focus();
    autoGrow();
  }
  // Une frappe fait du texte affiché le nouveau brouillon.
  input.addEventListener("input", () => { suggestionIndex = -1; historyAt = null; onInput(); });
  input.addEventListener("keydown", (event) => {
    const box = $("suggestions");
    if (!box.hidden) {
      const items = box.querySelectorAll(".item");
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        suggestionIndex = (suggestionIndex + (event.key === "ArrowDown" ? 1 : items.length - 1 + (suggestionIndex < 0 ? 1 : 0))) % items.length;
        onInput();
        return;
      }
      if (event.key === "Tab" || (event.key === "Enter" && suggestionIndex >= 0)) {
        event.preventDefault();
        completeCommand(items[Math.max(0, suggestionIndex)].querySelector("b").textContent);
        return;
      }
      if (event.key === "Escape") { event.preventDefault(); event.stopPropagation(); hideSuggestions(); return; }
    }
    if ((event.key === "ArrowUp" || event.key === "ArrowDown") && !event.shiftKey && !event.altKey && !event.ctrlKey && !event.metaKey && !event.isComposing) {
      if (recallPrompt(event.key === "ArrowUp" ? -1 : 1)) { event.preventDefault(); return; }
    }
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener("click", () => (status.busy && !input.value.trim() && !pendingImages.length ? interruptTurn() : sendMessage()));
  $("activity-stop").addEventListener("click", interruptTurn);
  $("attach-btn").addEventListener("click", () => $("file-input").click());
  $("slash-btn").addEventListener("click", () => {
    if (!input.value.startsWith("/")) input.value = "/";
    input.focus();
    onInput();
  });
  $("model-btn").addEventListener("click", openModelMenu);
  // Ultracode : avant le travail, un agent au contexte vierge étudie la
  // demande ; après, un vérificateur indépendant contrôle le résultat.
  function renderUltracode() {
    const button = $("ultracode-btn");
    const on = !!status.ultracode;
    button.setAttribute("aria-pressed", String(on));
    button.title = on
      ? "Ultracode activé : chaque demande conséquente est étudiée par un agent au contexte vierge, puis vérifiée par un vérificateur indépendant (plus de requêtes). Cliquer pour couper."
      : "Ultracode : faire étudier chaque demande par un agent au contexte vierge avant le travail, puis faire vérifier le résultat par un vérificateur indépendant (plus de requêtes, plus lent). Pour un seul message, écrivez « ultracode » dedans.";
  }
  // Mode équipe : chaque étape va au modèle gratuit le plus fort pour elle
  // (comprendre, écrire le code, déboguer, relire, images, sujets).
  function renderTeam() {
    const button = $("team-btn");
    const on = !!status.team;
    button.setAttribute("aria-pressed", String(on));
    button.title = on
      ? "Mode équipe activé : chaque étape (comprendre, écrire le code, déboguer, relire, images, sujets) va au modèle gratuit le plus fort pour elle. /equipe montre qui fait quoi. Cliquer pour couper."
      : "Mode équipe : confier chaque étape (comprendre, écrire le code, déboguer, relire, images, sujets) au modèle gratuit le plus fort pour elle, au lieu d'un seul modèle pour tout.";
  }
  $("team-btn").addEventListener("click", async () => {
    try {
      const answer = await api("/api/team", { on: !status.team });
      status.team = !!(answer && answer.team);
      renderTeam();
      toast(status.team ? "Mode équipe activé : /equipe montre qui fait quoi" : "Mode équipe désactivé");
    } catch (error) {
      toast("Mode équipe : " + error.message);
    }
  });
  $("ultracode-btn").addEventListener("click", async () => {
    try {
      const answer = await api("/api/ultracode", { on: !status.ultracode });
      status.ultracode = !!(answer && answer.ultracode);
      renderUltracode();
      toast(status.ultracode ? "Ultracode activé pour la session" : "Ultracode désactivé");
    } catch (error) {
      toast("Ultracode : " + error.message);
    }
  });
  $("mode-btn").addEventListener("click", openModeMenu);
  $("sessions-btn").addEventListener("click", openSessionsMenu);
  $("agents-btn").addEventListener("click", openAgentsMenu);
  $("credits").addEventListener("click", openCreditsDialog);
  $("theme-btn").addEventListener("click", cycleTheme);
  $("to-bottom").addEventListener("click", () => scrollToBottom(true));
  // Arrivé tout en bas, le fil se remet à suivre ; remonter le détache.
  log.addEventListener("scroll", () => {
    if (bottomGap() < 6) stuckToBottom = true;
    else if (log.scrollTop < lastScrollTop - 1) stuckToBottom = false;
    lastScrollTop = log.scrollTop;
    updateToBottom();
  }, { passive: true });
  // La molette, le doigt ou le clavier vers le haut détachent tout de suite,
  // même pendant que l'agent écrit.
  log.addEventListener("wheel", (event) => { if (event.deltaY < 0) { stuckToBottom = false; updateToBottom(); } }, { passive: true });
  log.addEventListener("touchmove", () => { if (bottomGap() > 6) { stuckToBottom = false; updateToBottom(); } }, { passive: true });
  log.addEventListener("keydown", (event) => {
    if (["PageUp", "ArrowUp", "Home"].includes(event.key)) { stuckToBottom = false; updateToBottom(); }
  });
  // Tant que le fil suit, il reste collé en bas quand son contenu grandit
  // après coup (une carte qui s'ouvre) ou que la fenêtre change de taille.
  if (window.ResizeObserver) {
    const keepBottom = new ResizeObserver(() => {
      if (stuckToBottom) { log.scrollTop = log.scrollHeight; lastScrollTop = log.scrollTop; }
    });
    keepBottom.observe(log);
    keepBottom.observe(logInner);
  }
  // Copie dans le presse-papiers. Dans le panneau de VS Code, l'API du navigateur
  // est refusée à la page (« Write permission denied ») : la commande de copie
  // classique, elle, y reste permise après un clic.
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (_) {
      return copyWithCommand(text);
    }
  }

  function copyWithCommand(text) {
    const area = document.createElement("textarea");
    area.value = text;
    area.readOnly = true;
    area.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;";
    // Le texte exact, quoi que le navigateur retienne de la sélection.
    const fill = (event) => {
      event.clipboardData.setData("text/plain", text);
      event.preventDefault();
    };
    const focused = document.activeElement;
    document.body.appendChild(area);
    area.select();
    document.addEventListener("copy", fill, true);
    let copied = false;
    try {
      copied = document.execCommand("copy");
    } catch (_) {
      copied = false;
    }
    document.removeEventListener("copy", fill, true);
    area.remove();
    if (focused && focused.focus) focused.focus({ preventScroll: true });
    return copied;
  }

  log.addEventListener("click", async (event) => {
    const button = event.target.closest("[data-copy]");
    if (!button) return;
    const code = button.closest(".codeblock").querySelector("pre code").textContent;
    if (await copyText(code)) button.innerHTML = svg("check") + "Copié";
    else button.textContent = "Copie impossible";
    setTimeout(() => { button.innerHTML = svg("copy") + "Copier"; }, 1600);
  });

  // Raccourcis : Ctrl+K palette, Échap (refuser une autorisation / interrompre /
  // fermer), Entrée et A pour répondre à une autorisation.
  document.addEventListener("keydown", (event) => {
    const typing = event.target === input || event.target.tagName === "TEXTAREA" || event.target.tagName === "INPUT";
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") { event.preventDefault(); openPalette(); return; }
    if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === "o") { event.preventDefault(); newConversation(); return; }
    if (event.key === "Escape") {
      if (openMenu) { closeMenu(); return; }
      if (activePermission) { event.preventDefault(); activePermission.send("deny"); return; }
      if (status.busy) { interruptTurn(); return; }
    }
    if (activePermission && (!typing || (event.target === input && !input.value))) {
      if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); activePermission.send("once"); return; }
      if (event.key.toLowerCase() === "a" && activePermission.hasAlways && !typing) { event.preventDefault(); activePermission.send("always"); return; }
    }
    if (!typing && !event.ctrlKey && !event.metaKey && !event.altKey && event.key.length === 1) input.focus();
  });

  // ---------------------------------------------------------------- flux SSE
  function setConnection(state, text) {
    $("conn").className = "conn " + state;
    $("conn-text").textContent = text;
  }
  function connect() {
    const source = new EventSource("/api/events?token=" + encodeURIComponent(token));
    source.addEventListener("snapshot", (message) => {
      const data = JSON.parse(message.data);
      status = {};
      resetLog();
      applyStatus(data.status);
      replaying = true;
      try {
        for (const event of data.transcript) render(event);
        finishAssistant();
        // Tour déjà fini : plus aucun appel ne tourne.
        if (!data.status.busy) closePendingTools();
      } finally {
        replaying = false;
      }
      scrollToBottom(true);
      setConnection("", "Connecté");
    });
    source.addEventListener("event", (message) => render(JSON.parse(message.data)));
    source.addEventListener("resync", () => { source.close(); connect(); });
    source.onerror = () => {
      // Fermée définitivement (ex. 401) : le jeton change à chaque lancement de `claw serve`.
      if (source.readyState === EventSource.CLOSED) setConnection("off", "Déconnecté : rouvrez l'adresse affichée par « claw serve »");
      else setConnection("wait", "Reconnexion…");
    };
  }

  // ---------------------------------------------------------------- démarrage
  if (embedded) root.dataset.embed = "1";
  applyTheme();
  renderSessionsButton();
  renderAgentsButton();
  loadBackground();
  // La pastille du bouton Agents suit les sessions qui attendent une réponse.
  setInterval(() => { if (document.visibilityState === "visible") loadBackground(); }, 10000);
  $("attach-btn").innerHTML = svg("clip");
  $("slash-btn").innerHTML = svg("slash");
  $("to-bottom").innerHTML = svg("arrowDown") + "Derniers messages";
  sendBtn.innerHTML = svg("arrowUp");
  renderModelButton();
  renderModeButton();
  resetLog();
  if (!token) {
    addError("jeton d'accès manquant", "ouvrez l'adresse complète affichée par « claw serve » (elle contient ?token=…)");
    sendBtn.disabled = true;
    setConnection("off", "Sans jeton");
  } else {
    connect();
    loadModels();
    loadCredits();
    loadCustomCommands();
    input.addEventListener("focus", loadCustomCommands);
    input.focus();
  }
})();
</script>
</body>
</html>
