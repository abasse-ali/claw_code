<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claw Code</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f0601a'/%3E%3Cg transform='translate(4 4)' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M6 19c.3-5 2.3-9.6 6-13'/%3E%3Cpath d='M10.6 20c.3-5 2.3-9.6 6-13'/%3E%3Cpath d='M15.2 20.5c.3-4 1.8-7.6 4.3-10.3'/%3E%3C/g%3E%3C/svg%3E">
<style>
  /* ------------------------------------------------------------------ thèmes */
  :root {
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --mono: "Cascadia Code", "JetBrains Mono", ui-monospace, Consolas, monospace;
    --r-sm: 8px; --r: 12px; --r-lg: 18px;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e0f11; --surface: #16171a; --surface-2: #1d1e22; --surface-3: #25262b;
    --border: #2a2b30; --border-strong: #3a3b42;
    --text: #ececee; --text-2: #a3a3ad; --text-3: #6f707a;
    --accent: #ff7a3d; --accent-2: #ff9a66; --accent-soft: rgba(255, 122, 61, .13); --on-accent: #1a0d05;
    --ok: #3ccf7a; --ok-soft: rgba(60, 207, 122, .12);
    --err: #ff5d5d; --err-soft: rgba(255, 93, 93, .12);
    --warn: #f5b13d; --warn-soft: rgba(245, 177, 61, .12);
    --info: #6ea8ff; --info-soft: rgba(110, 168, 255, .12);
    --code-bg: #121316; --add-bg: rgba(60, 207, 122, .14); --del-bg: rgba(255, 93, 93, .14);
    --add-strong: rgba(60, 207, 122, .36); --del-strong: rgba(255, 93, 93, .38);
    --shadow: 0 10px 40px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .3);
    --tk-kw: #ff9a66; --tk-str: #9ad37f; --tk-num: #f5c46b; --tk-com: #6f707a; --tk-fn: #8cb4ff;
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f6f6f4; --surface: #ffffff; --surface-2: #f1f1ef; --surface-3: #e8e8e5;
    --border: #e3e3df; --border-strong: #cfcfca;
    --text: #18181b; --text-2: #55555e; --text-3: #8d8d96;
    --accent: #e8590c; --accent-2: #f07b3a; --accent-soft: rgba(232, 89, 12, .09); --on-accent: #ffffff;
    --ok: #16a34a; --ok-soft: rgba(22, 163, 74, .10);
    --err: #dc2626; --err-soft: rgba(220, 38, 38, .08);
    --warn: #b45309; --warn-soft: rgba(217, 119, 6, .10);
    --info: #2563eb; --info-soft: rgba(37, 99, 235, .08);
    --code-bg: #f6f6f3; --add-bg: rgba(22, 163, 74, .11); --del-bg: rgba(220, 38, 38, .09);
    --add-strong: rgba(22, 163, 74, .28); --del-strong: rgba(220, 38, 38, .24);
    --shadow: 0 12px 40px rgba(20, 20, 30, .14), 0 2px 6px rgba(20, 20, 30, .06);
    --tk-kw: #c2410c; --tk-str: #15803d; --tk-num: #a16207; --tk-com: #8d8d96; --tk-fn: #1d4ed8;
  }

  /* ------------------------------------------------------------------ base */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14.5px/1.6 var(--font); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
    /* L'habillage (barres, boutons, menus) ne se sélectionne pas à la souris ;
       seuls les contenus utiles à copier restent sélectionnables. */
    -webkit-user-select: none; user-select: none;
  }
  .user, .md, .step-body, .card pre, .card .hint, .ask pre, .ask .question, .dialog .big, .dialog .rows, .dialog .link, .dialog .name, .dialog .ident, .dialog .desc, input, textarea {
    -webkit-user-select: text; user-select: text;
  }
  button, .codehead, .copy { -webkit-user-select: none; user-select: none; }
  img, svg { -webkit-user-drag: none; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled { cursor: not-allowed; opacity: .45; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  code, pre, kbd { font-family: var(--mono); }
  kbd { font-size: 11px; padding: 1px 5px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 5px; color: var(--text-2); background: var(--surface-2); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--border-strong); }

  .btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface); font-size: 13.5px; font-weight: 500; transition: background .15s, border-color .15s; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-strong); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
  .btn.danger { color: var(--err); }
  .btn.danger:hover:not(:disabled) { background: var(--err-soft); border-color: var(--err); }
  .icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: var(--r-sm); color: var(--text-2); transition: background .15s, color .15s; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }

  /* ------------------------------------------------------------------ barre du haut */
  header.top {
    flex: none; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px;
    border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); position: relative; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 16px; flex: none;
    background: linear-gradient(135deg, #ff8a4c, #e8490c); box-shadow: 0 2px 10px rgba(255, 106, 40, .35); }
  .logo svg { width: 62%; height: 62%; }
  .project { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .project b { font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .project span { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 500; white-space: nowrap; max-width: 260px; transition: background .15s, border-color .15s; }
  .pill:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .pill .label { overflow: hidden; text-overflow: ellipsis; }
  .pill .sub { color: var(--text-3); font-weight: 400; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
  .tag { font-size: 10.5px; font-weight: 600; letter-spacing: .02em; padding: 1px 6px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); }
  #credits { cursor: pointer; }
  #credits b { font-weight: 650; font-variant-numeric: tabular-nums; }
  #credits .sep { width: 1px; height: 14px; background: var(--border-strong); }
  #credits.low b { color: var(--err); }
  #credits.warn { border-color: var(--warn); }
  #credits.warn .free b { color: var(--warn); }
  #credits.flash { animation: flash .7s var(--ease); }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 var(--accent-soft); border-color: var(--accent); } 100% { box-shadow: 0 0 0 8px transparent; } }

  /* menus déroulants */
  .menu { position: absolute; top: 48px; z-index: 30; min-width: 280px; max-width: min(460px, calc(100vw - 24px)); max-height: min(70vh, 560px);
    display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r); box-shadow: var(--shadow);
    padding: 6px; animation: pop .14s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
  .menu input.search { height: 34px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); padding: 0 10px; margin: 2px 2px 6px; outline: none; }
  .menu input.search:focus { border-color: var(--accent); }
  .menu .list { overflow-y: auto; }
  .menu .group { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); padding: 8px 10px 4px; }
  .item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); text-align: left; }
  .item:hover, .item.active { background: var(--surface-2); }
  .item .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .item .grow b { font-weight: 550; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .grow span { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .check { color: var(--accent); }
  .item .measured { font-size: 11.5px; color: var(--ok); white-space: nowrap; flex: none; }
  .item .measured.bad { color: var(--text-3); }
  .item .grow span.mono { font-family: var(--mono); font-size: 11.5px; }
  .item .lead { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
  .menu .custom { display: flex; gap: 6px; padding: 6px 2px 2px; border-top: 1px solid var(--border); margin-top: 6px; }
  .menu .custom input { flex: 1; height: 32px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); padding: 0 10px; outline: none; font-family: var(--mono); font-size: 12.5px; }
  /* rangée de menu avec un petit bouton à droite (informations, effacer) */
  .menu .row { display: flex; align-items: center; gap: 2px; }
  .menu .row > .item { flex: 1; min-width: 0; }
  .mini { flex: none; width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 7px; color: var(--text-3); transition: background .15s, color .15s; }
  .mini:hover { background: var(--surface-3); color: var(--text); }
  .mini.danger:hover { background: var(--err-soft); color: var(--err); }
  .mini.on { color: var(--warn); }
  .mini.on svg.i { fill: currentColor; }
  .menu .rename { display: flex; align-items: center; gap: 6px; padding: 5px 6px; }
  .menu .rename input { flex: 1; min-width: 0; height: 30px; border-radius: var(--r-sm); border: 1px solid var(--accent); background: var(--surface-2); padding: 0 9px; outline: none; font-size: 13px; }
  .menu .rename .btn { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .menu .confirm { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px; border-radius: var(--r-sm); background: var(--err-soft); font-size: 13px; }
  .menu .confirm > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .confirm .btn { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .menu .wide { width: calc(100% - 4px); margin: 0 2px 6px; justify-content: center; flex: none; }
  .menu .wide > svg.i { color: var(--accent); }
  .menu .foot { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; }
  .menu .foot .wide { margin-bottom: 0; }
  .menu .hint-line { font-size: 11.5px; color: var(--text-3); padding: 0 10px 4px; }
  .menu .hint-line.warn { color: var(--warn); }
  /* panneau Agents : sessions en arrière-plan, tâches planifiées, Monitors */
  .pill .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 650; background: var(--accent-soft); color: var(--accent); }
  .pill .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .menu.agents { width: min(460px, calc(100vw - 24px)); }
  .menu .item.static { cursor: default; }
  .menu .item.static:hover { background: none; }
  .dialog.job { width: min(640px, 100%); }
  .dialog .job-log { margin-top: 12px; max-height: 46vh; overflow: auto; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); font-family: var(--mono); font-size: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .dialog .job-question { margin-top: 12px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--warn-soft); font-size: 13px; line-height: 1.45; white-space: pre-wrap; }
  .dialog .job-question .line { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .dialog .job-reply { display: flex; gap: 8px; margin-top: 12px; }
  .dialog .job-reply input { flex: 1; min-width: 0; height: 32px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); padding: 0 10px; outline: none; font-size: 13px; }
  .dialog .job-reply input:focus { border-color: var(--accent); }
  /* catégories de modèles : une pastille par spécialité */
  .menu .cats { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 2px 7px; flex: none; }
  .cat { display: inline-flex; align-items: center; gap: 5px; height: 23px; padding: 0 9px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); font-size: 11.5px; font-weight: 550; color: var(--text-2); white-space: nowrap; transition: border-color .15s, color .15s, background .15s; }
  .cat:hover { border-color: var(--border-strong); color: var(--text); }
  .cat.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .cat.nofree { opacity: .62; }
  .cat.more { border-style: dashed; }
  .cat i { font-style: normal; font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .cat.on i { color: inherit; }
  .item .grow span.spec { font-size: 11px; margin-top: 1px; }
  .item .likeness { font-size: 11.5px; font-weight: 650; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .menu .refs { display: flex; gap: 4px; padding: 0 10px 6px; flex-wrap: wrap; }
  .menu .refs .cat { height: 22px; }
  .dialog .like-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 10px 0 6px; font-size: 13.5px; font-weight: 600; }
  .dialog .like-head b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .dialog .meter { height: 5px; border-radius: 5px; background: var(--surface-3); overflow: hidden; margin-bottom: 6px; }
  .dialog .meter i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
  .menu .confirm.pay { background: var(--warn-soft); }
  .menu .confirm.pay > span { white-space: normal; }
  .item .fresh { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); flex: none; }
  .item .aside { display: inline-flex; align-items: center; gap: 8px; flex: none; }

  /* ------------------------------------------------------------------ conversation */
  main#log { flex: 1; overflow-y: auto; scroll-behavior: auto; position: relative; }
  .col { max-width: 800px; margin: 0 auto; padding: 26px 22px 30px; display: flex; flex-direction: column; gap: 14px; }
  .col > * { content-visibility: auto; contain-intrinsic-size: auto 60px; }

  .empty { text-align: center; padding: 9vh 0 2vh; content-visibility: visible; }
  .empty .logo { width: 52px; height: 52px; font-size: 28px; border-radius: 15px; margin: 0 auto 18px; }
  .empty h1 { font-size: 24px; font-weight: 650; letter-spacing: -.01em; margin: 0 0 6px; }
  .empty h1 em { font-style: normal; color: var(--accent); }
  .empty p { color: var(--text-2); margin: 0 auto; max-width: 480px; }
  .starters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 28px auto 0; max-width: 560px; text-align: left; }
  .starter { text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--r); border: 1px solid var(--border); background: var(--surface); transition: border-color .15s, transform .15s var(--ease), background .15s; }
  .starter:hover { border-color: var(--accent); background: var(--surface-2); transform: translateY(-1px); }
  .starter .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
  .starter b { display: block; font-size: 13.5px; font-weight: 600; }
  .starter span { font-size: 12.5px; color: var(--text-2); }
  .shortcuts { margin-top: 22px; font-size: 12px; color: var(--text-3); display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  .user { align-self: flex-end; max-width: 82%; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-lg) var(--r-lg) 6px var(--r-lg);
    padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; position: relative; }
  /* heure d'envoi, au-dessus de la bulle */
  .user[data-time] { margin-top: 12px; }
  .user[data-time]::before { content: attr(data-time); position: absolute; right: 4px; top: -19px; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .user.collapsed { max-height: 9.5em; overflow: hidden; cursor: pointer; mask-image: linear-gradient(#000 60%, transparent); }
  .user-image { align-self: flex-end; max-width: min(340px, 75%); border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); }
  .user-image img { display: block; width: 100%; }

  .md { overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { margin: 8px 0; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 20px 0 8px; font-weight: 650; letter-spacing: -.005em; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 17.5px; } .md h3 { font-size: 15.5px; } .md h4 { font-size: 14.5px; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; } .md li { margin: 3px 0; } .md li::marker { color: var(--text-3); }
  .md strong { font-weight: 650; }
  .md a { color: var(--accent); text-decoration: none; } .md a:hover { text-decoration: underline; }
  .md :not(pre) > code { font-size: 12.8px; background: var(--surface-2); border: 1px solid var(--border); padding: 1px 5px; border-radius: 5px; }
  .md blockquote { margin: 10px 0; padding: 2px 14px; border-left: 3px solid var(--accent); color: var(--text-2); }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
  .md .tablewrap { margin: 10px 0; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-sm); }
  .md table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; overflow-wrap: normal; }
  .md th, .md td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  .md th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
  .md td code { white-space: nowrap; }
  .md .filelink { border-bottom: 1px dotted var(--text-3); cursor: help; }
  .md tr:last-child td { border-bottom: 0; }

  .codeblock { margin: 10px 0; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; background: var(--code-bg); }
  .codehead { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--border); font-size: 11.5px; color: var(--text-3); font-family: var(--mono); }
  .copy { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px; font-family: var(--font); font-size: 12px; color: var(--text-2); }
  .copy:hover { background: var(--surface-3); color: var(--text); }
  .codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; font-size: 12.8px; line-height: 1.55; tab-size: 4; }
  .tk-kw { color: var(--tk-kw); } .tk-str { color: var(--tk-str); } .tk-num { color: var(--tk-num); } .tk-com { color: var(--tk-com); font-style: italic; } .tk-fn { color: var(--tk-fn); }
  .mermaid-block .diagram { padding: 14px; overflow-x: auto; background: var(--surface); }
  .mermaid-block .actions { display: flex; gap: 8px; align-items: center; padding: 8px 12px; font-size: 12.5px; color: var(--text-3); border-top: 1px solid var(--border); }

  /* frise du tour, à la manière de Claude Code : une ligne verticale, un point
     par texte, par étape et par avis ; elle s'interrompt à chaque message */
  .col > .md, .col > .steps, .col > .tl-note { position: relative; padding-left: 26px; }
  .col > .md::before, .col > .steps::before, .col > .tl-note::before {
    content: ""; position: absolute; left: 8px; top: -7px; bottom: -7px; width: 1px; background: var(--border); }
  .col > .md::after { content: ""; position: absolute; left: 4px; top: .6em; width: 9px; height: 9px; border-radius: 50%; background: var(--text-3); }
  .tl-note { font-size: 12.5px; color: var(--text-2); line-height: 1.5; }
  /* Réponse donnée avant un contrôle de Claw : repliée, celle qui suit la remplace. */
  .md.provisional > :not(.provisional-head) { display: none; }
  .md.provisional.open > :not(.provisional-head) { display: revert; opacity: .75; }
  .md.provisional.open > .provisional-head { margin-bottom: 8px; }
  .provisional-head { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; font: inherit; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
  .provisional-head:hover { color: var(--text); }
  .provisional-head::after { content: " · afficher"; color: var(--text-3); }
  .md.provisional.open > .provisional-head::after { content: " · masquer"; }
  .col > .tl-note::after { content: ""; position: absolute; left: 5px; top: .45em; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--text-3); background: var(--bg); box-sizing: border-box; }

  /* étapes de l'agent (outils) */
  .steps { display: flex; flex-direction: column; }
  .step { position: relative; }
  .step-row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 5px 8px 5px 2px; border-radius: var(--r-sm); text-align: left; min-height: 34px; }
  .step-row:hover { background: var(--surface); }
  /* le point de l'étape, sur la ligne de la frise : vert réussi, rouge en
     erreur, orange qui pulse pendant l'exécution, gris pour la réflexion */
  .step-ic { position: absolute; left: -22px; top: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--text-3); z-index: 1; }
  .step-ic svg { display: none; }
  .step.ok .step-ic { background: var(--ok); }
  .step.error .step-ic { background: var(--err); }
  .step.running .step-ic { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--accent-soft); } }
  .step-verb { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .step-target { font-family: var(--mono); font-size: 12.3px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .step-meta { font-size: 12px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .step-meta .add { color: var(--ok); } .step-meta .del { color: var(--err); }
  .step-row .chev { color: var(--text-3); transition: transform .15s; }
  .step.open .chev { transform: rotate(90deg); }
  .step-body { margin: 2px 0 8px 2px; display: flex; flex-direction: column; gap: 8px; animation: pop .14s var(--ease); }
  /* commande : ENTRÉE (la commande) et SORTIE (son résultat), ouvertes d'office */
  .step.cmd .step-target { font-family: var(--font); font-size: 13px; }
  .io { border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--code-bg); overflow: hidden; }
  .io-row { display: grid; grid-template-columns: 70px minmax(0, 1fr); }
  .io-row + .io-row { border-top: 1px solid var(--border); }
  .io-k { padding: 9px 0 0 12px; font-size: 10.5px; font-weight: 650; letter-spacing: .07em; color: var(--text-3); }
  .step-body .io pre.io-v { margin: 0; padding: 8px 12px 8px 0; border: 0; border-radius: 0; background: none; max-height: none; font-size: 12.3px; }
  .step-body .io pre.io-v.clipped { max-height: 9.4em; overflow: hidden; mask-image: linear-gradient(#000 65%, transparent); }
  .step-body .io pre.io-v.err { color: var(--err); }
  .io-v .spin { margin: 2px 0; }
  .io-more { margin: 0 0 8px; font-size: 12px; color: var(--accent); justify-self: start; }
  /* Modification : deux colonnes, AVANT et APRÈS, sur les seules lignes changées ;
     la partie changée d'une ligne est surlignée. En panneau étroit, l'après passe sous l'avant. */
  .sbs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--code-bg); overflow: hidden; font-family: var(--mono); font-size: 12.3px; line-height: 1.55; }
  .sbs-h { padding: 6px 10px 5px; font-family: var(--font); font-size: 10.5px; font-weight: 650; letter-spacing: .07em; color: var(--text-3); border-bottom: 1px solid var(--border); }
  .sbs-h.n, .sbs-c.n { border-left: 1px solid var(--border); }
  .sbs-c { display: grid; grid-template-columns: auto minmax(0, 1fr); min-width: 0; }
  .sbs-c.o { background: var(--del-bg); }
  .sbs-c.n { background: var(--add-bg); }
  .sbs-c.blank { background: none; }
  .sbs-c .no { padding: 0 8px 0 10px; min-width: 4ch; text-align: right; color: var(--text-3); user-select: none; font-variant-numeric: tabular-nums; }
  .sbs.nonum .sbs-c .no { min-width: 0; padding: 0 0 0 10px; visibility: hidden; }
  .sbs-c .tx { padding-right: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .sbs-c mark { color: inherit; border-radius: 2px; }
  .sbs-c.o mark { background: var(--del-strong); }
  .sbs-c.n mark { background: var(--add-strong); }
  .sbs-gap { grid-column: 1 / -1; padding: 0 10px; color: var(--text-3); font-family: var(--font); font-size: 11px; text-align: center; border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border); }
  .sbs-gap.none { border: 0; padding: 6px 10px; text-align: left; }
  .sbs.clipped { max-height: 17em; overflow: hidden; mask-image: linear-gradient(#000 72%, transparent); }
  /* Contenu d'un fichier écrit : une seule colonne, numérotée. */
  .sbs.full { grid-template-columns: auto minmax(0, 1fr); }
  .sbs.full .sbs-h { grid-column: 1 / -1; }
  .sbs.full pre { margin: 0; padding: 6px 10px 8px 0; border: 0; border-radius: 0; background: none; max-height: none; overflow: visible; white-space: pre; font-size: 12.3px; line-height: 1.55; }
  .sbs.full pre.nums { padding-left: 10px; text-align: right; color: var(--text-3); user-select: none; }
  .sbs.full .code { overflow-x: auto; }
  .diff-holder { display: flex; flex-direction: column; gap: 4px; }
  .diff-holder > .io-more { margin: 0; }
  @media (max-width: 560px) {
    .sbs:not(.full) { grid-template-columns: minmax(0, 1fr); }
    .sbs:not(.full) .sbs-h { display: none; }
    .sbs-c.blank { display: none; }
    .sbs-c.n { border-left: 0; }
  }
  .io-more:hover { text-decoration: underline; }
  .step-body .label { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
  .step-body pre { margin: 0; padding: 10px 12px; background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 12.3px; line-height: 1.5; overflow: auto; max-height: 380px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .step-body pre.stderr { color: var(--err); }
  .step-body .note { font-size: 12.5px; color: var(--text-2); }
  .step-body .claw-note { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); white-space: pre-wrap; }
  .todos { display: flex; flex-direction: column; gap: 4px; }
  .todo { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
  .todo .box { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--border-strong); flex: none; margin-top: 3px; display: grid; place-items: center; }
  .todo.done .box { background: var(--ok); border-color: var(--ok); color: #fff; } .todo.done span { color: var(--text-3); text-decoration: line-through; }
  .todo.doing .box { border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 8px var(--accent); }

  .thinking { align-self: stretch; }
  .thinking .step-row .step-verb { color: var(--text-2); font-weight: 550; }
  .thinking pre { white-space: pre-wrap; font-family: var(--font); font-style: italic; color: var(--text-2); }
  .shimmer { background: linear-gradient(90deg, var(--text-3) 20%, var(--text) 40%, var(--text-3) 60%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: shimmer 1.6s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .card { border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); padding: 12px 14px; }
  .card-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; margin-bottom: 8px; }
  .card pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; line-height: 1.55; color: var(--text); }
  .card.info .card-title { color: var(--text-2); }
  .card.error { border-color: color-mix(in srgb, var(--err) 50%, var(--border)); background: var(--err-soft); }
  .card.error .card-title { color: var(--err); margin-bottom: 4px; }
  .card.error .hint { font-size: 13px; color: var(--text-2); margin-top: 4px; }

  .turn-end { align-self: flex-start; font-size: 12px; color: var(--text-3); display: inline-flex; gap: 6px; align-items: center; margin-top: -4px; }

  #to-bottom { position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%); z-index: 4; height: 32px; padding: 0 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }

  /* ------------------------------------------------------------------ zone de saisie */
  footer.dock { flex: none; padding: 0 22px 12px; position: relative; }
  .dock-inner { max-width: 800px; margin: 0 auto; position: relative; }
  .activity { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 12px; margin-bottom: 8px; border-radius: var(--r); border: 1px solid var(--border); background: var(--surface); font-size: 13px; animation: pop .16s var(--ease); }
  .activity .what { color: var(--text-2); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Question en attente (autorisation, modèle) : épinglée au-dessus de la saisie, toujours visible. */
  .ask { display: flex; flex-direction: column; gap: 9px; padding: 11px 12px; margin-bottom: 8px; border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--border)); background: var(--warn-soft); font-size: 13px; animation: pop .16s var(--ease); max-height: 60vh; overflow: auto; }
  .ask .what { font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .ask .detail { color: var(--text-2); line-height: 1.45; }
  .ask .detail.mono { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ask .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ask .actions .btn { min-height: 34px; }
  .ask .actions kbd { margin-left: 2px; }
  .ask .choices { display: flex; flex-direction: column; gap: 6px; }
  .ask .choice { display: flex; align-items: baseline; gap: 8px; width: 100%; height: auto; min-height: 36px; padding: 7px 10px; text-align: left; justify-content: flex-start; flex-wrap: wrap; }
  .ask .choice small { color: var(--text-3); font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
  .ask .choice .measured { font-size: 11.5px; color: var(--ok); margin-left: auto; }
  .ask .other { display: flex; gap: 8px; }
  .ask .more { font-size: 11.5px; color: var(--text-3); }
  .ask .question { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .ask .hint { font-size: 12px; color: var(--text-3); margin-top: -4px; }
  .ask .choice.on { border-color: var(--accent); background: var(--accent-soft); }
  .ask .choice .desc { font-family: inherit; font-size: 12px; color: var(--text-2); flex-basis: 100%; }
  .ask pre.target { margin: 0; padding: 9px 11px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--border); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 32vh; overflow: auto; }
  .ask textarea { width: 100%; min-height: 56px; resize: vertical; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 8px 10px; outline: none; font: inherit; }
  .ask textarea:focus, .ask .other input:focus { border-color: var(--accent); }
  .ask .other input { flex: 1; min-width: 0; height: 34px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); padding: 0 10px; outline: none; font-family: var(--mono); font-size: 12.5px; }
  .activity .time { color: var(--text-3); font-variant-numeric: tabular-nums; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .7s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .composer { border: 1px solid var(--border-strong); border-radius: var(--r-lg); background: var(--surface); box-shadow: 0 4px 24px rgba(0, 0, 0, .12); transition: border-color .15s, box-shadow .15s; }
  .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, var(--border-strong)); box-shadow: 0 0 0 4px var(--accent-soft); }
  .composer.dragging { border-style: dashed; border-color: var(--accent); }
  #attachments { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 12px 0; }
  #attachments:empty { display: none; }
  .thumb { position: relative; width: 58px; height: 58px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb button { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0, 0, 0, .6); color: #fff; display: grid; place-items: center; font-size: 12px; }
  #input { display: block; width: 100%; resize: none; border: 0; outline: none; background: transparent; padding: 12px 14px 4px; min-height: 48px; max-height: 40vh; line-height: 1.55; }
  #input::placeholder { color: var(--text-3); }
  .tools { display: flex; align-items: center; gap: 4px; padding: 4px 8px 8px; }
  /* sélecteur de modèle : nom, et dessous l'identifiant réel du modèle */
  .model-pick { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 9px; margin-left: 2px; border-radius: 10px; border: 1px solid transparent;
    max-width: min(360px, 56vw); min-width: 0; text-align: left; color: var(--text); transition: background .15s, border-color .15s; }
  .model-pick:hover { background: var(--surface-2); border-color: var(--border); }
  .model-pick > svg.i { color: var(--text-3); }
  .model-pick .names { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
  .model-pick .names b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .model-pick .names > span { font-family: var(--mono); font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Interrupteur ultracode : allumé, il prend la couleur d'accent. */
  .uc-pill { height: 28px; padding: 0 10px; margin-left: 4px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text-3); white-space: nowrap; transition: color .15s, border-color .15s, background .15s; }
  .uc-pill:hover { color: var(--text); border-color: var(--border-strong); }
  .uc-pill[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .tools .hint { font-size: 11.5px; color: var(--text-3); margin-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .send { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); transition: background .15s, transform .1s; }
  .send:hover:not(:disabled) { background: var(--accent-2); }
  .send:active:not(:disabled) { transform: scale(.94); }

  .send svg.i { width: 17px; height: 17px; stroke-width: 2.2; }
  .footline { display: flex; gap: 14px; justify-content: center; margin-top: 7px; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .footline .conn { display: inline-flex; align-items: center; gap: 5px; }
  .footline .conn .dot { width: 6px; height: 6px; background: var(--ok); }
  .footline .conn.wait .dot { background: var(--warn); } .footline .conn.off .dot { background: var(--err); }
  .footline .conn.off { color: var(--err); }

  #suggestions { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); z-index: 20; }
  #suggestions .menu { position: static; max-height: 280px; max-width: none; }

  /* palette de commandes */
  #palette-backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .35); display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; animation: fade .12s; }
  @keyframes fade { from { opacity: 0; } }
  #palette { width: min(600px, calc(100vw - 24px)); position: static; max-height: 60vh; }
  #palette input.search { height: 42px; font-size: 15px; }

  /* fenêtre de détail (crédits) */
  #dialog-backdrop { position: fixed; inset: 0; z-index: 45; background: rgba(0, 0, 0, .45); display: grid; place-items: center; padding: 16px; animation: fade .12s; }
  .dialog { width: min(440px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px 18px 16px; animation: pop .16s var(--ease); }
  .dialog-head { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; margin-bottom: 14px; }
  .dialog-head > svg.i { color: var(--accent); }
  .dialog .big { font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .dialog .big small { font-size: 13px; font-weight: 500; color: var(--text-2); margin-left: 7px; letter-spacing: 0; }
  .dialog .big.low { color: var(--err); }
  .dialog .rows { display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; margin: 16px 0 4px; font-size: 13.5px; }
  .dialog .rows dt { color: var(--text-2); }
  .dialog .rows dd { margin: 0; text-align: right; font-weight: 550; font-variant-numeric: tabular-nums; }
  .dialog .quota { margin-top: 12px; padding: 12px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface-2); }
  .dialog .quota .line { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; }
  .dialog .quota b { font-variant-numeric: tabular-nums; }
  .dialog .bar { height: 6px; border-radius: 6px; background: var(--surface-3); overflow: hidden; margin: 8px 0 7px; }
  .dialog .bar i { display: block; height: 100%; background: var(--ok); border-radius: 6px; }
  .dialog .bar.low i { background: var(--warn); }
  .dialog .note { font-size: 12.5px; color: var(--text-2); }
  .dialog .link { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); overflow-wrap: anywhere; }
  .dialog .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; margin-top: 16px; }
  .dialog .actions .note { margin-right: auto; }
  .dialog a.btn { text-decoration: none; }
  .dialog a.btn:not(.primary) { color: var(--text); }
  .dialog .name { font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
  .dialog .ident { font-family: var(--mono); font-size: 12px; color: var(--text-3); margin-top: 3px; overflow-wrap: anywhere; }
  .dialog .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
  .chip.ok { color: var(--ok); }
  .chip.warn { color: var(--warn); }
  .chip.accent { color: var(--accent); border-color: var(--accent); }
  .dialog .desc { margin-top: 12px; font-size: 13px; line-height: 1.5; color: var(--text-2); max-height: 126px; overflow: auto; }
  .dialog .rows dd small { display: block; font-weight: 400; font-size: 12px; color: var(--text-3); }
  .dialog .source { margin-top: 10px; }
  .dialog .pace { margin-top: 5px; }
  .dialog .pace.warn { color: var(--warn); }
  .dialog .usage { margin-top: 14px; }
  .dialog .usage-title { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin-bottom: 7px; }
  .dialog .usage-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(40px, 1fr) auto; align-items: center; gap: 10px; font-size: 13px; padding: 2px 0; }
  .dialog .usage-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dialog .usage-bar { height: 6px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
  .dialog .usage-bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
  .dialog .usage-row b { font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; }
  .dialog .usage .note { margin-top: 7px; }
  .dialog .measure { margin-top: 14px; padding: 11px 12px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface-2); }
  .dialog .measure .line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .dialog .measure .btn { height: 30px; font-size: 13px; }
  .dialog-head .mini { margin-right: 2px; }
  .dialog-head > span:not(.spacer) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    const prompt = String(text || "").trim();

  function recallPrompt(direction) {
    const value = input.value, caret = input.selectionStart;
    if (caret !== input.selectionEnd) return false;
    if (direction < 0) {
      // Depuis la première ligne seulement : ailleurs, la flèche remonte dans le texte.
      if (value.slice(0, caret).includes("\n")) return false;
      if (historyAt === null) {
        if (!promptHistory.length) return false;
        historyDraft = value;
        historyAt = promptHistory.length;
      }
      if (historyAt === 0) return true;
      historyAt -= 1;
    } else {
      if (historyAt === null || value.slice(caret).includes("\n")) return false;
      historyAt += 1;
    }
    const back = historyAt >= promptHistory.length;
    const next = back ? historyDraft : promptHistory[historyAt];

    const at = direction < 0 ? 0 : next.length;

        // Suite d'une réponse coupée : même bloc, Markdown d'un seul tenant

        lastAnswer.node.replaceChildren(stable, tail);

      } else {

  // Différence ligne à ligne. Le début et la fin communs sont mis à part :
  // une modification touche d'ordinaire un court passage d'un long fichier.
  function lineDiff(oldText, newText) {
    const a = oldText === "" ? [] : String(oldText || "").split("\n");
    const b = newText === "" ? [] : String(newText || "").split("\n");
    let head = 0;
    while (head < a.length && head < b.length && a[head] === b[head]) head++;
    let tail = 0;
    while (tail < a.length - head && tail < b.length - head && a[a.length - 1 - tail] === b[b.length - 1 - tail]) tail++;
    const out = a.slice(0, head).map((t) => [" ", t]);
    const x = a.slice(head, a.length - tail), y = b.slice(head, b.length - tail);
    if (x.length * y.length > 250000) {
      for (const t of x) out.push(["-", t]);
      for (const t of y) out.push(["+", t]);
    } else {
      const n = x.length, m = y.length, dp = [];
      for (let i = 0; i <= n; i++) dp.push(new Uint32Array(m + 1));
      for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = x[i] === y[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      let i = 0, j = 0;
      while (i < n && j < m) {

        else if (dp[i + 1][j] >= dp[i][j + 1]) out.push(["-", x[i++]]);
        else out.push(["+", y[j++]]);

      while (i < n) out.push(["-", x[i++]]);
      while (j < m) out.push(["+", y[j++]]);

    for (const t of a.slice(a.length - tail)) out.push([" ", t]);

  function diffGroups(oldText, newText) {

    for (const [kind, text] of lineDiff(oldText, newText)) {
      if (kind === " ") {

      if (!group) { group = []; groups.push(group); }

  function changeCounts(groups) {
    let added = 0, removed = 0;
    for (const group of groups) for (const row of group) { if (row.o) removed++; if (row.n) added++; }
    return { added, removed };
  }
  function changeSummary({ added, removed }) {
    return '<span class="add">+' + added + '</span> <span class="del">−' + removed + "</span>";
  }
  // Repli au-delà de 14 rangées, comme la sortie d'une commande.
  function foldLong(holder, box, rows, what) {
    if (rows <= 14) return;
    box.classList.add("clipped");
    const more = el("button", "io-more", "Afficher les " + rows + " " + what);
    more.type = "button";
    more.onclick = () => { box.classList.remove("clipped"); more.remove(); };
    holder.append(more);
  }
  // Modification en deux colonnes, AVANT et APRÈS, sur les seules lignes
  // changées. Sans les fichiers entiers, les numéros de ligne restent inconnus.
  function showDiff(holder, groups, numbered) {
    holder.textContent = "";
    const grid = el("div", "sbs" + (numbered ? "" : " nonum"));
    grid.append(el("div", "sbs-h", "AVANT"), el("div", "sbs-h n", "APRÈS"));
    let rows = 0;
    groups.forEach((group, index) => {
      if (index) grid.append(el("div", "sbs-gap", "⋯"));
      for (const row of group) {
        grid.append(diffCell("o", row.o, row.n), diffCell("n", row.n, row.o));
        rows++;
      }
    });
    if (!rows) grid.append(el("div", "sbs-gap none", "Aucune ligne changée"));
    holder.append(grid);
    foldLong(holder, grid, rows, "lignes changées");
    return changeCounts(groups);
  }
  // Contenu d'un fichier écrit, numéroté, sur toute la largeur.
  function showContent(holder, content, path, label) {
    holder.textContent = "";
    const lines = String(content || "").replace(/\n$/, "").split("\n");
    const shown = lines.slice(0, 400);
    const box = el("div", "sbs full");
    const nums = el("pre", "nums", shown.map((_, index) => index + 1).join("\n") + (lines.length > 400 ? "\n…" : ""));
    const code = el("div", "code");
    const pre = el("pre");
    pre.innerHTML = highlight(shown.join("\n") + (lines.length > 400 ? "\n…" : ""), String(path || "").split(".").pop());
    code.append(pre);
    box.append(el("div", "sbs-h", label), nums, code);
    holder.append(box);
    foldLong(holder, box, lines.length, "lignes");
    return lines.length;
  }
  // Au résultat, le correctif porte le fichier entier d'avant (lignes « - »)
  // et d'après (lignes « + ») : la modification se redessine avec ses vrais
  // numéros de ligne, et une écriture qui remplace un fichier devient un
  // avant / après de ses seules lignes changées. Un résultat allégé (session
  // reprise) laisse la vue tirée de l'appel.
  function refineDiff(entry, value) {
    if (!value || typeof value !== "object") return;
    if (value.type === "create") {
      if (entry.written) showContent(entry.diff, entry.written.content, entry.written.path, "NOUVEAU FICHIER");
      return;
    }
    const hunks = Array.isArray(value.structuredPatch) ? value.structuredPatch : [];
    const groups = [];
    for (const hunk of hunks) {
      const lines = Array.isArray(hunk.lines) ? hunk.lines.map(String) : [];
      if (!lines.length) continue;
      const before = lines.filter((line) => line[0] !== "+").map((line) => line.slice(1)).join("\n");
      const after = lines.filter((line) => line[0] !== "-").map((line) => line.slice(1)).join("\n");
      for (const group of diffGroups(before, after)) {
        for (const row of group) {
          if (row.o) row.o.no += (hunk.oldStart || 1) - 1;
          if (row.n) row.n.no += (hunk.newStart || 1) - 1;
        }
        groups.push(group);
      }
    }
    if (!groups.length) return;
    entry.summary = changeSummary(showDiff(entry.diff, groups, true));
  }
  function todoList(todos) {
    const box = el("div", "todos");
    for (const todo of todos || []) {
      const row = el("div", "todo " + (todo.status === "completed" ? "done" : todo.status === "in_progress" ? "doing" : ""));
      const check = el("span", "box");
      if (todo.status === "completed") check.innerHTML = svg("check");
      row.append(check, el("span", null, todo.status === "in_progress" && todo.activeForm ? todo.activeForm : todo.content));
      box.appendChild(row);
    }
    return box;
  }
  function addToolCall(name, rawInput) {
    if (currentAssistant) finishAssistant();
    finishThinking();
    const value = parseJson(rawInput);
    const [icon, verb, target] = describeTool(name, value, rawInput);
    const command = (name === "bash" || name === "PowerShell") && value && value.command;
    // Commande : sa description en titre, la commande et sa sortie dessous.
    const parts = makeStep("running" + (command ? " cmd" : ""), icon, verb, command && value.description ? value.description : target);
    parts.meta.innerHTML = '<span class="spin" style="display:inline-block;vertical-align:-2px"></span>';
    if (command) {
      const io = el("div", "io");
      const input = el("div", "io-row");
      const code = el("pre", "io-v");
      code.innerHTML = highlight(value.command, name === "PowerShell" ? "ps1" : "sh");
      input.append(el("span", "io-k", "ENTRÉE"), code);
      const output = el("div", "io-row");
      const result = el("pre", "io-v");
      result.innerHTML = '<span class="spin"></span>';
      output.append(el("span", "io-k", "SORTIE"), result);
      io.append(input, output);
      parts.body.append(io);
      parts.output = { row: output, pre: result };
      toggleStep(parts.step, true);
    } else if (name === "edit_file" && value && (value.old_string !== undefined || value.new_string !== undefined)) {
      const holder = el("div", "diff-holder");
      parts.body.append(holder);
      parts.diff = holder;
      parts.summary = changeSummary(showDiff(holder, diffGroups(value.old_string, value.new_string), false));
      toggleStep(parts.step, true);
    } else if (name === "write_file" && value && value.content !== undefined) {
      const holder = el("div", "diff-holder");
      parts.body.append(holder);
      parts.diff = holder;
      parts.written = { content: value.content, path: value.path };
      const count = showContent(holder, value.content, value.path, "CONTENU");
      parts.summary = count + " ligne" + (count > 1 ? "s" : "");
      toggleStep(parts.step, true);
    } else if (name === "TodoWrite" && value) {
      parts.body.append(todoList(value.todos));
    } else if (name !== "read_file") {
      parts.body.append(el("div", "label", "Entrée"), el("pre", null, value ? JSON.stringify(value, null, 2) : rawInput));
    }
    stepsGroup().appendChild(parts.step);
    pendingTools.push({ name, ...parts, started: Date.now() });
    setActivity(verb + (target ? " · " + target : ""));
    scrollToBottom(false);
  }
  // Sortie d'une commande sans les remarques que Claw y joint pour le modèle
  // (lancement ou passage en arrière-plan, délai dépassé).
  function commandText(text) {
    text = String(text || "");
    if (text.startsWith("[Claw] ") || text.startsWith("Started in the background as ")) return "";
    const at = text.indexOf("\n[Claw] ");
    return at < 0 ? text : text.slice(0, at).replace(/\s+$/, "");
  }
  // Lancée d'emblée en arrière-plan, ou passée en arrière-plan après une première sortie.
  function backgroundLabel(task, shown) {
    return (shown ? "Continue en arrière-plan (" : "Lancé en arrière-plan (") + task + ")";
  }
  // L'essentiel du résultat (sortie de commande, contenu lu…) plutôt que le JSON brut.
  function resultView(output, isError) {
    const box = document.createDocumentFragment();
    const value = parseJson(output);
    let summary = "";
    if (value && typeof value === "object" && !Array.isArray(value)) {
      if ("stdout" in value || "stderr" in value) {
        const stdout = commandText(value.stdout), stderr = commandText(value.stderr);
        if (stdout) box.append(el("div", "label", "Sortie"), el("pre", null, stdout));
        if (stderr) box.append(el("div", "label", "Erreurs"), el("pre", "stderr", stderr));
        if (!stdout && !stderr && !value.backgroundTaskId) box.append(el("div", "note", "Aucune sortie"));
        if (value.returnCodeInterpretation) summary = value.returnCodeInterpretation.replace("exit_code:", "code ");
        if (value.backgroundTaskId) box.append(el("div", "note", backgroundLabel(value.backgroundTaskId, stdout || stderr)));
        return { box, summary };
      }
      if (value.file && typeof value.file.content === "string") {
        const file = value.file;
        const last = file.startLine + Math.max(file.numLines, 1) - 1;
        const pre = el("pre");
        pre.innerHTML = highlight(file.content, String(file.filePath || "").split(".").pop());
        box.append(el("div", "note", "Lignes " + file.startLine + "–" + last + " sur " + file.totalLines), pre);
        return { box, summary: file.totalLines + " lignes" };
      }
      if (value.filePath && (value.structuredPatch || value.content !== undefined)) {
        box.append(el("div", "note", (value.type === "create" ? "Fichier créé : " : "Fichier modifié : ") + displayPath(value.filePath)));
        return { box, summary: "" };
      }
      // Rapport d'un sous-agent (étude, vérification ultracode…) : son texte.
      if (typeof value.result === "string" && "agentId" in value) {
        const report = el("div", "md");
        report.innerHTML = renderMarkdown(value.result);
        box.append(report);
        return { box, summary: "" };
      }
      if (Array.isArray(value.answers)) {
        for (const item of value.answers) box.append(el("div", "label", item.question), el("div", "note", item.answer));
        return { box, summary: value.answers.length > 1 ? value.answers.length + " réponses" : "1 réponse" };
      }
      if (Array.isArray(value.filenames)) {
        box.append(el("pre", null, value.content || value.filenames.map(displayPath).join("\n") || "(aucun)"));
        return { box, summary: value.filenames.length + " fichier" + (value.filenames.length > 1 ? "s" : "") };
      }
    }
    box.append(el("div", "label", isError ? "Erreur" : "Résultat"),
      el("pre", isError ? "stderr" : null, value ? JSON.stringify(value, null, 2) : (skipReason(output) || "(vide)")));
    return { box, summary: "" };
  }
  // Motif d'un appel non exécuté, tel que Claw le rend au modèle, redit pour
  // qui lit la page.
  function skipReason(output) {
    const text = String(output || "");
    const feedback = text.match(/^l'utilisateur a refusé l'outil '[^']*' avec cette consigne : ([\s\S]*)$/);
    if (feedback) return "Refusé, avec cette consigne : " + feedback[1];
    if (text.startsWith("l'utilisateur a refusé l'outil")) return "Refusé : rien n'a été exécuté.";
    if (text.startsWith("aucune réponse de l'utilisateur") || text.startsWith("[Claw] Not run: nobody answered")) return "Demande d'autorisation restée sans réponse : rien n'a été exécuté.";
    if (text.startsWith("[Claw] Not run:")) return "Non demandé : une demande d'autorisation de ce tour est restée sans réponse ; rien n'a été exécuté.";
    if (text === "tour interrompu par l'utilisateur") return "Interrompu avant d'être exécuté.";
    return text;
  }
  // Sortie d'une commande dans sa carte : les 6 premières lignes, le reste sur demande.
  function fillCommandOutput(entry, output, isError) {
    const value = parseJson(output);
    let text = output || "";
    let summary = "";
    let failed = isError;
    if (value && typeof value === "object" && ("stdout" in value || "stderr" in value)) {
      const stdout = commandText(value.stdout), stderr = commandText(value.stderr);
      text = [stdout, stderr].filter(Boolean).join(stdout && stderr ? "\n" : "");
      if (value.returnCodeInterpretation) { summary = value.returnCodeInterpretation.replace("exit_code:", "code "); failed = true; }
      if (value.backgroundTaskId) text = (text ? text + "\n" : "") + backgroundLabel(value.backgroundTaskId, text);
    } else if (isError) {
      // Refusée, interrompue ou impossible à lancer : la commande n'a pas tourné.
      text = skipReason(output);
      summary = "non exécutée";
    }
    const pre = entry.output.pre;
    pre.textContent = text.trim() ? text.replace(/\s+$/, "") : "(aucune sortie)";
    pre.classList.toggle("err", failed && Boolean(text.trim()));
    const lines = pre.textContent.split("\n").length;
    if (lines > 6) {
      pre.classList.add("clipped");
      const more = el("button", "io-more", "Afficher les " + lines + " lignes");
      more.type = "button";
      more.onclick = () => { pre.classList.remove("clipped"); more.remove(); };
      entry.output.row.append(el("span"), more);
    }
    return { summary, failed };
  }
  // Un résultat gardé dans la session porte parfois, à sa suite, une remarque
  // que Claw adresse au modèle (« [Claw] … ») : elle n'est pas la sortie de l'outil.
  function splitClawNote(output) {
    const text = String(output || "");
    const cut = text.indexOf("\n\n[Claw] ");
    return cut < 0 ? [text, ""] : [text.slice(0, cut), text.slice(cut + 9).trim()];
  }
  // La vue d'un fichier jointe au résultat d'une modification est destinée au
  // modèle : la page la replie en une ligne, dépliable.
  function clawNote(note) {
    const node = el("div", "note claw-note");
    node.append(el("b", null, "Remarque de Claw au modèle : "));
    const END = "[Claw] End of file view.";
    const start = note.indexOf("File view: ");
    const end = note.indexOf(END);
    if (start < 0 || end < start) {
      node.append(note);
      return node;
    }
    const view = note.slice(start, end).trimEnd();
    const cut = view.indexOf("\n");
    const details = document.createElement("details");
    details.append(
      el("summary", null, cut < 0 ? view : view.slice(0, cut)),
      el("pre", null, cut < 0 ? "" : view.slice(cut + 1)),
    );
    node.append(note.slice(0, start).replace(/\[Claw\] $/, ""), details, note.slice(end + END.length));
    return node;
  }
  function attachToolResult(name, rawOutput, isError) {
    let index = pendingTools.findIndex((tool) => tool.name === name);
    if (index < 0 && pendingTools.length) index = 0;
    if (index < 0) { addToolCall(name, "{}"); index = pendingTools.length - 1; }
    const entry = pendingTools.splice(index, 1)[0];
    const [output, note] = splitClawNote(rawOutput);
    if (entry.output) {
      // Un code de sortie non nul est un échec, même si l'outil a répondu.
      const { summary, failed } = fillCommandOutput(entry, output, isError);
      if (note) entry.body.append(clawNote(note));
      entry.step.classList.remove("running");
      entry.step.classList.add(failed ? "error" : "ok");
      entry.meta.innerHTML = [summary, elapsed(entry.started)].filter(Boolean).join(" · ");
      if (!pendingTools.length) setActivity("Réflexion…");
      return;
    }
    if (entry.diff && !isError) refineDiff(entry, parseJson(output));
    const { box, summary } = resultView(output, isError);
    entry.body.append(box);
    if (note) entry.body.append(clawNote(note));
    entry.step.classList.remove("running");
    entry.step.classList.add(isError ? "error" : "ok");
    if (isError) entry.ic.innerHTML = svg("x");
    const parts = [entry.summary || summary, elapsed(entry.started)].filter(Boolean);
    entry.meta.innerHTML = parts.join(" · ");
    if (isError) toggleStep(entry.step, true);
    if (!pendingTools.length) setActivity("Réflexion…");
  }
  // Fin du tour : un appel resté sans résultat ne tourne plus, quoi qu'il lui
  // soit arrivé. Aucune étape ne reste affichée « en cours ».
  function closePendingTools() {
    while (pendingTools.length) {
      attachToolResult(pendingTools[0].name, "Non exécuté : le tour s'est terminé avant.", true);
    }
  }
  // Réponse abandonnée puis redemandée au modèle : les appels qu'elle annonçait
  // ne seront jamais exécutés. Leurs étapes disparaissent, sinon le résultat du
  // nouvel appel irait à l'ancienne étape et la nouvelle resterait « en cours ».
  function dropPendingTools() {
    const removeStep = (step) => {
      const group = step.parentElement;
      step.remove();
      if (group && !group.children.length) group.remove();
    };
    for (const entry of pendingTools.splice(0)) removeStep(entry.step);
    // Le début de texte de la réponse abandonnée : la nouvelle le redira.
    if (currentAssistant) {
      if (currentAssistant.frame) cancelAnimationFrame(currentAssistant.frame);
      currentAssistant.node.remove();
      currentAssistant = null;
    }
    if (thinkingStep) {
      removeStep(thinkingStep.step);
      thinkingStep = null;
    }
  }

  // ---------------------------------------------------------------- demandes épinglées
  // Tout ce qui attend une réponse (autorisation, questions de l'agent, modèle
  // qui ne répond plus) s'affiche au-dessus de la saisie, une demande à la
  // fois, et disparaît une fois répondu : rien ne reste dans la conversation.
  const asks = [];
  let activePermission = null, activeModelQuestion = null;
  function pushAsk(ask) {
    if (asks.some((known) => known.key === ask.key)) return;
    asks.push(ask);
    renderAsk();
  }
  function dropAsk(key) {
    const index = asks.findIndex((ask) => ask.key === key);
    if (index < 0) return;
    asks.splice(index, 1);
    renderAsk();
  }
  function renderAsk() {
    const bar = $("ask");
    bar.textContent = "";
    const ask = asks[0] || null;
    activePermission = ask && ask.kind === "permission" ? ask : null;
    activeModelQuestion = ask && ask.kind === "model" ? ask : null;
    pendingPermissions = asks.filter((entry) => entry.kind !== "model" || !entry.retryAt).length;
    bar.hidden = !ask;
    $("activity").hidden = !status.busy || !bar.hidden;
    updateTitle();
    if (!ask) return;
    if (asks.length > 1) bar.append(el("div", "more", "Demande 1 sur " + asks.length));
    ask.render(bar);
    if (ask.sending) for (const node of bar.querySelectorAll("button")) node.disabled = true;
  }
  function askButton(actions, label, className, action, key) {
    const node = el("button", "btn " + className, label);
    node.type = "button";
    if (key) node.append(el("kbd", null, key));
    node.onclick = action;
    actions.appendChild(node);
    return node;
  }
  // Envoie la réponse d'une demande ; en cas d'échec les boutons reviennent.
  async function answerAsk(ask, path, body) {
    if (ask.sending) return;
    ask.sending = true;
    renderAsk();
    try {
      await api(path, body);
    } catch (error) {
      toast("Réponse non transmise : " + error.message);
      ask.sending = false;
      renderAsk();
    }
  }

  // Autorisation d'un outil.
  function addPermission(event) {
    if (currentAssistant) finishAssistant();
    const ask = {
      key: "perm-" + event.id, kind: "permission", id: event.id, hasAlways: !!event.suggested_rule,
      noteOpen: false, note: "", sending: false,
      send(decision) {
        return answerAsk(ask, "/api/permission", { id: event.id, decision, feedback: decision === "deny" ? ask.note : "" });
      },
      render(bar) {
        const what = el("div", "what");
        what.innerHTML = svg("shield");
        what.append("Claw demande l'autorisation · " + event.tool);
        const actions = el("div", "actions");
        askButton(actions, "Autoriser", "primary", () => ask.send("once"), "Entrée");
        if (event.suggested_rule) {
          const always = askButton(actions, "Toujours : " + event.suggested_rule, "", () => ask.send("always"), "A");
          always.title = event.session_only ? "Valable jusqu'à la fin de la session" : "Ajouté à .claw/settings.local.json";
        }
        askButton(actions, "Refuser", "danger", () => ask.send("deny"), "Échap");
        bar.append(what, el("pre", "target", event.target || ""));
        if (ask.noteOpen) {
          const note = el("textarea");
          note.placeholder = "Consigne pour l'agent : que doit-il faire à la place ? Puis « Refuser ».";
          note.value = ask.note;
          note.oninput = () => { ask.note = note.value; };
          bar.append(note);
          setTimeout(() => note.focus(), 0);
        } else {
          askButton(actions, "Refuser avec une consigne", "", () => { ask.noteOpen = true; renderAsk(); });
        }
        bar.append(actions);
      },
    };
    pushAsk(ask);
  }
  function resolvePermission(id, decision) {
    dropAsk("perm-" + id);
    // Une règle enregistrée change les prochaines demandes : elle laisse une ligne dans le fil.
    const label = String(decision || "");
    if (label.startsWith("toujours autorisé")) addNote(label.charAt(0).toUpperCase() + label.slice(1));
  }

  // Questions de l'agent, avec des réponses proposées (outil AskUserQuestion).
  function addQuestion(event) {
    if (currentAssistant) finishAssistant();
    const questions = event.questions || [];
    if (!questions.length) return;
    const ask = {
      key: "question-" + event.id, kind: "question", id: event.id, index: 0, sending: false,
      picks: questions.map(() => new Set()), others: questions.map(() => ""),
      answerOf(position) {
        const other = ask.others[position].trim();
        return [...ask.picks[position], ...(other ? [other] : [])].join(", ");
      },
      submit(dismissed) {
        const answers = questions.map((question, position) => ({ question: question.question, answer: ask.answerOf(position) }));
        return answerAsk(ask, "/api/question", dismissed ? { id: event.id, dismissed: true } : { id: event.id, answers });
      },
      next() {
        if (!ask.answerOf(ask.index)) return;
        if (ask.index < questions.length - 1) { ask.index += 1; renderAsk(); } else ask.submit(false);
      },
      render(bar) {
        const question = questions[ask.index];
        const picks = ask.picks[ask.index];
        const what = el("div", "what");
        what.innerHTML = svg("info");
        what.append((questions.length > 1 ? "Question " + (ask.index + 1) + " sur " + questions.length : "Question") + (question.header ? " · " + question.header : ""));
        const choices = el("div", "choices");
        for (const option of question.options) {
          const choice = el("button", "btn choice" + (picks.has(option.label) ? " on" : ""));
          choice.type = "button";
          choice.setAttribute("aria-pressed", String(picks.has(option.label)));
          choice.append(el("b", null, option.label));
          if (option.description) choice.append(el("small", "desc", option.description));
          choice.onclick = () => {
            if (question.multi_select) {
              if (picks.has(option.label)) picks.delete(option.label); else picks.add(option.label);
              renderAsk();
            } else {
              // Un clic répond et passe à la suite.
              picks.clear();
              picks.add(option.label);
              ask.others[ask.index] = "";
              ask.next();
            }
          };
          choices.appendChild(choice);
        }
        const other = el("div", "other");
        const field = document.createElement("input");
        field.type = "text";
        field.placeholder = question.multi_select ? "Autre réponse à ajouter (facultatif)" : "Autre réponse : tapez-la ici";
        field.setAttribute("aria-label", "Autre réponse");
        field.value = ask.others[ask.index];
        other.append(field);
        const actions = el("div", "actions");
        const last = ask.index === questions.length - 1;
        const go = askButton(actions, last ? (questions.length > 1 ? "Envoyer les réponses" : "Envoyer") : "Suivant", "primary", () => ask.next());
        if (ask.index > 0) askButton(actions, "Précédent", "", () => { ask.index -= 1; renderAsk(); });
        askButton(actions, "Ne pas répondre", "", () => ask.submit(true)).title = "L'agent continue avec les choix qui lui semblent les plus raisonnables";
        const refresh = () => { go.disabled = ask.sending || !ask.answerOf(ask.index); };
        field.oninput = () => {
          ask.others[ask.index] = field.value;
          // Une réponse tapée remplace la proposition choisie.
          if (!question.multi_select && field.value.trim() && picks.size) { picks.clear(); for (const node of choices.children) node.classList.remove("on"); }
          refresh();
        };
        field.onkeydown = (keyEvent) => {
          if (keyEvent.key !== "Enter") return;
          keyEvent.preventDefault();
          keyEvent.stopPropagation();
          ask.next();
        };
        bar.append(
          what,
          el("div", "question", question.question),
          el("div", "hint", question.multi_select ? "Plusieurs réponses possibles, puis « " + go.firstChild.textContent + " »." : "Un clic sur une proposition répond."),
          choices, other, actions,
        );
        refresh();
      },
    };
    pushAsk(ask);
  }
  function resolveQuestion(id) { dropAsk("question-" + id); }

  // Modèle qui ne répond plus, ou agent qui n'avance plus.
  const secondsLeft = (until) => Math.max(0, Math.ceil((until - Date.now()) / 1000));
  function addModelQuestion(event) {
    finishAssistant();
    const automatic = typeof event.auto_retry_secs === "number";
    const suggestions = event.suggestions || [];
    const ask = {
      key: "model-" + event.id, kind: "model", id: event.id, sending: false, choosing: false,
      // Essai automatique : sans réponse, le même modèle reprend tout seul.
      retryAt: automatic ? Date.now() + event.auto_retry_secs * 1000 : null,
      answer(decision, model) { return answerAsk(ask, "/api/model-question", { id: event.id, decision, model }); },
      render(bar) {
        const name = modelName(event.model);
        const what = el("div", "what");
        what.innerHTML = svg("alert");
        what.append(event.stuck ? "L'agent n'avance plus avec " + name : name + " ne répond plus");
        const actions = el("div", "actions");
        if (ask.choosing) {
          const choices = el("div", "choices");
          for (const id of suggestions) {
            const choice = el("button", "btn choice");
            choice.type = "button";
            choice.append(el("b", null, modelName(id)), el("small", null, id));
            if (shortModel(id).free) choice.append(el("span", "measured", "gratuit"));
            choice.onclick = () => ask.answer("switch", id);
            choices.appendChild(choice);
          }
          const other = el("div", "other");
          const field = document.createElement("input");
          field.type = "text";
          field.placeholder = "Autre modèle : identifiant exact";
          field.setAttribute("aria-label", "Autre modèle");
          const use = el("button", "btn", "Utiliser");
          use.type = "button";
          const useOther = () => { const value = field.value.trim(); if (value) ask.answer("switch", value); };
          use.onclick = useOther;
          field.onkeydown = (keyEvent) => { if (keyEvent.key === "Enter") { keyEvent.preventDefault(); keyEvent.stopPropagation(); useOther(); } };
          other.append(field, use);
          askButton(actions, "Retour", "", () => { ask.choosing = false; renderAsk(); });
          bar.append(what, el("div", "detail", "Quel modèle prend la suite ? Il devient le modèle de la session."), choices, other, actions);
          return;
        }
        const waiting = Boolean(ask.retryAt);
        // Clé refusée, modèle introuvable, crédits épuisés : le même essai échouerait.
        const useless = event.retry_useful === false && !event.stuck && !waiting;
        const detail = el("div", "detail");
        if (waiting) {
          const count = el("b", "count", String(secondsLeft(ask.retryAt)));
          if (event.stuck) {
            detail.append("Deux essais n'ont pas suffi. Sans réponse de votre part, le même modèle continue dans ", count, " s.");
          } else {
            const attempt = event.attempt ? " (essai " + event.attempt + " sur " + event.attempts + ")" : "";
            detail.append("Raison : " + event.reason + ". Nouvel essai automatique dans ", count, " s" + attempt + ". Vous n'avez rien à faire.");
          }
        } else if (useless) {
          detail.textContent = "Raison : " + event.reason + ". Réessayer tel quel ne changerait rien : choisissez un autre modèle, ou arrêtez le tour.";
        } else {
          detail.textContent = event.stuck
            ? "Deux essais n'ont pas suffi. Le même modèle peut continuer, ou vous confiez la suite à un autre."
            : "Raison : " + event.reason + ". Le même modèle peut réessayer, ou vous en choisissez un autre.";
        }
        const retry = () => askButton(actions, event.stuck ? "Continuer avec le même modèle" : waiting ? "Réessayer maintenant" : useless ? "Réessayer quand même" : "Réessayer avec le même modèle", useless ? "" : "primary", () => ask.answer("retry"));
        if (!useless) retry();
        askButton(actions, "Changer de modèle", useless ? "primary" : "", () => {
          // Le temps de choisir, l'essai automatique attend.
          if (ask.retryAt) {
            ask.retryAt = null;
            api("/api/model-question", { id: event.id, decision: "hold" }).catch(() => {});
          }
          ask.choosing = true;
          renderAsk();
        });
        if (useless) retry();
        askButton(actions, "Arrêter le tour", "danger", () => ask.answer("stop"));
        bar.append(what, detail, actions);
      },
    };
    pushAsk(ask);
  }
  function resolveModelQuestion(id) { dropAsk("model-" + id); }
  // Compte à rebours de l'essai automatique.
  setInterval(() => {
    const count = document.querySelector("#ask .count");
    if (count && activeModelQuestion && activeModelQuestion.retryAt) count.textContent = String(secondsLeft(activeModelQuestion.retryAt));
  }, 500);

  // ---------------------------------------------------------------- autres événements
  // Avis du runtime (vérification, relecture, escalade…) : une ligne de la frise.

  function render(event) {
    switch (event.type) {
      case "user_message": finishAssistant(); addUser(event.text, event.at); break;
      case "user_image": finishAssistant(); addUserImage(event.url); break;
      case "assistant_text": finishThinking(); appendAssistant(event.text); break;
      case "thinking": appendThinking(event.text); break;
      case "tool_call": addToolCall(event.name, event.input); break;
      case "tool_result": attachToolResult(event.name, event.output, event.is_error); break;
      case "permission": addPermission(event); break;
      case "permission_resolved": resolvePermission(event.id, event.decision); break;
      case "model_question": addModelQuestion(event); break;
      case "model_question_resolved": resolveModelQuestion(event.id); break;
      case "question": addQuestion(event); break;
      case "question_resolved": resolveQuestion(event.id); break;
      case "info": finishAssistant(); addInfo(event.text); break;
      case "copy":
        finishAssistant();
        copyText(event.text).then((ok) => addInfo(ok
          ? "Réponse copiée dans le presse-papiers (" + event.text.length + " caractères)."
          : "Copie refusée par le navigateur : sélectionnez la réponse pour la copier."));
        break;
      case "notice": finishAssistant(); addNote(event.text); break;
      case "answer_drafted": markDraftAnswer(); break;
      case "answer_superseded": foldDraftAnswer(); break;
      case "answer_kept": keepFoldedAnswer(); break;
      case "reply_discarded": dropPendingTools(); break;
      case "reply_continues": continueAnswer = true; break;
      case "error": finishAssistant(); addError(event.message, event.hint); break;
      case "turn_done": finishAssistant(); closePendingTools(); if (benchPending) { benchPending = false; loadModels(); } break;
      case "status": applyStatus(event.status); break;
      case "credits": renderCredits(event.credits); break;
      case "reset": resetLog(); break;
    }
  }

  // ---------------------------------------------------------------- en-tête : modèle, mode, crédits
  function modeLabel(mode) { return (MODES.find(([id]) => id === mode) || [mode, mode])[1]; }
  function renderModelButton() {

  let lastCreditsText = "";

  function renderCredits(data) {
    const node = $("credits");
    if (!data || !data.available) { node.hidden = true; return; }
    lastCredits = data;
    if (creditsDialog) creditsDialog(data);
    const html = svg("coins") + (data.balance_text ? "<b>" + escapeHtml(data.balance_text) + "</b>" : "") +
      (data.free ? '<span class="sep"></span><span class="free"><b>' + data.free.remaining + '</b> <span class="sub">/ ' + data.free.limit + " gratuites</span></span>" : "");
    if (html !== lastCreditsText) {
      node.innerHTML = html;
      if (lastCreditsText) { node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash"); }
      lastCreditsText = html;
    }

      ? "\nCette session : " + data.session.free + " gratuite(s), " + data.session.paid + " payante(s)" : "";

    node.title = "OpenRouter : " + data.text + session + pending + "\nCliquer pour le détail";
