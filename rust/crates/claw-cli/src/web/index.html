  // ---------------------------------------------------------------- images jointes
  const IMAGE_TYPES = ["image/png", "image/jpeg", "image/gif", "image/webp"];
  function renderAttachments() {
    const box = $("attachments");
    box.textContent = "";
    pendingImages.forEach((image, index) => {
      const thumb = el("div", "thumb");
      const preview = document.createElement("img");
      preview.src = image.url;
      preview.alt = "Image à envoyer";
      const remove = el("button", null, "×");
      remove.type = "button";
      remove.title = "Retirer cette image";
      remove.onclick = () => { pendingImages.splice(index, 1); renderAttachments(); };
      thumb.append(preview, remove);
      box.appendChild(thumb);
    });
  }
  function addImageFile(file) {
    if (!file || !IMAGE_TYPES.includes(file.type)) { toast("Format non pris en charge (png, jpg, gif, webp)."); return; }
    if (file.size > 5 * 1024 * 1024) { toast("Image trop lourde (5 Mo maximum)."); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const url = String(reader.result);
      pendingImages.push({ media_type: file.type, data: url.slice(url.indexOf(",") + 1), url });
      renderAttachments();
    };
    reader.readAsDataURL(file);
  }
  input.addEventListener("paste", (event) => {
    const files = [...(event.clipboardData?.items || [])]
      .filter((item) => item.kind === "file" && item.type.startsWith("image/"))
      .map((item) => item.getAsFile());
    if (files.length) { event.preventDefault(); files.forEach(addImageFile); }
  });
  const composer = $("composer");
  composer.addEventListener("dragover", (event) => {
    if ([...(event.dataTransfer?.types || [])].includes("Files")) { event.preventDefault(); composer.classList.add("dragging"); }
  });
  composer.addEventListener("dragleave", () => composer.classList.remove("dragging"));
  composer.addEventListener("drop", (event) => {
    composer.classList.remove("dragging");
    const files = [...(event.dataTransfer?.files || [])].filter((file) => file.type.startsWith("image/"));
    if (files.length) { event.preventDefault(); files.forEach(addImageFile); }
  });
  $("file-input").addEventListener("change", (event) => {
    [...event.target.files].forEach(addImageFile);
    event.target.value = "";
  });

  // ---------------------------------------------------------------- saisie et suggestions
  let suggestionIndex = -1;
  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + "px";
  }
  function hideSuggestions() { $("suggestions").hidden = true; suggestionIndex = -1; }
  function onInput() {
    autoGrow();
    const value = input.value;
    const box = $("suggestions");
    if (!value.startsWith("/") || value.includes("\n") || (value.includes(" ") && !value.startsWith("/models "))) { hideSuggestions(); return; }
    const query = value.toLowerCase();
    const matches = COMMANDS.concat(customCommands).filter(([command]) => command.toLowerCase().startsWith(query));
    if (!matches.length) { hideSuggestions(); return; }
    if (suggestionIndex >= matches.length) suggestionIndex = matches.length - 1;
    box.textContent = "";
    const menu = el("div", "menu");
    const list = el("div", "list");
    matches.forEach(([command, label], index) => {
      const item = el("button", "item" + (index === suggestionIndex ? " active" : ""));
      item.type = "button";
      const grow = el("span", "grow");
      grow.append(el("b", null, command), el("span", null, label));
      item.append(grow);
      item.onmousedown = (event) => { event.preventDefault(); completeCommand(command); };
      list.append(item);
    });
    menu.append(list);
    box.append(menu);
    box.hidden = false;
    const active = list.querySelector(".active");
    if (active) active.scrollIntoView({ block: "nearest" });
  }
  function completeCommand(command) {
    input.value = command + " ";
    hideSuggestions();
    input.focus();
    autoGrow();
  }
  input.addEventListener("input", () => { suggestionIndex = -1; onInput(); });
  input.addEventListener("keydown", (event) => {
    const box = $("suggestions");
    if (!box.hidden) {
      const items = box.querySelectorAll(".item");
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        suggestionIndex = (suggestionIndex + (event.key === "ArrowDown" ? 1 : items.length - 1 + (suggestionIndex < 0 ? 1 : 0))) % items.length;
        onInput();
        return;
      }
      if (event.key === "Tab" || (event.key === "Enter" && suggestionIndex >= 0)) {
        event.preventDefault();
        completeCommand(items[Math.max(0, suggestionIndex)].querySelector("b").textContent);
        return;
      }
      if (event.key === "Escape") { event.preventDefault(); event.stopPropagation(); hideSuggestions(); return; }
    }
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener("click", () => (status.busy && !input.value.trim() && !pendingImages.length ? interruptTurn() : sendMessage()));
  $("activity-stop").addEventListener("click", interruptTurn);
  $("attach-btn").addEventListener("click", () => $("file-input").click());
  $("slash-btn").addEventListener("click", () => {
    if (!input.value.startsWith("/")) input.value = "/";
    input.focus();
    onInput();
  });
  $("model-btn").addEventListener("click", openModelMenu);
  $("mode-btn").addEventListener("click", openModeMenu);
  $("sessions-btn").addEventListener("click", openSessionsMenu);
  $("credits").addEventListener("click", openCreditsDialog);
  $("theme-btn").addEventListener("click", cycleTheme);
  $("to-bottom").addEventListener("click", () => scrollToBottom(true));
  log.addEventListener("scroll", updateToBottom, { passive: true });
  log.addEventListener("click", async (event) => {
    const button = event.target.closest("[data-copy]");
    if (!button) return;
    const code = button.closest(".codeblock").querySelector("pre code").textContent;
    try {
      await navigator.clipboard.writeText(code);
      button.innerHTML = svg("check") + "Copié";
    } catch (_) {
      button.textContent = "Copie impossible";
    }
    setTimeout(() => { button.innerHTML = svg("copy") + "Copier"; }, 1600);
  });

  // Raccourcis : Ctrl+K palette, Échap (refuser une autorisation / interrompre /
  // fermer), Entrée et A pour répondre à une autorisation.
  document.addEventListener("keydown", (event) => {
    const typing = event.target === input || event.target.tagName === "TEXTAREA" || event.target.tagName === "INPUT";
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") { event.preventDefault(); openPalette(); return; }
    if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === "o") { event.preventDefault(); newConversation(); return; }
    if (event.key === "Escape") {
      if (openMenu) { closeMenu(); return; }
      if (activePermission) { event.preventDefault(); activePermission.send("deny"); return; }
      if (status.busy) { interruptTurn(); return; }
    }
    if (activePermission && (!typing || (event.target === input && !input.value))) {
      if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); activePermission.send("once"); return; }
      if (event.key.toLowerCase() === "a" && activePermission.hasAlways && !typing) { event.preventDefault(); activePermission.send("always"); return; }
    }
    if (!typing && !event.ctrlKey && !event.metaKey && !event.altKey && event.key.length === 1) input.focus();
  });

  // ---------------------------------------------------------------- flux SSE
  function setConnection(state, text) {
    $("conn").className = "conn " + state;
    $("conn-text").textContent = text;
  }
  function connect() {
    const source = new EventSource("/api/events?token=" + encodeURIComponent(token));
    source.addEventListener("snapshot", (message) => {
      const data = JSON.parse(message.data);
      status = {};
      resetLog();
      applyStatus(data.status);
      for (const event of data.transcript) render(event);
      finishAssistant();
      scrollToBottom(true);
      setConnection("", "Connecté");
    });
    source.addEventListener("event", (message) => render(JSON.parse(message.data)));
    source.addEventListener("resync", () => { source.close(); connect(); });
    source.onerror = () => {
      // Fermée définitivement (ex. 401) : le jeton change à chaque lancement de `claw serve`.
      if (source.readyState === EventSource.CLOSED) setConnection("off", "Déconnecté : rouvrez l'adresse affichée par « claw serve »");
      else setConnection("wait", "Reconnexion…");
    };
  }

  // ---------------------------------------------------------------- démarrage
  if (embedded) root.dataset.embed = "1";
  applyTheme();
  renderSessionsButton();
  $("attach-btn").innerHTML = svg("clip");
  $("slash-btn").innerHTML = svg("slash");
  $("to-bottom").innerHTML = svg("arrowDown") + "Derniers messages";
  sendBtn.innerHTML = svg("arrowUp");
  renderModelButton();
  renderModeButton();
  resetLog();
  if (!token) {
    addError("jeton d'accès manquant", "ouvrez l'adresse complète affichée par « claw serve » (elle contient ?token=…)");
    sendBtn.disabled = true;
    setConnection("off", "Sans jeton");
  } else {
    connect();
    loadModels();
    loadCredits();
    loadCustomCommands();
    input.addEventListener("focus", loadCustomCommands);
    input.focus();
  }
})();
</script>
</body>
</html>
